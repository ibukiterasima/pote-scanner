<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>POTE CODE SCANNER</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  background:#f7f2e3;
  overflow:hidden;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Sans",
    "Yu Gothic",
    sans-serif;
}

body{
  display:flex;
  align-items:center;
  justify-content:center;
}

#app{
  width:100%;
  height:100%;

  display:flex;
  flex-direction:column;

  align-items:center;
  justify-content:center;

  padding:20px;
}

.camera{
  position:relative;

  width:min(92vw,650px);
  aspect-ratio:1/1;

  border-radius:28px;

  overflow:hidden;

  background:#ded8ca;
}

video,
#imagePreview{
  position:absolute;

  inset:0;

  width:100%;
  height:100%;

  object-fit:cover;

  display:none;
}

video.active,
#imagePreview.active{
  display:block;
}


/* =====================================================
   丸いガイド
===================================================== */

.guide{
  position:absolute;

  left:50%;
  top:50%;

  width:86%;
  aspect-ratio:1/1;

  transform:
    translate(-50%,-50%);

  border:
    3px dashed
    rgba(255,255,255,.92);

  border-radius:50%;

  pointer-events:none;

  filter:
    drop-shadow(
      0 1px 4px
      rgba(0,0,0,.3)
    );
}


/* =====================================================
   ボタン
===================================================== */

.buttons{
  width:min(92vw,650px);

  display:flex;

  gap:10px;

  margin-top:16px;
}

button{
  flex:1;

  border:0;

  border-radius:999px;

  padding:15px 18px;

  background:#71866c;

  color:white;

  font-size:16px;

  font-weight:700;

  cursor:pointer;

  -webkit-tap-highlight-color:transparent;
}

button:active{
  transform:scale(.98);
}


/* =====================================================
   画像
===================================================== */

input[type=file]{
  display:none;
}


/* =====================================================
   結果
===================================================== */

#result{
  width:min(92vw,650px);

  margin-top:14px;

  padding:12px 16px;

  min-height:46px;

  border-radius:14px;

  background:
    rgba(255,255,255,.72);

  color:#66584d;

  font-size:16px;

  text-align:center;

  word-break:break-word;

  display:none;
}


/* =====================================================
   バージョン
===================================================== */

.version{
  margin-top:4px;

  font-size:9px;

  opacity:.42;

  letter-spacing:.08em;
}
</style>
</head>

<body>

<div id="app">

  <div class="camera">

    <video
      id="video"
      autoplay
      playsinline>
    </video>

    <img
      id="imagePreview"
      alt="">

    <div class="guide"></div>

  </div>


  <div class="buttons">

    <button id="scanButton">
      スキャン
    </button>

    <button id="imageButton">
      画像から読み込み
    </button>

  </div>


  <input
    id="fileInput"
    type="file"
    accept="image/*">


  <div id="result"></div>


  <div class="version">
    POTE CODE SCANNER ver 1.1
  </div>

</div>


<script>

/* =========================================================
   POTE CODE SCANNER ver 1.1

   3つの角度合わせマーク：

   O                 O


   O

   これを使って
   位置・回転・拡大縮小を補正する。

   データは544スロット。

   各スロット：
   図形あり = 1
   図形なし = 0

========================================================= */


/* =========================================================
   DOM
========================================================= */

const video=
  document.getElementById("video");

const imagePreview=
  document.getElementById("imagePreview");

const scanButton=
  document.getElementById("scanButton");

const imageButton=
  document.getElementById("imageButton");

const fileInput=
  document.getElementById("fileInput");

const result=
  document.getElementById("result");


/* =========================================================
   状態
========================================================= */

let stream=null;

let scanning=false;

let scanTimer=null;

let scanBusy=false;


/*
 URLを新しいタブで開くため、
 スキャンボタンを押した時点で
 空のタブを確保する。

 普通の文字なら後で閉じる。
*/

let pendingWindow=null;


/* =========================================================
   固定値
========================================================= */

const CENTER=750;

const SLOT_COUNT=544;

const MIN_R=175;

const MAX_R=640;


/* =========================================================
   固定スロット
   生成側と完全に同じ。
========================================================= */

let seed=9283746;

function random(){

  seed=
    (seed*1664525+1013904223)
    >>>0;

  return seed/4294967296;

}


function createSlots(){

  seed=9283746;

  const result=[];

  const MIN_DISTANCE=35;

  let safety=0;


  while(
    result.length<SLOT_COUNT &&
    safety<1000000
  ){

    safety++;


    const r=
      Math.sqrt(
        random()*
        (
          MAX_R*MAX_R-
          MIN_R*MIN_R
        )+
        MIN_R*MIN_R
      );


    const angle=
      random()*Math.PI*2;


    const x=
      CENTER+
      Math.cos(angle)*r;


    const y=
      CENTER+
      Math.sin(angle)*r;


    let ok=true;


    for(
      const p of result
    ){

      const dx=x-p.x;

      const dy=y-p.y;


      if(
        dx*dx+
        dy*dy<
        MIN_DISTANCE*MIN_DISTANCE
      ){

        ok=false;

        break;

      }

    }


    const marks=[
      {x:255,y:275},
      {x:1245,y:275},
      {x:255,y:1245}
    ];


    for(
      const m of marks
    ){

      const dx=x-m.x;

      const dy=y-m.y;


      if(
        dx*dx+
        dy*dy<
        90*90
      ){

        ok=false;

        break;

      }

    }


    if(ok){

      result.push({
        x,
        y
      });

    }

  }


  return result;

}


const DATA_SLOTS=
  createSlots();


/* =========================================================
   角度合わせマーク
========================================================= */

const ALIGN_MARKS=[
  {
    x:255,
    y:275
  },
  {
    x:1245,
    y:275
  },
  {
    x:255,
    y:1245
  }
];


/* =========================================================
   Canvas
========================================================= */

const canvas=
  document.createElement("canvas");

const ctx=
  canvas.getContext(
    "2d",
    {
      willReadFrequently:true
    }
  );


/* =========================================================
   スキャン開始
========================================================= */

scanButton.addEventListener(
  "click",
  async()=>{

    /*
      URLだった場合に
      新しいタブを開けるように
      先に空タブを確保。
    */

    try{

      pendingWindow=
        window.open(
          "",
          "_blank"
        );

    }
    catch(e){

      pendingWindow=null;

    }


    try{

      if(
        !stream
      ){

        stream=
          await navigator.mediaDevices
          .getUserMedia({

            video:{
              facingMode:{
                ideal:"environment"
              },

              width:{
                ideal:1920
              },

              height:{
                ideal:1920
              }
            },

            audio:false

          });

      }


      video.srcObject=stream;

      video.classList.add("active");

      imagePreview.classList.remove("active");

      result.style.display="none";

      scanning=true;

      scanButton.textContent=
        "スキャン中";


      if(scanTimer){

        clearInterval(
          scanTimer
        );

      }


      /*
        約8回/秒で解析。
      */

      scanTimer=
        setInterval(
          scanCameraFrame,
          125
        );


    }
    catch(error){

      if(pendingWindow){

        pendingWindow.close();

        pendingWindow=null;

      }


      alert(
        "カメラを起動できませんでした。"
      );

    }

  }
);


/* =========================================================
   カメラフレーム
========================================================= */

function scanCameraFrame(){

  if(
    !scanning ||
    scanBusy
  ){

    return;

  }


  if(
    video.readyState<2
  ){

    return;

  }


  scanBusy=true;


  try{

    const w=
      video.videoWidth;

    const h=
      video.videoHeight;


    if(
      !w ||
      !h
    ){

      return;

    }


    const max=1200;


    const scale=
      Math.min(
        1,
        max/Math.max(w,h)
      );


    canvas.width=
      Math.round(w*scale);

    canvas.height=
      Math.round(h*scale);


    ctx.drawImage(
      video,
      0,
      0,
      canvas.width,
      canvas.height
    );


    tryDecode();

  }
  finally{

    scanBusy=false;

  }

}


/* =========================================================
   画像読み込み
========================================================= */

imageButton.addEventListener(
  "click",
  ()=>{
    fileInput.click();
  }
);


fileInput.addEventListener(
  "change",
  ()=>{

    const file=
      fileInput.files[0];


    if(!file){

      return;

    }


    if(scanTimer){

      clearInterval(
        scanTimer
      );

      scanTimer=null;

    }


    scanning=false;


    if(pendingWindow){

      pendingWindow.close();

      pendingWindow=null;

    }


    const url=
      URL.createObjectURL(file);


    imagePreview.src=url;


    imagePreview.onload=()=>{

      video.classList.remove("active");

      imagePreview.classList.add("active");


      const w=
        imagePreview.naturalWidth;

      const h=
        imagePreview.naturalHeight;


      const max=1600;


      const scale=
        Math.min(
          1,
          max/Math.max(w,h)
        );


      canvas.width=
        Math.round(w*scale);

      canvas.height=
        Math.round(h*scale);


      ctx.drawImage(
        imagePreview,
        0,
        0,
        canvas.width,
        canvas.height
      );


      tryDecode();

    };

  }
);


/* =========================================================
   円形マーク検出
========================================================= */

function findAlignmentMarks(){

  const w=
    canvas.width;

  const h=
    canvas.height;


  const image=
    ctx.getImageData(
      0,
      0,
      w,
      h
    );


  const data=
    image.data;


  /*
    生成側の角度合わせマークは
    #51483F。

    データ図形にはこの色を
    使っていない。

    そのため色相を使って
    登録マークを探せる。
  */

  const candidates=[];

  const step=
    Math.max(
      3,
      Math.floor(
        Math.min(w,h)/450
      )
    );


  for(
    let y=0;
    y<h;
    y+=step
  ){

    for(
      let x=0;
      x<w;
      x+=step
    ){

      const i=
        (y*w+x)*4;


      const r=data[i];

      const g=data[i+1];

      const b=data[i+2];


      /*
        #51483F付近の暗い茶色。

        カメラの色変化を考えて
        少し幅を持たせる。
      */

      if(
        r<115 &&
        g<105 &&
        b<100 &&
        Math.abs(r-g)<35 &&
        Math.abs(g-b)<30
      ){

        candidates.push({
          x,
          y
        });

      }

    }

  }


  /*
    暗い点の集まりを
    クラスタリングする。
  */

  const clusters=[];

  const used=
    new Uint8Array(
      candidates.length
    );


  const clusterDistance=
    Math.min(w,h)*.035;


  for(
    let i=0;
    i<candidates.length;
    i++
  ){

    if(used[i]){
      continue;
    }


    const queue=[i];

    used[i]=1;


    let sx=0;

    let sy=0;

    let count=0;


    while(queue.length){

      const index=
        queue.pop();


      const p=
        candidates[index];


      sx+=p.x;

      sy+=p.y;

      count++;


      for(
        let j=0;
        j<candidates.length;
        j++
      ){

        if(used[j]){
          continue;
        }


        const q=
          candidates[j];


        const dx=
          p.x-q.x;

        const dy=
          p.y-q.y;


        if(
          dx*dx+
          dy*dy<
          clusterDistance*
          clusterDistance
        ){

          used[j]=1;

          queue.push(j);

        }

      }

    }


    if(
      count>=4
    ){

      clusters.push({
        x:sx/count,
        y:sy/count,
        count
      });

    }

  }


  /*
    大きいクラスタを候補にする。
  */

  clusters.sort(
    (a,b)=>b.count-a.count
  );


  return clusters.slice(
    0,
    40
  );

}


/* =========================================================
   3マークを選ぶ
========================================================= */

function assignMarks(points){

  if(
    points.length<3
  ){

    return null;

  }


  let best=null;

  let bestScore=Infinity;


  /*
    3点を全部組み合わせる。
  */

  for(
    let i=0;
    i<points.length;
    i++
  ){

    for(
      let j=i+1;
      j<points.length;
      j++
    ){

      for(
        let k=j+1;
        k<points.length;
        k++
      ){

        const ps=[
          points[i],
          points[j],
          points[k]
        ];


        /*
          上2点・左下1点になる
          並びを試す。
        */

        const sorted=
          [...ps].sort(
            (a,b)=>a.y-b.y
          );


        const topA=
          sorted[0];

        const topB=
          sorted[1];

        const bottom=
          sorted[2];


        const left=
          topA.x<topB.x
          ?topA
          :topB;


        const right=
          topA.x<topB.x
          ?topB
          :topA;


        const topY=
          (left.y+right.y)/2;


        const topHeight=
          Math.abs(
            left.y-right.y
          );


        const topWidth=
          Math.abs(
            right.x-left.x
          );


        if(
          topWidth<
          Math.min(wSafe(),hSafe())*.25
        ){

          continue;

        }


        if(
          topHeight>
          topWidth*.45
        ){

          continue;

        }


        /*
          左下マークなので
          bottomは上2点の左側付近。
        */

        const expectedX=
          left.x;


        const dx=
          Math.abs(
            bottom.x-
            expectedX
          );


        const dy=
          bottom.y-
          topY;


        if(
          dy<=topWidth*.25
        ){

          continue;

        }


        const score=
          topHeight+
          dx+
          Math.abs(
            dy-topWidth
          )*.25;


        if(
          score<bestScore
        ){

          bestScore=score;

          best={
            left,
            right,
            bottom
          };

        }

      }

    }

  }


  return best;

}


function wSafe(){

  return canvas.width;

}


function hSafe(){

  return canvas.height;

}


/* =========================================================
   アフィン変換
========================================================= */

function makeAffine(mark){

  const p1=
    mark.left;

  const p2=
    mark.right;

  const p3=
    mark.bottom;


  const q1=
    ALIGN_MARKS[0];

  const q2=
    ALIGN_MARKS[1];

  const q3=
    ALIGN_MARKS[2];


  const x1=p1.x;
  const y1=p1.y;

  const x2=p2.x;
  const y2=p2.y;

  const x3=p3.x;
  const y3=p3.y;


  const det=
    x1*(y2-y3)+
    x2*(y3-y1)+
    x3*(y1-y2);


  if(
    Math.abs(det)<1
  ){

    return null;

  }


  const a=
    (
      q1.x*(y2-y3)+
      q2.x*(y3-y1)+
      q3.x*(y1-y2)
    )/det;


  const b=
    (
      q1.x*(x3-x2)+
      q2.x*(x1-x3)+
      q3.x*(x2-x1)
    )/det;


  const c=
    (
      q1.x*(x2*y3-x3*y2)+
      q2.x*(x3*y1-x1*y3)+
      q3.x*(x1*y2-x2*y1)
    )/det;


  const d=
    (
      q1.y*(y2-y3)+
      q2.y*(y3-y1)+
      q3.y*(y1-y2)
    )/det;


  const e=
    (
      q1.y*(x3-x2)+
      q2.y*(x1-x3)+
      q3.y*(x2-x1)
    )/det;


  const f=
    (
      q1.y*(x2*y3-x3*y2)+
      q2.y*(x3*y1-x1*y3)+
      q3.y*(x1*y2-x2*y1)
    )/det;


  return {
    a,b,c,d,e,f
  };

}


/* =========================================================
   POTE座標 → 画像座標
========================================================= */

function codeToImage(
  T,
  x,
  y
){

  const det=
    T.a*T.e-
    T.b*T.d;


  if(
    Math.abs(det)<0.000001
  ){

    return null;

  }


  const tx=
    x-T.c;

  const ty=
    y-T.f;


  return {

    x:
      (
        T.e*tx-
        T.b*ty
      )/det,

    y:
      (
        -T.d*tx+
        T.a*ty
      )/det

  };

}


/* =========================================================
   図形判定

   データ図形の色を
   直接覚えるのではなく、

   「背景から変化しているか」

   を見る。
========================================================= */

function readShapeAt(
  x,
  y
){

  const radius=9;

  const left=
    Math.max(
      0,
      Math.floor(x-radius)
    );

  const top=
    Math.max(
      0,
      Math.floor(y-radius)
    );

  const right=
    Math.min(
      canvas.width-1,
      Math.ceil(x+radius)
    );

  const bottom=
    Math.min(
      canvas.height-1,
      Math.ceil(y+radius)
    );


  if(
    right<=left ||
    bottom<=top
  ){

    return 0;

  }


  const width=
    right-left+1;


  const image=
    ctx.getImageData(
      left,
      top,
      width,
      bottom-top+1
    );


  const data=
    image.data;


  let colored=0;

  let total=0;


  for(
    let py=0;
    py<=bottom-top;
    py+=2
  ){

    for(
      let px=0;
      px<=right-left;
      px+=2
    ){

      const dx=
        left+px-x;

      const dy=
        top+py-y;


      if(
        dx*dx+
        dy*dy>
        radius*radius
      ){

        continue;

      }


      const i=
        (
          py*width+
          px
        )*4;


      const r=data[i];

      const g=data[i+1];

      const b=data[i+2];


      const brightness=
        (r+g+b)/3;


      const saturation=
        Math.max(r,g,b)-
        Math.min(r,g,b);


      /*
        背景に近い白ではない
        色付き領域。
      */

      if(
        brightness<230 ||
        saturation>18
      ){

        colored++;

      }


      total++;

    }

  }


  return
    colored/
    Math.max(
      1,
      total
    )>.20
    ?1
    :0;

}


/* =========================================================
   全544スロット
========================================================= */

function readAllSlots(T){

  const bits=[];


  for(
    let i=0;
    i<DATA_SLOTS.length;
    i++
  ){

    const p=
      DATA_SLOTS[i];


    const imagePoint=
      codeToImage(
        T,
        p.x,
        p.y
      );


    if(!imagePoint){

      bits.push(0);

      continue;

    }


    bits.push(
      readShapeAt(
        imagePoint.x,
        imagePoint.y
      )
    );

  }


  return bits;

}


/* =========================================================
   組み合わせ
========================================================= */

function C(n,k){

  if(
    k<0||
    k>n
  ){

    return 0;

  }


  k=
    Math.min(
      k,
      n-k
    );


  let r=1;


  for(
    let i=1;
    i<=k;
    i++
  ){

    r=
      r*(n-k+i)/i;

  }


  return Math.round(r);

}


/* =========================================================
   rank
========================================================= */

function rank(bits){

  let r=0;

  let ones=16;


  for(
    let i=0;
    i<32;
    i++
  ){

    if(
      bits[i]===1
    ){

      r+=
        C(
          31-i,
          ones
        );

      ones--;

    }

  }


  return r;

}


/* =========================================================
   CRC8
========================================================= */

function crc8(bits){

  let crc=0;


  for(
    const bit of bits
  ){

    const mix=
      ((crc>>7)&1)^bit;


    crc=
      (crc<<1)&255;


    if(mix){

      crc^=0x07;

    }

  }


  return crc;

}


/* =========================================================
   544 → 493
========================================================= */

function decodeBits(allBits){

  if(
    allBits.length<
    SLOT_COUNT
  ){

    return null;

  }


  const packet=[];


  for(
    let g=0;
    g<17;
    g++
  ){

    const group=
      allBits.slice(
        g*32,
        g*32+32
      );


    const count=
      group.reduce(
        (a,b)=>a+b,
        0
      );


    /*
      16個ONでなければ
      誤検出として破棄。
    */

    if(
      count!==16
    ){

      return null;

    }


    const value=
      rank(group);


    let n=value;


    for(
      let i=28;
      i>=0;
      i--
    ){

      const power=
        Math.pow(
          2,
          i
        );


      packet.push(
        Math.floor(
          n/power
        )%2
      );

    }

  }


  return packet.slice(
    0,
    493
  );

}


/* =========================================================
   パケット → 文字
========================================================= */

function bitsToText(packet){

  if(
    !packet ||
    packet.length<493
  ){

    return null;

  }


  let length=0;


  for(
    let i=0;
    i<5;
    i++
  ){

    length=
      length*2+
      packet[i];

  }


  if(
    length<1||
    length>30
  ){

    return null;

  }


  const body=
    packet.slice(
      5,
      485
    );


  const crcBits=
    packet.slice(
      485,
      493
    );


  let storedCRC=0;


  for(
    const bit of crcBits
  ){

    storedCRC=
      storedCRC*2+
      bit;

  }


  const actualCRC=
    crc8(body);


  if(
    storedCRC!==actualCRC
  ){

    return null;

  }


  let text="";


  for(
    let i=0;
    i<length;
    i++
  ){

    let code=0;


    for(
      let b=0;
      b<16;
      b++
    ){

      code=
        code*2+
        body[
          i*16+b
        ];

    }


    text+=
      String.fromCharCode(code);

  }


  return text;

}


/* =========================================================
   URL判定
========================================================= */

function isURL(text){

  return /^https?:\/\/[^\s]+$/i.test(
    text.trim()
  );

}


/* =========================================================
   読み取り成功
========================================================= */

function success(text){

  scanning=false;


  if(scanTimer){

    clearInterval(
      scanTimer
    );

    scanTimer=null;

  }


  scanButton.textContent=
    "スキャン";


  /*
    URLなら新しいタブ。

    スキャンボタンを押した時点で
    確保しておいたタブを使う。
  */

  if(
    isURL(text)
  ){

    if(
      pendingWindow &&
      !pendingWindow.closed
    ){

      pendingWindow.location.href=
        text.trim();

      pendingWindow=null;

    }
    else{

      /*
        ポップアップブロック等で
        タブを確保できなかった場合。
      */

      window.open(
        text.trim(),
        "_blank"
      );

    }


    result.style.display="none";

    return;

  }


  /*
    URLではない場合
  */

  if(pendingWindow){

    try{

      pendingWindow.close();

    }
    catch(e){}

    pendingWindow=null;

  }


  result.style.display="block";

  result.textContent=text;

}


/* =========================================================
   メイン
========================================================= */

function tryDecode(){

  const candidates=
    findAlignmentMarks();


  const marks=
    assignMarks(
      candidates
    );


  if(!marks){

    return;

  }


  const T=
    makeAffine(marks);


  if(!T){

    return;

  }


  const bits=
    readAllSlots(T);


  const packet=
    decodeBits(bits);


  if(!packet){

    return;

  }


  const text=
    bitsToText(packet);


  if(
    text===null
  ){

    return;

  }


  success(text);

}


/* =========================================================
   終了処理
========================================================= */

window.addEventListener(
  "beforeunload",
  ()=>{

    if(scanTimer){

      clearInterval(
        scanTimer
      );

    }


    if(stream){

      stream
        .getTracks()
        .forEach(
          track=>track.stop()
        );

    }


    if(pendingWindow){

      try{

        pendingWindow.close();

      }
      catch(e){}

    }

  }
);

</script>
