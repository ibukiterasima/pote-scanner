  POTE CODE SCANNER ver 1.4
</div>


<script>
"use strict";

/* =========================================================
   POTE CODE SCANNER ver 1.4

   ★ 生成側 ver 1.1 と完全互換

   30文字
   UTF-16
   480bit
   文字数5bit
   CRC8 8bit
   合計493bit

   32スロット × 17グループ
   = 544スロット

   各グループは必ず16個ON。

   データ：
   図形あり = 1
   図形なし = 0
========================================================= */


/* =========================================================
   DOM
========================================================= */

const video=
  document.getElementById("video");

const canvas=
  document.getElementById("canvas");

const ctx=
  canvas.getContext(
    "2d",
    {
      willReadFrequently:true
    }
  );

const scanButton=
  document.getElementById("scanButton");

const imageButton=
  document.getElementById("imageButton");

const file=
  document.getElementById("file");

const message=
  document.getElementById("message");

const loading=
  document.getElementById("loading");

const result=
  document.getElementById("result");

const resultText=
  document.getElementById("resultText");

const closeButton=
  document.getElementById("close");


/* =========================================================
   POTE CODE 固定値
========================================================= */

const CENTER=750;

const SLOT_COUNT=544;

const MIN_R=175;

const MAX_R=640;

const MIN_DISTANCE=35;


/*
  生成側と完全に同じ。
*/

const MARKS=[
  {x:255,y:275},
  {x:1245,y:275},
  {x:255,y:1245}
];


/* =========================================================
   生成側と完全に同じ乱数
========================================================= */

let seed=9283746;

function random(){

  seed=
    (seed*1664525+1013904223)
    >>>0;

  return seed/4294967296;
}


/* =========================================================
   生成側と完全に同じスロット生成
========================================================= */

function createSlots(){

  seed=9283746;

  const result=[];

  let safety=0;

  const marks=[
    {x:255,y:275},
    {x:1245,y:275},
    {x:255,y:1245}
  ];


  while(
    result.length<SLOT_COUNT &&
    safety<1000000
  ){

    safety++;


    /*
      ★ここが重要

      生成側と完全に同じ式。
    */

    const r=
      Math.sqrt(
        random()*
        (
          MAX_R*MAX_R-
          MIN_R*MIN_R
        )+
        MIN_R*MIN_R
      );


    const angle=
      random()*Math.PI*2;


    const x=
      CENTER+
      Math.cos(angle)*r;


    const y=
      CENTER+
      Math.sin(angle)*r;


    let ok=true;


    /*
      生成側と完全に同じ
      中心間距離判定。
    */

    for(
      const p of result
    ){

      const dx=x-p.x;
      const dy=y-p.y;


      if(
        dx*dx+
        dy*dy<
        MIN_DISTANCE*MIN_DISTANCE
      ){

        ok=false;
        break;

      }
    }


    if(!ok){
      continue;
    }


    /*
      生成側と完全に同じ
      マーカー回避。
    */

    for(
      const m of marks
    ){

      const dx=x-m.x;
      const dy=y-m.y;


      if(
        dx*dx+
        dy*dy<
        90*90
      ){

        ok=false;
        break;

      }
    }


    if(ok){

      result.push({
        x,
        y
      });

    }
  }


  return result;
}


const DATA_SLOTS=
  createSlots();


/* =========================================================
   組み合わせ
========================================================= */

function C(n,k){

  if(
    k<0 ||
    k>n
  ){
    return 0;
  }


  k=
    Math.min(
      k,
      n-k
    );


  let r=1;


  for(
    let i=1;
    i<=k;
    i++
  ){

    r=
      r*(n-k+i)/i;

  }


  return Math.round(r);
}


/* =========================================================
   32bit / 16個ON
   → 29bit
========================================================= */

function rank(bits){

  let r=0;

  let ones=16;


  for(
    let i=0;
    i<32;
    i++
  ){

    if(bits[i]===1){

      if(ones<=0){
        return null;
      }


      r+=
        C(
          31-i,
          ones
        );


      ones--;

    }
  }


  /*
    16個ONでなければ無効
  */

  if(ones!==0){
    return null;
  }


  /*
    C(32,16)の範囲
  */

  if(
    r<0 ||
    r>=C(32,16)
  ){
    return null;
  }


  return r;
}


/* =========================================================
   数値 → 29bit
========================================================= */

function numberToBits(value){

  const bits=[];


  for(
    let i=28;
    i>=0;
    i--
  ){

    bits.push(
      Math.floor(
        value/
        Math.pow(2,i)
      )&1
    );

  }


  return bits;
}


/* =========================================================
   CRC8

   生成側と完全に同じ
========================================================= */

function crc8(bits){

  let crc=0;


  for(
    const bit of bits
  ){

    const mix=
      ((crc>>7)&1)^bit;


    crc=
      (crc<<1)&255;


    if(mix){

      crc^=0x07;

    }
  }


  return crc;
}


/* =========================================================
   bits → number
========================================================= */

function bitsToNumber(bits){

  let n=0;


  for(
    const bit of bits
  ){

    n=
      n*2+
      bit;

  }


  return n;
}


/* =========================================================
   bits → UTF-16文字列
========================================================= */

function bitsToText(
  bits,
  length
){

  let text="";


  for(
    let c=0;
    c<length;
    c++
  ){

    let value=0;


    for(
      let j=0;
      j<16;
      j++
    ){

      value=
        value*2+
        bits[
          c*16+j
        ];

    }


    text+=
      String.fromCharCode(
        value
      );
  }


  return text;
}


/* =========================================================
   画像取得
========================================================= */

let imageData=null;

function prepareImage(){

  imageData=
    ctx.getImageData(
      0,
      0,
      canvas.width,
      canvas.height
    );

}


/* =========================================================
   ピクセル
========================================================= */

function pixel(x,y){

  x=
    Math.max(
      0,
      Math.min(
        canvas.width-1,
        Math.round(x)
      )
    );


  y=
    Math.max(
      0,
      Math.min(
        canvas.height-1,
        Math.round(y)
      )
    );


  const i=
    (y*canvas.width+x)*4;


  return {
    r:imageData.data[i],
    g:imageData.data[i+1],
    b:imageData.data[i+2]
  };
}


function luminance(p){

  return
    0.299*p.r+
    0.587*p.g+
    0.114*p.b;
}


/* =========================================================
   円周上の暗さ
========================================================= */

function ringDarkness(
  cx,
  cy,
  radius
){

  let total=0;

  const count=40;


  for(
    let i=0;
    i<count;
    i++
  ){

    const a=
      Math.PI*2*i/count;


    const p=
      pixel(
        cx+
        Math.cos(a)*radius,
        cy+
        Math.sin(a)*radius
      );


    /*
      暗いほど大きい値
    */

    total+=
      255-luminance(p);

  }


  return total/count;
}


/* =========================================================
   マーカー候補スコア
========================================================= */

function markerScore(
  x,
  y,
  radius
){

  /*
    マーカーは

      暗い外周
      ↓
      白
      ↓
      暗い内周
      ↓
      白
      ↓
      暗い中心

    という構造。
  */

  const outer=
    ringDarkness(
      x,
      y,
      radius
    );


  const inner=
    ringDarkness(
      x,
      y,
      radius*.47
    );


  const center=
    255-
    luminance(
      pixel(x,y)
    );


  const gap1=
    ringDarkness(
      x,
      y,
      radius*.72
    );


  const gap2=
    ringDarkness(
      x,
      y,
      radius*.22
    );


  /*
    外周・内周・中心が暗く、
    中間が明るいほどマーカーらしい。
  */

  const gapPenalty=
    (gap1+gap2)*.25;


  return
    outer*.34+
    inner*.34+
    center*.22-
    gapPenalty;
}


/* =========================================================
   マーカー検出
========================================================= */

function findMarkers(){

  const w=canvas.width;

  const h=canvas.height;

  const minSide=
    Math.min(w,h);


  /*
    マーカー半径は
    コード全体の約2.5%程度。

    複数サイズを試す。
  */

  const radii=[
    minSide*.018,
    minSide*.022,
    minSide*.026,
    minSide*.030,
    minSide*.034
  ];


  /*
    検索画像を縮小して高速化。
  */

  const maxSearch=900;

  const scale=
    Math.min(
      1,
      maxSearch/minSide
    );


  const sw=
    Math.max(
      1,
      Math.round(w*scale)
    );

  const sh=
    Math.max(
      1,
      Math.round(h*scale)
    );


  /*
    ここでは元画像を直接読む。
    候補位置だけ粗く探す。
  */

  const step=
    Math.max(
      5,
      Math.round(minSide/150)
    );


  const candidates=[];


  /*
    明るい背景上の
    強い円形パターンを探す。
  */

  for(
    let y=step;
    y<h;
    y+=step
  ){

    for(
      let x=step;
      x<w;
      x+=step
    ){

      /*
        まず中心が極端に暗すぎる/明るすぎる
        場所を軽く除外しない。
        中心点は暗いので残す。
      */

      let best=-Infinity;

      let bestRadius=0;


      for(
        const radius of radii
      ){

        const score=
          markerScore(
            x,
            y,
            radius
          );


        if(score>best){

          best=score;

          bestRadius=radius;

        }
      }


      candidates.push({
        x,
        y,
        r:bestRadius,
        score:best
      });

    }
  }


  candidates.sort(
    (a,b)=>
      b.score-a.score
  );


  /*
    近い候補をまとめる。
  */

  const selected=[];

  const minGap=
    minSide*.055;


  for(
    const c of candidates
  ){

    let near=false;


    for(
      const p of selected
    ){

      const dx=
        c.x-p.x;

      const dy=
        c.y-p.y;


      if(
        dx*dx+
        dy*dy<
        minGap*minGap
      ){

        near=true;
        break;

      }
    }


    if(!near){

      selected.push(c);

    }


    if(selected.length>=35){

      break;

    }
  }


  return selected;
}


/* =========================================================
   3マーカーの組み合わせ
========================================================= */

function chooseMarkers(candidates){

  if(
    candidates.length<3
  ){

    return null;

  }


  const limit=
    Math.min(
      candidates.length,
      20
    );


  let best=null;

  let bestScore=-Infinity;


  /*
    3点を全部組み合わせる。
  */

  for(
    let i=0;
    i<limit;
    i++
  ){

    for(
      let j=i+1;
      j<limit;
      j++
    ){

      for(
        let k=j+1;
        k<limit;
        k++
      ){

        const p=[
          candidates[i],
          candidates[j],
          candidates[k]
        ];


        /*
          6通りの並べ方。
        */

        const permutations=[
          [0,1,2],
          [0,2,1],
          [1,0,2],
          [1,2,0],
          [2,0,1],
          [2,1,0]
        ];


        for(
          const order of permutations
        ){

          const a=p[order[0]];
          const b=p[order[1]];
          const c=p[order[2]];


          const abx=
            b.x-a.x;

          const aby=
            b.y-a.y;


          const acx=
            c.x-a.x;

          const acy=
            c.y-a.y;


          const ab=
            Math.hypot(
              abx,
              aby
            );


          const ac=
            Math.hypot(
              acx,
              acy
            );


          if(
            ab<minSide*.08 ||
            ac<minSide*.08
          ){
            continue;
          }


          /*
            生成画像では
            左上→右上
            左上→左下
            はほぼ直角。
          */

          const dot=
            (
              abx*acx+
              aby*acy
            )/
            (ab*ac);


          const rightScore=
            1-
            Math.min(
              1,
              Math.abs(dot)
            );


          /*
            2辺の長さはほぼ同じ。
          */

          const ratio=
            Math.min(ab,ac)/
            Math.max(ab,ac);


          /*
            第3点が
            a + 横 + 縦
            に近いか確認。
          */

          const predictedX=
            b.x+c.x-a.x;

          const predictedY=
            b.y+c.y-a.y;


          /*
            この誤差は透視変形などで
           完全一致しなくてもよい。
          */

          const closure=
            Math.hypot(
              predictedX-
              (b.x+c.x-a.x),
              predictedY-
              (b.y+c.y-a.y)
            );


          /*
            3点の配置だけで評価。
          */

          const score=
            a.score+
            b.score+
            c.score+
            rightScore*100+
            ratio*100-
            closure;


          if(score>bestScore){

            bestScore=score;

            best=[
              {
                x:a.x,
                y:a.y
              },
              {
                x:b.x,
                y:b.y
              },
              {
                x:c.x,
                y:c.y
              }
            ];

          }

        }
      }
    }
  }


  return best;
}


/* =========================================================
   アフィン変換
========================================================= */

function affineFrom3(
  src,
  dst
){

  const x1=src[0].x;
  const y1=src[0].y;

  const x2=src[1].x;
  const y2=src[1].y;

  const x3=src[2].x;
  const y3=src[2].y;


  const X1=dst[0].x;
  const Y1=dst[0].y;

  const X2=dst[1].x;
  const Y2=dst[1].y;

  const X3=dst[2].x;
  const Y3=dst[2].y;


  const den=
    x1*(y2-y3)+
    x2*(y3-y1)+
    x3*(y1-y2);


  if(
    Math.abs(den)<0.000001
  ){
    return null;
  }


  const a=
    (
      X1*(y2-y3)+
      X2*(y3-y1)+
      X3*(y1-y2)
    )/den;


  const b=
    (
      X1*(x3-x2)+
      X2*(x1-x3)+
      X3*(x2-x1)
    )/den;


  const c=
    (
      X1*(x2*y3-x3*y2)+
      X2*(x3*y1-x1*y3)+
      X3*(x1*y2-x2*y1)
    )/den;


  const d=
    (
      Y1*(y2-y3)+
      Y2*(y3-y1)+
      Y3*(y1-y2)
    )/den;


  const e=
    (
      Y1*(x3-x2)+
      Y2*(x1-x3)+
      Y3*(x2-x1)
    )/den;


  const f=
    (
      Y1*(x2*y3-x3*y2)+
      Y2*(x3*y1-x1*y3)+
      Y3*(x1*y2-x2*y1)
    )/den;


  return {
    a,b,c,d,e,f
  };
}


/* =========================================================
   逆アフィン
   image → POTE CODE座標
========================================================= */

function inverseAffine(
  src,
  dst
){

  /*
    src = POTE CODE座標
    dst = 画像座標

    まずPOTE → imageを作り、
    それを逆にする。
  */

  const m=
    affineFrom3(
      src,
      dst
    );


  if(!m){
    return null;
  }


  const det=
    m.a*m.e-
    m.b*m.d;


  if(
    Math.abs(det)<0.000001
  ){
    return null;
  }


  return function(X,Y){

    const xx=
      X-m.c;

    const yy=
      Y-m.f;


    return {
      x:
        (
          m.e*xx-
          m.b*yy
        )/det,

      y:
        (
          -m.d*xx+
          m.a*yy
        )/det
    };

  };
}


/* =========================================================
   POTE座標 → 画像座標
========================================================= */

function forwardAffine(
  src,
  dst
){

  const m=
    affineFrom3(
      src,
      dst
    );


  if(!m){
    return null;
  }


  return function(x,y){

    return {
      x:
        m.a*x+
        m.b*y+
        m.c,

      y:
        m.d*x+
        m.e*y+
        m.f
    };

  };
}


/* =========================================================
   スロットの図形判定
========================================================= */

function sampleCircle(
  x,
  y,
  radius,
  count
){

  let r=0;
  let g=0;
  let b=0;
  let l=0;


  for(
    let i=0;
    i<count;
    i++
  ){

    const a=
      Math.PI*2*i/count;


    const p=
      pixel(
        x+
        Math.cos(a)*radius,

        y+
        Math.sin(a)*radius
      );


    r+=p.r;
    g+=p.g;
    b+=p.b;
    l+=luminance(p);

  }


  return {
    r:r/count,
    g:g/count,
    b:b/count,
    l:l/count
  };
}


/* =========================================================
   1スロットのスコア
========================================================= */

function slotScore(
  x,
  y,
  scale
){

  /*
    scale =
    「POTE CODE基準1単位が
     画像上で何pxか」
  */

  const centerRadius=
    Math.max(
      2,
      Math.min(
        7,
        scale*0.45
      )
    );


  const backgroundRadius=
    Math.max(
      7,
      Math.min(
        22,
        scale*1.8
      )
    );


  const center=
    sampleCircle(
      x,
      y,
      centerRadius,
      16
    );


  /*
    図形の外側をサンプリング。
  */

  let bgR=0;
  let bgG=0;
  let bgB=0;
  let bgL=0;

  const n=16;


  for(
    let i=0;
    i<n;
    i++
  ){

    const a=
      Math.PI*2*i/n;


    const p=
      sampleCircle(
        x+
        Math.cos(a)*backgroundRadius,

        y+
        Math.sin(a)*backgroundRadius,

        Math.max(
          1,
          scale*.25
        ),

        4
      );


    bgR+=p.r;
    bgG+=p.g;
    bgB+=p.b;
    bgL+=p.l;

  }


  bgR/=n;
  bgG/=n;
  bgB/=n;
  bgL/=n;


  const colorDiff=
    Math.sqrt(
      Math.pow(
        center.r-bgR,
        2
      )+
      Math.pow(
        center.g-bgG,
        2
      )+
      Math.pow(
        center.b-bgB,
        2
      )
    );


  const lightDiff=
    Math.abs(
      center.l-bgL
    );


  /*
    色差をメインにする。
  */

  return {
    score:
      colorDiff*.75+
      lightDiff*.25,

    colorDiff,
    lightDiff
  };
}


/* =========================================================
   全544スロットを読む
========================================================= */

function readAllSlots(
  transform
){

  const scores=[];

  /*
    POTE座標の
    100pxが画像上で何pxか測る。
  */

  const p0=
    transform(
      750,
      750
    );

  const p1=
    transform(
      850,
      750
    );


  const scale=
    Math.hypot(
      p1.x-p0.x,
      p1.y-p0.y
    )/100;


  /*
    異常な倍率を拒否。
  */

  if(
    !isFinite(scale) ||
    scale<0.05 ||
    scale>10
  ){

    throw new Error(
      "コードの大きさを判定できません"
    );

  }


  for(
    let i=0;
    i<SLOT_COUNT;
    i++
  ){

    const s=
      DATA_SLOTS[i];


    const p=
      transform(
        s.x,
        s.y
      );


    scores.push(
      slotScore(
        p.x,
        p.y,
        scale
      )
    );

  }


  return scores;
}


/* =========================================================
   スコア → bits

   各グループは必ず16個ONなので、
   「各グループ内で上位16個」
   を基本判定にする。

   これが非常に重要。
========================================================= */

function makeBitsFromScores(
  scores,
  mode
){

  const bits=
    new Array(
      SLOT_COUNT
    ).fill(0);


  for(
    let g=0;
    g<17;
    g++
  ){

    const start=
      g*32;


    const group=[];


    for(
      let i=0;
      i<32;
      i++
    ){

      group.push({
        index:start+i,
        score:scores[start+i].score
      });

    }


    /*
      スコアの高い順。
    */

    group.sort(
      (a,b)=>
        b.score-a.score
    );


    if(mode===0){

      /*
        完全に上位16。
      */

      for(
        let i=0;
        i<16;
        i++
      ){

        bits[
          group[i].index
        ]=1;

      }

    }
    else{

      /*
        少し違う判定。
        上位16に近いものを使う。
      */

      const values=
        group.map(
          x=>x.score
        );


      const threshold=
        (
          values[15]+
          values[16]
        )/2;


      for(
        const item of group
      ){

        if(
          item.score>
          threshold
        ){

          bits[item.index]=1;

        }

      }

      /*
        万一16個でなければ
        上位16に戻す。
      */

      let count=0;

      for(
        const b of bits
      ){

        count+=b;

      }


      if(count!==16){

        for(
          let i=start;
          i<start+32;
          i++
        ){

          bits[i]=0;

        }


        for(
          let i=0;
          i<16;
          i++
        ){

          bits[
            group[i].index
          ]=1;

        }

      }
    }
  }


  return bits;
}


/* =========================================================
   bitsをPOTE CODEとして復号
========================================================= */

function decodeBits(
  bits
){

  if(
    bits.length!==544
  ){
    return null;
  }


  const packet=[];


  /*
    17グループ。
  */

  for(
    let g=0;
    g<17;
    g++
  ){

    const group=
      bits.slice(
        g*32,
        g*32+32
      );


    /*
      必ず16個ON。
    */

    let ones=0;


    for(
      const b of group
    ){

      if(b===1){
        ones++;
      }

    }


    if(ones!==16){
      return null;
    }


    const value=
      rank(group);


    if(
      value===null ||
      value>=Math.pow(2,29)
    ){

      return null;

    }


    packet.push(
      ...numberToBits(value)
    );

  }


  /*
    493bit

    5bit length
    480bit body
    8bit CRC
  */

  const length=
    bitsToNumber(
      packet.slice(0,5)
    );


  if(
    length<0 ||
    length>30
  ){

    return null;

  }


  const body=
    packet.slice(
      5,
      485
    );


  const storedCRC=
    bitsToNumber(
      packet.slice(
        485,
        493
      )
    );


  const actualCRC=
    crc8(body);


  if(
    storedCRC!==actualCRC
  ){

    return null;

  }


  const text=
    bitsToText(
      body,
      length
    );


  /*
    明らかな誤読を排除。
  */

  for(
    let i=0;
    i<text.length;
    i++
  ){

    const code=
      text.charCodeAt(i);


    if(
      code<0x20 &&
      code!==0x09 &&
      code!==0x0A &&
      code!==0x0D
    ){

      return null;

    }
  }


  return {
    text:text,
    crc:true
  };
}


/* =========================================================
   メインデコード
========================================================= */

function decodeCurrentImage(){

  prepareImage();


  /*
    まず3マーカーを探す。
  */

  const candidates=
    findMarkers();


  if(
    candidates.length<3
  ){

    throw new Error(
      "マーカーが見つかりません"
    );

  }


  /*
    3点を選ぶ。
  */

  const imageMarks=
    chooseMarkers(
      candidates
    );


  if(!imageMarks){

    throw new Error(
      "マーカー位置を決められません"
    );

  }


  /*
    POTE座標 → 画像座標
  */

  const transform=
    forwardAffine(
      MARKS,
      imageMarks
    );


  if(!transform){

    throw new Error(
      "位置補正に失敗しました"
    );

  }


  /*
    544スロットを読む。
  */

  const scores=
    readAllSlots(
      transform
    );


  /*
    基本方式。
  */

  const bits0=
    makeBitsFromScores(
      scores,
      0
    );


  let decoded=
    decodeBits(
      bits0
    );


  if(decoded){

    return decoded.text;

  }


  /*
    別方式も試す。
  */

  const bits1=
    makeBitsFromScores(
      scores,
      1
    );


  decoded=
    decodeBits(
      bits1
    );


  if(decoded){

    return decoded.text;

  }


  /*
    ここまで来たら
    マーカーは見つかったが
    図形判定が不安定。
  */

  throw new Error(
    "図形を正しく判定できませんでした"
  );
}


/* =========================================================
   カメラ
========================================================= */

let stream=null;


async function startCamera(){

  try{

    if(
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ){

      showMessage(
        "カメラを利用できません"
      );

      return;

    }


    stream=
      await navigator.mediaDevices
      .getUserMedia({

        video:{
          facingMode:{
            ideal:"environment"
          },

          width:{
            ideal:1920
          },

          height:{
            ideal:1920
          }
        },

        audio:false

      });


    video.srcObject=
      stream;


    await video.play();


  }
  catch(e){

    showMessage(
      "カメラを起動できません"
    );

  }
}


/* =========================================================
   カメラ画像
========================================================= */

function captureCamera(){

  if(
    !video.videoWidth ||
    !video.videoHeight
  ){

    throw new Error(
      "カメラ映像がありません"
    );

  }


  /*
    最大1600px。
  */

  const maxSize=1600;


  const scale=
    Math.min(
      1,
      maxSize/
      Math.max(
        video.videoWidth,
        video.videoHeight
      )
    );


  canvas.width=
    Math.round(
      video.videoWidth*
      scale
    );


  canvas.height=
    Math.round(
      video.videoHeight*
      scale
    );


  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );
}


/* =========================================================
   ファイル画像
========================================================= */

function loadFileImage(
  selectedFile
){

  return new Promise(
    (resolve,reject)=>{

      const img=
        new Image();


      const url=
        URL.createObjectURL(
          selectedFile
        );


      img.onload=()=>{

        const maxSize=1800;


        const scale=
          Math.min(
            1,
            maxSize/
            Math.max(
              img.naturalWidth,
              img.naturalHeight
            )
          );


        canvas.width=
          Math.round(
            img.naturalWidth*
            scale
          );


        canvas.height=
          Math.round(
            img.naturalHeight*
            scale
          );


        ctx.drawImage(
          img,
          0,
          0,
          canvas.width,
          canvas.height
        );


        URL.revokeObjectURL(url);

        resolve();

      };


      img.onerror=()=>{

        URL.revokeObjectURL(url);

        reject(
          new Error(
            "画像を読み込めません"
          )
        );

      };


      img.src=url;

    }
  );
}


/* =========================================================
   URL
========================================================= */

function isURL(text){

  return /^https?:\/\/[^\s]+$/i
    .test(
      text.trim()
    );

}


/* =========================================================
   メッセージ
========================================================= */

let messageTimer=null;


function showMessage(text){

  message.textContent=
    text;


  message.classList.add(
    "show"
  );


  clearTimeout(
    messageTimer
  );


  messageTimer=
    setTimeout(
      ()=>{
        message.classList.remove(
          "show"
        );
      },
      1800
    );

}


/* =========================================================
   結果
========================================================= */

function showResult(text){

  resultText.textContent=
    text;


  result.style.display=
    "flex";


  /*
    URLなら新しいタブ。
  */

  if(
    isURL(text)
  ){

    const url=
      text.trim();


    const newWindow=
      window.open(
        url,
        "_blank",
        "noopener,noreferrer"
      );


    /*
      iPhone等で
      ポップアップがブロックされた場合。
    */

    if(!newWindow){

      showMessage(
        "URLを開けませんでした"
      );

    }

  }
}


/* =========================================================
   スキャン
========================================================= */

let scanning=false;


async function scan(){

  if(scanning){
    return;
  }


  scanning=true;

  loading.style.display=
    "flex";


  try{

    /*
      ボタンを押した瞬間の
      カメラフレームだけ取得。
    */

    captureCamera();


    const text=
      decodeCurrentImage();


    loading.style.display=
      "none";


    showResult(
      text
    );

  }
  catch(e){

    loading.style.display=
      "none";


    showMessage(
      "読み取れませんでした"
    );

  }
  finally{

    scanning=false;

  }
}


/* =========================================================
   ボタン
========================================================= */

scanButton.addEventListener(
  "click",
  scan
);


imageButton.addEventListener(
  "click",
  ()=>{
    file.click();
  }
);


file.addEventListener(
  "change",
  async ()=>{

    const selectedFile=
      file.files &&
      file.files[0];


    if(!selectedFile){
      return;
    }


    loading.style.display=
      "flex";


    try{

      await loadFileImage(
        selectedFile
      );


      const text=
        decodeCurrentImage();


      loading.style.display=
        "none";


      showResult(
        text
      );

    }
    catch(e){

      loading.style.display=
        "none";


      showMessage(
        "読み取れませんでした"
      );

    }
    finally{

      file.value="";
    }

  }
);


closeButton.addEventListener(
  "click",
  ()=>{
    result.style.display=
      "none";
  }
);


/* =========================================================
   起動
========================================================= */

window.addEventListener(
  "load",
  ()=>{
    startCamera();
  }
);


window.addEventListener(
  "pagehide",
  ()=>{
    
    if(stream){

      stream
        .getTracks()
        .forEach(
          track=>{
            track.stop();
          }
        );

    }

  }
);
