<script>
"use strict";

/* =========================================================
   POTE CODE SCANNER
   Generator ver 1.1 完全互換
   ========================================================= */

/* ---------- 固定仕様 ---------- */

const SIZE = 1500;
const CENTER = 750;

const SLOT_COUNT = 544;
const GROUP_SIZE = 32;
const GROUPS = 17;

const TEXT_UNITS = 30;
const BODY_BITS = 480;

const MARKS = [
  {x:255,  y:275},
  {x:1245, y:275},
  {x:255,  y:1245}
];

const MIN_R = 175;
const MAX_R = 640;
const MIN_DISTANCE = 35;

const SEED_VALUE = 9283746;

/* ---------- DOM ---------- */

const video = document.getElementById("camera");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d", {willReadFrequently:true});

const scanButton = document.getElementById("scanButton");
const imageButton = document.getElementById("imageButton");
const fileInput = document.getElementById("file");

const message = document.getElementById("message");
const result = document.getElementById("result");
const resultText = document.getElementById("resultText");
const closeResult = document.getElementById("closeResult");
const loading = document.getElementById("loading");

/* =========================================================
   共通乱数
   Generator と完全に同じ
   ========================================================= */

function makeRandom(){
  let seed = SEED_VALUE;

  return function(){
    seed = (seed * 1664525 + 1013904223) >>> 0;
    return seed / 4294967296;
  };
}

/* =========================================================
   固定スロット生成
   Generator と完全に同じ
   ========================================================= */

function makeSlots(){

  const random = makeRandom();

  const slots = [];

  function dist(a,b){
    const dx = a.x - b.x;
    const dy = a.y - b.y;
    return Math.sqrt(dx*dx + dy*dy);
  }

  const forbidden = MARKS.map(p => ({
    x:p.x,
    y:p.y
  }));

  let attempts = 0;

  while(slots.length < SLOT_COUNT && attempts < 300000){

    attempts++;

    const r =
      MIN_R +
      random() * (MAX_R - MIN_R);

    const a =
      random() * Math.PI * 2;

    const x =
      CENTER +
      Math.cos(a) * r;

    const y =
      CENTER +
      Math.sin(a) * r;

    if(x < 70 || x > 1430 || y < 70 || y > 1430){
      continue;
    }

    let ok = true;

    for(const p of slots){
      if(dist({x,y},p) < MIN_DISTANCE){
        ok = false;
        break;
      }
    }

    if(!ok) continue;

    for(const p of forbidden){
      if(dist({x,y},p) < 90){
        ok = false;
        break;
      }
    }

    if(!ok) continue;

    slots.push({x,y});
  }

  return slots;
}

const slots = makeSlots();

/* =========================================================
   組み合わせ
   ========================================================= */

function C(n,k){

  if(k < 0 || k > n){
    return 0;
  }

  k = Math.min(k,n-k);

  let r = 1;

  for(let i=1;i<=k;i++){
    r = r * (n-k+i) / i;
  }

  return Math.round(r);
}

/* =========================================================
   32bit中の16個ONを29bitへ戻す
   Generator の unrank の逆
   ========================================================= */

function rank(bits){

  let r = 0;
  let ones = 16;

  for(let i=0;i<32;i++){

    if(bits[i] === 1){

      if(ones === 0){
        return null;
      }

      r += C(31-i,ones);

      ones--;
    }
  }

  if(ones !== 0){
    return null;
  }

  return r;
}

/* =========================================================
   29bit → bits
   ========================================================= */

function numberToBits(value){

  const out = [];

  for(let i=28;i>=0;i--){
    out.push(
      Math.floor(value / Math.pow(2,i)) & 1
    );
  }

  return out;
}

/* =========================================================
   CRC8
   Generator と完全に同じ
   ========================================================= */

function crc8(bits){

  let crc = 0;

  for(const bit of bits){

    const mix =
      ((crc >> 7) & 1) ^ bit;

    crc =
      (crc << 1) & 255;

    if(mix){
      crc ^= 0x07;
    }
  }

  return crc;
}

/* =========================================================
   ビット → 数値
   ========================================================= */

function bitsToNumber(bits){

  let n = 0;

  for(const bit of bits){
    n = n * 2 + bit;
  }

  return n;
}

/* =========================================================
   UTF-16 bits → 文字列
   ========================================================= */

function bitsToText(bits,length){

  let text = "";

  for(let c=0;c<length;c++){

    let value = 0;

    for(let j=0;j<16;j++){

      value =
        value * 2 +
        bits[c*16+j];
    }

    text += String.fromCharCode(value);
  }

  return text;
}

/* =========================================================
   3点からアフィン変換
   reference → image
   ========================================================= */

function solveAffine(src,dst){

  const x1=src[0].x;
  const y1=src[0].y;

  const x2=src[1].x;
  const y2=src[1].y;

  const x3=src[2].x;
  const y3=src[2].y;

  const X1=dst[0].x;
  const Y1=dst[0].y;

  const X2=dst[1].x;
  const Y2=dst[1].y;

  const X3=dst[2].x;
  const Y3=dst[2].y;

  const den =
    x1*(y2-y3) +
    x2*(y3-y1) +
    x3*(y1-y2);

  if(Math.abs(den)<0.000001){
    return null;
  }

  const a =
    (
      X1*(y2-y3) +
      X2*(y3-y1) +
      X3*(y1-y2)
    ) / den;

  const b =
    (
      X1*(x3-x2) +
      X2*(x1-x3) +
      X3*(x2-x1)
    ) / den;

  const c =
    (
      X1*(x2*y3-x3*y2) +
      X2*(x3*y1-x1*y3) +
      X3*(x1*y2-x2*y1)
    ) / den;

  const d =
    (
      Y1*(y2-y3) +
      Y2*(y3-y1) +
      Y3*(y1-y2)
    ) / den;

  const e =
    (
      Y1*(x3-x2) +
      Y2*(x1-x3) +
      Y3*(x2-x1)
    ) / den;

  const f =
    (
      Y1*(x2*y3-x3*y2) +
      Y2*(x3*y1-x1*y3) +
      Y3*(x1*y2-x2*y1)
    ) / den;

  return function(x,y){

    return {
      x:a*x+b*y+c,
      y:d*x+e*y+f
    };
  };
}

/* =========================================================
   3点から逆変換
   image → reference
   ========================================================= */

function solveInverseAffine(src,dst){

  const forward = solveAffine(src,dst);

  if(!forward){
    return null;
  }

  const p0 = forward(0,0);
  const p1 = forward(1,0);
  const p2 = forward(0,1);

  const A = p1.x-p0.x;
  const B = p2.x-p0.x;
  const D = p1.y-p0.y;
  const E = p2.y-p0.y;

  const det = A*E-B*D;

  if(Math.abs(det)<0.000001){
    return null;
  }

  return function(X,Y){

    const xx = X-p0.x;
    const yy = Y-p0.y;

    return {
      x:( E*xx - B*yy ) / det,
      y:(-D*xx + A*yy ) / det
    };
  };
}

/* =========================================================
   画像処理
   ========================================================= */

function luminance(r,g,b){
  return 0.299*r + 0.587*g + 0.114*b;
}

function pixel(x,y){

  x=Math.max(0,Math.min(canvas.width-1,Math.round(x)));
  y=Math.max(0,Math.min(canvas.height-1,Math.round(y)));

  const i=(y*canvas.width+x)*4;

  return {
    r:ctx.data[i],
    g:ctx.data[i+1],
    b:ctx.data[i+2]
  };
}

/* =========================================================
   canvas imageData
   ========================================================= */

function prepareImage(){

  ctx.data =
    ctx.getImageData(
      0,
      0,
      canvas.width,
      canvas.height
    ).data;
}

/* =========================================================
   円マーカー評価
   ========================================================= */

function circleScore(cx,cy,r){

  let ring=0;
  let inside=0;
  let outside=0;

  const samples=32;

  for(let i=0;i<samples;i++){

    const a =
      Math.PI*2*i/samples;

    const x =
      cx + Math.cos(a)*r;

    const y =
      cy + Math.sin(a)*r;

    const p=pixel(x,y);

    const l=luminance(p.r,p.g,p.b);

    ring += l;
  }

  for(let i=0;i<16;i++){

    const a =
      Math.PI*2*i/16;

    const x =
      cx + Math.cos(a)*r*.48;

    const y =
      cy + Math.sin(a)*r*.48;

    const p=pixel(x,y);

    inside += luminance(p.r,p.g,p.b);
  }

  for(let i=0;i<16;i++){

    const a =
      Math.PI*2*i/16;

    const x =
      cx + Math.cos(a)*r*1.45;

    const y =
      cy + Math.sin(a)*r*1.45;

    const p=pixel(x,y);

    outside += luminance(p.r,p.g,p.b);
  }

  ring/=samples;
  inside/=16;
  outside/=16;

  const contrast =
    Math.abs(ring-inside) +
    Math.abs(ring-outside);

  return contrast;
}

/* =========================================================
   マーカー候補探索
   ========================================================= */

function findMarkerCandidates(){

  const w=canvas.width;
  const h=canvas.height;

  const minSide=Math.min(w,h);

  const expectedRadius =
    minSide * 0.025;

  const candidates=[];

  /*
    粗く探索
    ↓
    強い候補だけ残す
  */

  const step =
    Math.max(8,Math.floor(minSide/90));

  const radiusList=[
    expectedRadius*.65,
    expectedRadius*.85,
    expectedRadius,
    expectedRadius*1.15,
    expectedRadius*1.35
  ];

  for(let y=step;y<h;y+=step){

    for(let x=step;x<w;x+=step){

      let best=-Infinity;
      let bestR=0;

      for(const r of radiusList){

        const s=
          circleScore(x,y,r);

        if(s>best){
          best=s;
          bestR=r;
        }
      }

      candidates.push({
        x,
        y,
        r:bestR,
        score:best
      });
    }
  }

  candidates.sort(
    (a,b)=>b.score-a.score
  );

  /*
    近すぎる候補をまとめる
  */

  const filtered=[];

  const minGap =
    minSide*0.055;

  for(const c of candidates){

    let near=false;

    for(const p of filtered){

      const dx=c.x-p.x;
      const dy=c.y-p.y;

      if(
        dx*dx+dy*dy
        <
        minGap*minGap
      ){
        near=true;
        break;
      }
    }

    if(!near){
      filtered.push(c);
    }

    if(filtered.length>=40){
      break;
    }
  }

  return filtered;
}

/* =========================================================
   マーカー3点を形状として推定
   ========================================================= */

function chooseMarkerSet(candidates){

  if(candidates.length<3){
    return null;
  }

  /*
    3点の組み合わせを調べ、
    POTE CODEの

      左上
      右上
      左下

    に近い三角形を探す。
  */

  const maxCandidates=
    Math.min(candidates.length,25);

  let best=null;
  let bestScore=-Infinity;

  for(let i=0;i<maxCandidates;i++){

    for(let j=i+1;j<maxCandidates;j++){

      for(let k=j+1;k<maxCandidates;k++){

        const pts=[
          candidates[i],
          candidates[j],
          candidates[k]
        ];

        let cx=0;
        let cy=0;

        for(const p of pts){
          cx+=p.x;
          cy+=p.y;
        }

        cx/=3;
        cy/=3;

        /*
          3点を仮にTL/TR/BLとして
          3通り試す。
        */

        const perms=[
          [0,1,2],
          [0,2,1],
          [1,0,2],
          [1,2,0],
          [2,0,1],
          [2,1,0]
        ];

        for(const perm of perms){

          const TL=pts[perm[0]];
          const TR=pts[perm[1]];
          const BL=pts[perm[2]];

          const vx=TR.x-TL.x;
          const vy=TR.y-TL.y;

          const ux=BL.x-TL.x;
          const uy=BL.y-TL.y;

          const horizontal=
            Math.sqrt(vx*vx+vy*vy);

          const vertical=
            Math.sqrt(ux*ux+uy*uy);

          if(horizontal<20 || vertical<20){
            continue;
          }

          const dot=
            (vx*ux+vy*uy)/
            (horizontal*vertical);

          /*
            元画像ではほぼ直角。
          */

          const angleScore=
            1-Math.min(1,Math.abs(dot));

          /*
            横・縦の長さが近いほど良い
          */

          const ratio=
            Math.min(horizontal,vertical)/
            Math.max(horizontal,vertical);

          /*
            3点の重心が画面中央付近にあるほど良い
          */

          const centerDist=
            Math.sqrt(
              Math.pow(cx-wCenterX(),2)+
              Math.pow(cy-wCenterY(),2)
            );

          const centerScore=
            1-Math.min(
              1,
              centerDist/(Math.min(canvas.width,canvas.height)*.7)
            );

          const markerScore=
            TL.score+
            TR.score+
            BL.score;

          const score=
            markerScore*.35+
            angleScore*100*.35+
            ratio*100*.2+
            centerScore*100*.1;

          if(score>bestScore){

            bestScore=score;

            best=[
              {x:TL.x,y:TL.y},
              {x:TR.x,y:TR.y},
              {x:BL.x,y:BL.y}
            ];
          }
        }
      }
    }
  }

  return best;
}

function wCenterX(){
  return canvas.width/2;
}

function wCenterY(){
  return canvas.height/2;
}

/* =========================================================
   画像上の円形範囲を解析
   ========================================================= */

function getImageScale(){

  /*
    3マーカーから
    基準座標1500×1500の
    おおよその倍率を取得。
  */

  return 1;
}

/* =========================================================
   スロット読み取り
   ========================================================= */

function sampleRegion(x,y,r){

  let sr=0;
  let sg=0;
  let sb=0;
  let count=0;

  for(let yy=-r;yy<=r;yy+=2){

    for(let xx=-r;xx<=r;xx+=2){

      if(xx*xx+yy*yy>r*r){
        continue;
      }

      const p=pixel(x+xx,y+yy);

      sr+=p.r;
      sg+=p.g;
      sb+=p.b;

      count++;
    }
  }

  if(!count){
    return {
      r:0,g:0,b:0,l:0
    };
  }

  sr/=count;
  sg/=count;
  sb/=count;

  return {
    r:sr,
    g:sg,
    b:sb,
    l:luminance(sr,sg,sb)
  };
}

/* =========================================================
   図形ON/OFF判定
   ========================================================= */

function readSlotPoint(x,y,scale){

  /*
    中央に図形がある場合、

      中央
       ↓
    色・明るさが
    周辺と変化する

    という特徴を使う。
  */

  const centerR =
    Math.max(3,Math.min(8,scale*0.025));

  const aroundR =
    Math.max(10,Math.min(25,scale*0.075));

  const center=
    sampleRegion(
      x,
      y,
      centerR
    );

  let ar=0;
  let ag=0;
  let ab=0;
  let al=0;
  let n=0;

  const samples=20;

  for(let i=0;i<samples;i++){

    const a=
      Math.PI*2*i/samples;

    const px=
      x+
      Math.cos(a)*aroundR;

    const py=
      y+
      Math.sin(a)*aroundR;

    const p=
      sampleRegion(
        px,
        py,
        Math.max(2,Math.round(scale*.012))
      );

    ar+=p.r;
    ag+=p.g;
    ab+=p.b;
    al+=p.l;

    n++;
  }

  ar/=n;
  ag/=n;
  ab/=n;
  al/=n;

  const colorDiff=
    Math.sqrt(
      Math.pow(center.r-ar,2)+
      Math.pow(center.g-ag,2)+
      Math.pow(center.b-ab,2)
    );

  const lightDiff=
    Math.abs(center.l-al);

  /*
    色差を中心に、
    明るさ差も補助として使う。
  */

  const score=
    colorDiff*.75+
    lightDiff*.25;

  return {
    score,
    center,
    background:{
      r:ar,
      g:ag,
      b:ab,
      l:al
    }
  };
}

/* =========================================================
   1回のデコード
   ========================================================= */

function decodeWithTransform(inv){

  const rawBits=[];

  /*
    基準座標上の各スロットを
    画像座標へ戻して読む
  */

  let scaleX=1;
  let scaleY=1;

  /*
    中央付近の2点から
    おおよその画像倍率を推定
  */

  const p0=inv(750,750);
  const p1=inv(850,750);

  const measuredScale=
    Math.sqrt(
      Math.pow(p1.x-p0.x,2)+
      Math.pow(p1.y-p0.y,2)
    )/100;

  const scale=
    Math.max(
      0.15,
      Math.min(8,measuredScale)
    );

  /*
    まず複数しきい値候補を作る。
  */

  const values=[];

  for(const slot of slots){

    const p=
      inv(
        slot.x,
        slot.y
      );

    const s=
      readSlotPoint(
        p.x,
        p.y,
        scale
      );

    values.push(s.score);
  }

  /*
    しきい値を複数試す。
  */

  const sorted=
    [...values].sort((a,b)=>a-b);

  const thresholds=[];

  for(let i=1;i<10;i++){

    const index=
      Math.floor(
        sorted.length*i/10
      );

    thresholds.push(
      sorted[
        Math.max(
          0,
          Math.min(
            sorted.length-1,
            index
          )
        )
      ]
    );
  }

  let best=null;

  for(const threshold of thresholds){

    const bits=
      values.map(
        v=>v>threshold?1:0
      );

    const result=
      decodeBits(bits);

    if(result){

      if(
        !best ||
        result.confidence>best.confidence
      ){
        best=result;
      }
    }
  }

  /*
    より細かいしきい値も試す
  */

  for(let i=0;i<30;i++){

    const min=sorted[0];
    const max=sorted[sorted.length-1];

    const threshold=
      min+(max-min)*(i+1)/31;

    const bits=
      values.map(
        v=>v>threshold?1:0
      );

    const result=
      decodeBits(bits);

    if(result){

      if(
        !best ||
        result.confidence>best.confidence
      ){
        best=result;
      }
    }
  }

  return best;
}

/* =========================================================
   ビット列を実際のPOTE CODEとして解析
   ========================================================= */

function decodeBits(bits){

  if(bits.length!==SLOT_COUNT){
    return null;
  }

  const decoded=[];

  let validGroups=0;

  for(let g=0;g<GROUPS;g++){

    const group=
      bits.slice(
        g*GROUP_SIZE,
        (g+1)*GROUP_SIZE
      );

    let ones=0;

    for(const b of group){
      if(b===1) ones++;
    }

    /*
      Generatorは必ず16個ON。
    */

    if(ones!==16){
      return null;
    }

    const value=
      rank(group);

    if(
      value===null ||
      value>=Math.pow(2,29)
    ){
      return null;
    }

    const b=
      numberToBits(value);

    decoded.push(...b);

    validGroups++;
  }

  /*
    17×29 = 493bit
  */

  if(decoded.length<493){
    return null;
  }

  const lengthBits=
    decoded.slice(0,5);

  const length=
    bitsToNumber(lengthBits);

  if(length<0 || length>30){
    return null;
  }

  const body=
    decoded.slice(5,485);

  const storedCRC=
    bitsToNumber(
      decoded.slice(485,493)
    );

  if(body.length!==480){
    return null;
  }

  const calculatedCRC=
    crc8(body);

  if(storedCRC!==calculatedCRC){
    return null;
  }

  const text=
    bitsToText(
      body,
      length
    );

  /*
    UTF-16の途中に
    明らかな制御文字が大量にある場合は
    誤読候補として除外。
  */

  for(let i=0;i<text.length;i++){

    const code=
      text.charCodeAt(i);

    if(
      code<0x20 &&
      code!==0x09 &&
      code!==0x0A &&
      code!==0x0D
    ){
      return null;
    }
  }

  return {
    text,
    confidence:
      validGroups+
      (storedCRC===calculatedCRC?100:0)
  };
}

/* =========================================================
   マーカー3点を使ったデコード
   ========================================================= */

function decodeImage(){

  prepareImage();

  const candidates=
    findMarkerCandidates();

  if(candidates.length<3){
    throw new Error(
      "マーカーを検出できませんでした"
    );
  }

  const imageMarks=
    chooseMarkerSet(candidates);

  if(!imageMarks){
    throw new Error(
      "マーカー位置を決定できませんでした"
    );
  }

  /*
    基準 → 画像
  */

  const inverse=
    solveInverseAffine(
      MARKS,
      imageMarks
    );

  if(!inverse){
    throw new Error(
      "位置補正に失敗しました"
    );
  }

  /*
    そのまま読む
  */

  let result=
    decodeWithTransform(
      inverse
    );

  /*
    回転・左右反転などの候補を
    補助的に試す。
  */

  if(!result){

    const variations=[
      [0,1,2],
      [1,0,2],
      [2,1,0],
      [0,2,1]
    ];

    for(const v of variations){

      const testMarks=[
        imageMarks[v[0]],
        imageMarks[v[1]],
        imageMarks[v[2]]
      ];

      const inv=
        solveInverseAffine(
          MARKS,
          testMarks
        );

      if(!inv){
        continue;
      }

      result=
        decodeWithTransform(
          inv
        );

      if(result){
        break;
      }
    }
  }

  if(!result){

    throw new Error(
      "POTE CODEを読み取れませんでした"
    );
  }

  return result.text;
}

/* =========================================================
   カメラ
   ========================================================= */

let stream=null;

async function startCamera(){

  try{

    if(stream){

      stream.getTracks()
        .forEach(t=>t.stop());
    }

    stream=
      await navigator.mediaDevices.getUserMedia({
        video:{
          facingMode:{
            ideal:"environment"
          },
          width:{
            ideal:1920
          },
          height:{
            ideal:1920
          }
        },
        audio:false
      });

    video.srcObject=stream;

    await video.play();

  }catch(e){

    showMessage(
      "カメラを起動できません"
    );
  }
}

/* =========================================================
   カメラフレーム取得
   ========================================================= */

function captureCamera(){

  if(
    !video.videoWidth ||
    !video.videoHeight
  ){
    throw new Error(
      "カメラ映像を取得できません"
    );
  }

  /*
    処理を軽くするため、
    長辺最大1600px程度にする。
  */

  const maxSize=1600;

  const scale=
    Math.min(
      1,
      maxSize/
      Math.max(
        video.videoWidth,
        video.videoHeight
      )
    );

  canvas.width=
    Math.round(
      video.videoWidth*scale
    );

  canvas.height=
    Math.round(
      video.videoHeight*scale
    );

  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );
}

/* =========================================================
   画像ファイル
   ========================================================= */

function loadImageFile(file){

  return new Promise(
    (resolve,reject)=>{

      const img=
        new Image();

      const url=
        URL.createObjectURL(file);

      img.onload=()=>{

        const maxSize=1800;

        const scale=
          Math.min(
            1,
            maxSize/
            Math.max(
              img.naturalWidth,
              img.naturalHeight
            )
          );

        canvas.width=
          Math.round(
            img.naturalWidth*scale
          );

        canvas.height=
          Math.round(
            img.naturalHeight*scale
          );

        ctx.drawImage(
          img,
          0,
          0,
          canvas.width,
          canvas.height
        );

        URL.revokeObjectURL(url);

        resolve();
      };

      img.onerror=()=>{

        URL.revokeObjectURL(url);

        reject(
          new Error(
            "画像を読み込めません"
          )
        );
      };

      img.src=url;
    }
  );
}

/* =========================================================
   URL判定
   ========================================================= */

function isURL(text){

  return /^https?:\/\/[^\s]+$/i
    .test(text.trim());
}

/* =========================================================
   結果表示
   ========================================================= */

function showResult(text){

  resultText.textContent=text;

  result.style.display="flex";

  /*
    URLなら新しいタブ。
    iOS Safari等でポップアップが
    ブロックされた場合は結果画面を残す。
  */

  if(isURL(text)){

    const url=text.trim();

    const opened=
      window.open(
        url,
        "_blank",
        "noopener,noreferrer"
      );

    if(!opened){

      showMessage(
        "URLを開けませんでした"
      );
    }
  }
}

/* =========================================================
   メッセージ
   ========================================================= */

let messageTimer=null;

function showMessage(text){

  message.textContent=text;
  message.classList.add("show");

  clearTimeout(messageTimer);

  messageTimer=
    setTimeout(
      ()=>{
        message.classList.remove("show");
      },
      1800
    );
}

/* =========================================================
   スキャン
   ========================================================= */

let scanning=false;

async function scanCamera(){

  if(scanning){
    return;
  }

  scanning=true;

  loading.style.display="flex";

  try{

    captureCamera();

    /*
      少し待たず、
      ボタンを押した瞬間のフレームを
      そのまま解析。
    */

    const text=
      decodeImage();

    loading.style.display="none";

    showResult(text);

  }catch(e){

    loading.style.display="none";

    showMessage(
      "読み取れませんでした"
    );

  }finally{

    scanning=false;
  }
}

/* =========================================================
   ボタン
   ========================================================= */

scanButton.addEventListener(
  "click",
  scanCamera
);

imageButton.addEventListener(
  "click",
  ()=>{
    fileInput.click();
  }
);

fileInput.addEventListener(
  "change",
  async ()=>{
    
    const file=
      fileInput.files &&
      fileInput.files[0];

    if(!file){
      return;
    }

    loading.style.display="flex";

    try{

      await loadImageFile(file);

      const text=
        decodeImage();

      loading.style.display="none";

      showResult(text);

    }catch(e){

      loading.style.display="none";

      showMessage(
        "読み取れませんでした"
      );

    }finally{

      fileInput.value="";
    }
  }
);

closeResult.addEventListener(
  "click",
  ()=>{
    result.style.display="none";
  }
);

/* =========================================================
   起動
   ========================================================= */

window.addEventListener(
  "load",
  ()=>{
    startCamera();
  }
);

window.addEventListener(
  "pagehide",
  ()=>{
    if(stream){
      stream.getTracks()
        .forEach(t=>t.stop());
    }
  }
);
