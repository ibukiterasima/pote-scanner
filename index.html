<div id="app">

<script>
/* =========================================================
   POTE CODE SCANNER
   ver 1.2
   ========================================================= */

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d", {
  willReadFrequently:true
});

const scanButton = document.getElementById("scanButton");
const imageButton = document.getElementById("imageButton");
const imageInput = document.getElementById("imageInput");

const result = document.getElementById("result");
const resultText = document.getElementById("resultText");
const resultClose = document.getElementById("resultClose");

const flash = document.getElementById("flash");
const cameraMessage = document.getElementById("cameraMessage");


/* =========================================================
   POTE CODE 固定設定
   ========================================================= */

const SVG_SIZE = 1500;

const CENTER = 750;

const OUTER_R = 680;

const SLOT_COUNT = 544;

const GROUP_SIZE = 32;
const GROUPS = 17;
const ON_PER_GROUP = 16;


/* 生成側と同じ固定シード */
const SEED = 9283746;


/* 生成側と同じ範囲 */
const MIN_R = 175;
const MAX_R = 640;
const MIN_DISTANCE = 35;


/* 3つの角度合わせマーク */

const MARKS = [
  {x:255,  y:275},
  {x:1245, y:275},
  {x:255,  y:1245}
];


/* =========================================================
   deterministic random
   ========================================================= */

function mulberry32(a){
  return function(){
    let t = a += 0x6D2B79F5;
    t = Math.imul(t ^ t >>> 15, t | 1);
    t ^= t + Math.imul(t ^ t >>> 7, t | 61);
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}


/* =========================================================
   固定スロット生成
   ========================================================= */

function distance(a,b){
  const dx=a.x-b.x;
  const dy=a.y-b.y;
  return Math.sqrt(dx*dx+dy*dy);
}


function insideMarkArea(p){

  for(const m of MARKS){

    const dx=p.x-m.x;
    const dy=p.y-m.y;

    if(Math.sqrt(dx*dx+dy*dy)<90){
      return true;
    }
  }

  return false;
}


function generateSlots(){

  const rand = mulberry32(SEED);

  const slots=[];

  let tries=0;

  while(
    slots.length<SLOT_COUNT &&
    tries<3000000
  ){

    tries++;

    const angle=rand()*Math.PI*2;

    const r=
      MIN_R+
      Math.sqrt(rand())*(MAX_R-MIN_R);

    const p={
      x:CENTER+Math.cos(angle)*r,
      y:CENTER+Math.sin(angle)*r
    };

    if(insideMarkArea(p)){
      continue;
    }

    let ok=true;

    for(const q of slots){

      if(distance(p,q)<MIN_DISTANCE){
        ok=false;
        break;
      }
    }

    if(!ok) continue;

    slots.push(p);
  }

  return slots;
}


const SLOTS = generateSlots();


/* =========================================================
   Math
   ========================================================= */

function comb(n,k){

  if(k<0 || k>n) return 0;

  k=Math.min(k,n-k);

  let r=1;

  for(let i=1;i<=k;i++){
    r=r*(n-k+i)/i;
  }

  return Math.round(r);
}


/* =========================================================
   32bit group
   16個ON
   ========================================================= */

function rankBits(bits){

  let rank=0;

  let ones=ON_PER_GROUP;

  for(let i=0;i<GROUP_SIZE;i++){

    if(bits[i]===1){

      rank+=comb(
        GROUP_SIZE-i-1,
        ones
      );

      ones--;

    }
  }

  return rank;
}


function unrankBits(rank){

  const bits=new Array(GROUP_SIZE).fill(0);

  let ones=ON_PER_GROUP;

  for(let i=0;i<GROUP_SIZE;i++){

    if(ones===0) break;

    const zeroCount=comb(
      GROUP_SIZE-i-1,
      ones
    );

    if(rank>=zeroCount){

      bits[i]=1;
      rank-=zeroCount;
      ones--;

    }
  }

  return bits;
}


/* =========================================================
   CRC8
   ========================================================= */

function crc8(bytes){

  let crc=0;

  for(const b of bytes){

    crc^=b;

    for(let i=0;i<8;i++){

      if(crc&0x80){
        crc=((crc<<1)^0x07)&255;
      }else{
        crc=(crc<<1)&255;
      }

    }
  }

  return crc;
}


/* =========================================================
   ビット読み込み
   ========================================================= */

function bitsToBytes(bits){

  const bytes=[];

  for(let i=0;i+7<bits.length;i+=8){

    let v=0;

    for(let j=0;j<8;j++){
      v=(v<<1)|bits[i+j];
    }

    bytes.push(v);
  }

  return bytes;
}


/* =========================================================
   3点からアフィン変換
   ========================================================= */

function solveAffine(src,dst){

  /*
    x' = ax + by + c
    y' = dx + ey + f
  */

  const A=[
    [src[0].x,src[0].y,1],
    [src[1].x,src[1].y,1],
    [src[2].x,src[2].y,1]
  ];

  function solve(values){

    const m=A.map((r,i)=>[
      r[0],r[1],r[2],values[i]
    ]);

    for(let i=0;i<3;i++){

      let pivot=i;

      for(let j=i+1;j<3;j++){

        if(
          Math.abs(m[j][i])>
          Math.abs(m[pivot][i])
        ){
          pivot=j;
        }
      }

      if(Math.abs(m[pivot][i])<1e-9){
        return null;
      }

      [m[i],m[pivot]]=
      [m[pivot],m[i]];

      const p=m[i][i];

      for(let k=i;k<4;k++){
        m[i][k]/=p;
      }

      for(let j=0;j<3;j++){

        if(j===i) continue;

        const f=m[j][i];

        for(let k=i;k<4;k++){
          m[j][k]-=f*m[i][k];
        }
      }
    }

    return[
      m[0][3],
      m[1][3],
      m[2][3]
    ];
  }

  const sx=solve(dst.map(p=>p.x));
  const sy=solve(dst.map(p=>p.y));

  if(!sx||!sy) return null;

  return {
    a:sx[0],
    b:sx[1],
    c:sx[2],
    d:sy[0],
    e:sy[1],
    f:sy[2]
  };
}


/* =========================================================
   逆アフィン
   カメラ座標 → POTE CODE座標
   ========================================================= */

function inverseAffine(T){

  const det=T.a*T.e-T.b*T.d;

  if(Math.abs(det)<1e-9){
    return null;
  }

  return function(x,y){

    const X=x-T.c;
    const Y=y-T.f;

    return {
      x:( T.e*X-T.b*Y)/det,
      y:(-T.d*X+T.a*Y)/det
    };
  };
}


/* =========================================================
   グレースケール
   ========================================================= */

function gray(r,g,b){
  return .299*r+.587*g+.114*b;
}


/* =========================================================
   ダークピクセル候補
   ========================================================= */

function findDarkComponents(
  imageData,
  maxWidth=500
){

  const w=imageData.width;
  const h=imageData.height;

  const scale=Math.max(
    1,
    Math.ceil(w/maxWidth)
  );

  const sw=Math.floor(w/scale);
  const sh=Math.floor(h/scale);

  const data=imageData.data;

  const dark=new Uint8Array(sw*sh);

  for(let y=0;y<sh;y++){

    for(let x=0;x<sw;x++){

      const ox=x*scale;
      const oy=y*scale;

      const i=(oy*w+ox)*4;

      const g=gray(
        data[i],
        data[i+1],
        data[i+2]
      );

      /*
       * 明るさだけでなく彩度も考慮
       */
      const mx=Math.max(
        data[i],
        data[i+1],
        data[i+2]
      );

      const mn=Math.min(
        data[i],
        data[i+1],
        data[i+2]
      );

      const sat=mx-mn;

      if(g<105 && sat<80){
        dark[y*sw+x]=1;
      }
    }
  }


  /*
   * 小さな連結成分を探す
   */
  const visited=new Uint8Array(sw*sh);

  const components=[];

  const queueX=new Int32Array(sw*sh);
  const queueY=new Int32Array(sw*sh);

  for(let sy=0;sy<sh;sy++){

    for(let sx=0;sx<sw;sx++){

      const start=sy*sw+sx;

      if(
        !dark[start] ||
        visited[start]
      ) continue;

      let head=0;
      let tail=0;

      queueX[tail]=sx;
      queueY[tail]=sy;
      tail++;

      visited[start]=1;

      let minX=sx;
      let maxX=sx;
      let minY=sy;
      let maxY=sy;

      let count=0;

      let sumX=0;
      let sumY=0;

      while(head<tail){

        const x=queueX[head];
        const y=queueY[head];

        head++;

        count++;

        sumX+=x;
        sumY+=y;

        minX=Math.min(minX,x);
        maxX=Math.max(maxX,x);
        minY=Math.min(minY,y);
        maxY=Math.max(maxY,y);

        const ns=[
          [x+1,y],
          [x-1,y],
          [x,y+1],
          [x,y-1]
        ];

        for(const n of ns){

          const nx=n[0];
          const ny=n[1];

          if(
            nx<0||
            ny<0||
            nx>=sw||
            ny>=sh
          ) continue;

          const ni=ny*sw+nx;

          if(
            dark[ni] &&
            !visited[ni]
          ){

            visited[ni]=1;

            queueX[tail]=nx;
            queueY[tail]=ny;

            tail++;
          }
        }
      }


      if(count<8) continue;

      const bw=maxX-minX+1;
      const bh=maxY-minY+1;

      if(bw<4||bh<4) continue;
      if(bw>100||bh>100) continue;

      const aspect=bw/bh;

      if(aspect<.55||aspect>1.8) continue;

      components.push({
        x:(sumX/count)*scale,
        y:(sumY/count)*scale,
        w:bw*scale,
        h:bh*scale,
        area:count*scale*scale
      });
    }
  }

  return components;
}


/* =========================================================
   マーク候補を探す
   ========================================================= */

function findMarkerTriplet(imageData){

  const components=
    findDarkComponents(imageData);

  if(components.length<3){
    return null;
  }


  /*
   * まず大きさがマークらしいものだけ
   */
  const candidates=
    components.filter(c=>{

      const size=(c.w+c.h)/2;

      return (
        size>=18 &&
        size<=150 &&
        c.area>=80
      );
    });


  if(candidates.length<3){
    return null;
  }


  /*
   * カメラ画像内で
   *
   * 左上
   * 右上
   * 左下
   *
   * にある候補を探す。
   *
   * 完全な座標ではなく
   * 三角形の形を利用する。
   */

  let best=null;
  let bestScore=Infinity;

  const limit=Math.min(
    candidates.length,
    80
  );


  for(let i=0;i<limit;i++){

    for(let j=i+1;j<limit;j++){

      for(let k=j+1;k<limit;k++){

        const p=[
          candidates[i],
          candidates[j],
          candidates[k]
        ];


        /*
         * x/yで並べる
         */
        const sortedX=[...p]
          .sort((a,b)=>a.x-b.x);

        const sortedY=[...p]
          .sort((a,b)=>a.y-b.y);


        const left=sortedX[0];
        const right=sortedX[2];

        const top=sortedY[0];
        const bottom=sortedY[2];


        /*
         * 3点を
         *
         * 左上・右上・左下
         *
         * に割り当てる。
         */

        const remaining=p.filter(
          q=>q!==top && q!==bottom
        );

        if(remaining.length!==1){
          continue;
        }


        const middle=remaining[0];


        let TL,TR,BL;

        /*
         * 最も上の2つを上段とする
         */
        const upper=[...p]
          .sort((a,b)=>a.y-b.y)
          .slice(0,2);

        const lower=[...p]
          .sort((a,b)=>b.y-a.y)
          .slice(0,1)[0];

        if(
          upper.length!==2 ||
          !lower
        ){
          continue;
        }

        TL=upper[0].x<upper[1].x
          ?upper[0]
          :upper[1];

        TR=upper[0].x<upper[1].x
          ?upper[1]
          :upper[0];

        BL=lower;


        /*
         * 三角形の辺長
         */
        const dTop=distance(TL,TR);
        const dLeft=distance(TL,BL);
        const dDiag=distance(TR,BL);


        if(
          dTop<40||
          dLeft<40||
          dDiag<50
        ){
          continue;
        }


        /*
         * 直角三角形に近いか
         */
        const cos=
          (
            dTop*dTop+
            dLeft*dLeft-
            dDiag*dDiag
          )/
          (2*dTop*dLeft);


        /*
         * 大きな遠近歪みは許容する
         */
        if(cos<-.55||cos>.55){
          continue;
        }


        /*
         * 上段と左列が近すぎる候補を除外
         */
        const score=
          Math.abs(dTop-dLeft)*.15+
          Math.abs(
            TL.w-TR.w
          )*.4+
          Math.abs(
            TL.h-BL.h
          )*.4;


        if(score<bestScore){

          bestScore=score;

          best=[
            TL,
            TR,
            BL
          ];
        }
      }
    }
  }

  return best;
}


/* =========================================================
   画像のRGB取得
   ========================================================= */

function getPixel(imageData,x,y){

  const w=imageData.width;
  const h=imageData.height;

  x=Math.round(x);
  y=Math.round(y);

  if(
    x<0||
    y<0||
    x>=w||
    y>=h
  ){
    return null;
  }

  const i=(y*w+x)*4;

  return {
    r:imageData.data[i],
    g:imageData.data[i+1],
    b:imageData.data[i+2]
  };
}


/* =========================================================
   パッチ平均
   ========================================================= */

function averagePatch(
  imageData,
  x,
  y,
  radius
){

  let r=0;
  let g=0;
  let b=0;
  let n=0;

  const rr=radius*radius;

  for(
    let dy=-radius;
    dy<=radius;
    dy++
  ){

    for(
      let dx=-radius;
      dx<=radius;
      dx++
    ){

      if(dx*dx+dy*dy>rr){
        continue;
      }

      const p=getPixel(
        imageData,
        x+dx,
        y+dy
      );

      if(!p) continue;

      r+=p.r;
      g+=p.g;
      b+=p.b;

      n++;
    }
  }

  if(!n){
    return null;
  }

  return {
    r:r/n,
    g:g/n,
    b:b/n
  };
}


/* =========================================================
   色差
   ========================================================= */

function colorDistance(a,b){

  const dr=a.r-b.r;
  const dg=a.g-b.g;
  const db=a.b-b.b;

  return Math.sqrt(
    dr*dr+
    dg*dg+
    db*db
  );
}


/* =========================================================
   スロット判定
   ========================================================= */

function sampleSlot(
  imageData,
  inv,
  slot
){

  /*
   * 中心をカメラ座標へ
   */
  const p=inv(
    slot.x,
    slot.y
  );

  /*
   * 中心パッチ
   */
  const center=
    averagePatch(
      imageData,
      p.x,
      p.y,
      7
    );

  if(!center){
    return 0;
  }


  /*
   * 周囲から背景色を取得
   */
  const surrounding=[];

  const samples=12;

  for(let i=0;i<samples;i++){

    const a=
      Math.PI*2*i/samples;

    const q=inv(
      slot.x+
        Math.cos(a)*22,

      slot.y+
        Math.sin(a)*22
    );

    const c=
      averagePatch(
        imageData,
        q.x,
        q.y,
        4
      );

    if(c){
      surrounding.push(c);
    }
  }


  if(!surrounding.length){
    return 0;
  }


  let bg={
    r:0,
    g:0,
    b:0
  };

  for(const c of surrounding){

    bg.r+=c.r;
    bg.g+=c.g;
    bg.b+=c.b;
  }

  bg.r/=surrounding.length;
  bg.g/=surrounding.length;
  bg.b/=surrounding.length;


  const diff=
    colorDistance(center,bg);


  /*
   * 彩度差も利用
   */
  const centerMax=Math.max(
    center.r,
    center.g,
    center.b
  );

  const centerMin=Math.min(
    center.r,
    center.g,
    center.b
  );

  const bgMax=Math.max(
    bg.r,
    bg.g,
    bg.b
  );

  const bgMin=Math.min(
    bg.r,
    bg.g,
    bg.b
  );

  const saturationDiff=
    Math.abs(
      (centerMax-centerMin)-
      (bgMax-bgMin)
    );


  /*
   * ある程度の色差があれば
   * 図形あり
   */
  if(
    diff>24 ||
    saturationDiff>14
  ){
    return 1;
  }

  return 0;
}


/* =========================================================
   ビット読み取り
   ========================================================= */

function readBits(
  imageData,
  inv
){

  const bits=[];

  for(const slot of SLOTS){

    bits.push(
      sampleSlot(
        imageData,
        inv,
        slot
      )
    );
  }

  return bits;
}


/* =========================================================
   データ復元
   ========================================================= */

function decodeBits(bits){

  if(bits.length!==SLOT_COUNT){
    return null;
  }


  const payload=[];


  /*
   * 各32ビットグループ
   */
  for(
    let g=0;
    g<GROUPS;
    g++
  ){

    const group=
      bits.slice(
        g*GROUP_SIZE,
        (g+1)*GROUP_SIZE
      );


    const ones=
      group.reduce(
        (a,b)=>a+b,
        0
      );


    /*
     * ノイズが多い場合は失敗
     */
    if(ones!==ON_PER_GROUP){
      return null;
    }


    const rank=
      rankBits(group);


    /*
     * 29bit
     */
    for(let b=28;b>=0;b--){

      payload.push(
        (rank>>b)&1
      );
    }
  }


  /*
   * 493bit
   *
   * 先頭5bit = 長さ
   * 次の480bit = 30byte相当
   * 最後8bit = CRC
   */
  const lengthBits=
    payload.slice(0,5);

  let length=0;

  for(const b of lengthBits){
    length=(length<<1)|b;
  }


  if(length<0||length>30){
    return null;
  }


  const dataBits=
    payload.slice(5,5+length*16);


  const crcStart=
    5+480;

  let storedCRC=0;

  for(
    let i=0;
    i<8;
    i++
  ){

    storedCRC=
      (storedCRC<<1)|
      payload[crcStart+i];
  }


  const bytes=
    bitsToBytes(
      dataBits
    );


  const actualCRC=
    crc8(bytes);


  if(actualCRC!==storedCRC){
    return null;
  }


  /*
   * UTF-16
   */
  let text="";

  for(let i=0;i<bytes.length;i+=2){

    const hi=bytes[i]||0;
    const lo=bytes[i+1]||0;

    text+=String.fromCharCode(
      (hi<<8)|lo
    );
  }


  return text;
}


/* =========================================================
   マーカー検出 → 読み取り
   ========================================================= */

function decodeImage(imageData){

  /*
   * 3マーカーを探す
   */
  const found=
    findMarkerTriplet(
      imageData
    );

  if(!found){
    return null;
  }


  /*
   * 発見した
   *
   * 左上
   * 右上
   * 左下
   *
   * を固定座標へ対応
   */
  const src=[
    {
      x:found[0].x,
      y:found[0].y
    },
    {
      x:found[1].x,
      y:found[1].y
    },
    {
      x:found[2].x,
      y:found[2].y
    }
  ];


  const dst=MARKS;


  const T=
    solveAffine(
      src,
      dst
    );

  if(!T){
    return null;
  }


  const inv=
    inverseAffine(T);

  if(!inv){
    return null;
  }


  const bits=
    readBits(
      imageData,
      inv
    );


  /*
   * そのまま読む
   */
  let text=
    decodeBits(bits);

  if(text!==null){
    return text;
  }


  /*
   * 閾値が厳しすぎる場合に
   * 少しだけ補正して再試行
   *
   * 今回は構造確認を優先
   */
  return null;
}


/* =========================================================
   カメラ
   ========================================================= */

let stream=null;


async function startCamera(){

  try{

    stream=
      await navigator.mediaDevices.getUserMedia({
        video:{
          facingMode:{
            ideal:"environment"
          },
          width:{
            ideal:1280
          },
          height:{
            ideal:1280
          }
        },
        audio:false
      });

    video.srcObject=stream;

    cameraMessage.textContent="";

  }catch(e){

    cameraMessage.textContent="";

  }
}


/* =========================================================
   カメラフレーム取得
   ========================================================= */

function captureCamera(){

  if(
    !video.videoWidth||
    !video.videoHeight
  ){
    return null;
  }


  canvas.width=
    video.videoWidth;

  canvas.height=
    video.videoHeight;


  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );


  return ctx.getImageData(
    0,
    0,
    canvas.width,
    canvas.height
  );
}


/* =========================================================
   スキャン
   ========================================================= */

scanButton.addEventListener(
  "click",
  async()=>{

    flash.classList.remove("active");

    /*
     * reflow
     */
    void flash.offsetWidth;

    flash.classList.add("active");


    const imageData=
      captureCamera();

    if(!imageData){
      return;
    }


    /*
     * 少し待って処理
     */
    await new Promise(
      r=>setTimeout(r,20)
    );


    const text=
      decodeImage(
        imageData
      );


    if(text!==null){

      showResult(text);

    }else{

      /*
       * 失敗しても
       * 余計な説明は表示しない
       */
    }
  }
);


/* =========================================================
   画像読み込み
   ========================================================= */

imageButton.addEventListener(
  "click",
  ()=>{
    imageInput.click();
  }
);


imageInput.addEventListener(
  "change",
  ()=>{

    const file=
      imageInput.files[0];

    if(!file) return;


    const img=
      new Image();


    img.onload=()=>{

      canvas.width=
        img.naturalWidth;

      canvas.height=
        img.naturalHeight;


      ctx.drawImage(
        img,
        0,
        0
      );


      const imageData=
        ctx.getImageData(
          0,
          0,
          canvas.width,
          canvas.height
        );


      const text=
        decodeImage(
          imageData
        );


      if(text!==null){

        showResult(text);

      }

      URL.revokeObjectURL(
        img.src
      );
    };


    img.src=
      URL.createObjectURL(file);
  }
);


/* =========================================================
   結果表示
   ========================================================= */

function showResult(text){

  /*
   * URLなら新しいタブ
   */
  if(
    /^https?:\/\/[^\s]+$/i.test(text)
  ){

    const w=
      window.open(
        text,
        "_blank"
      );

    /*
     * ポップアップブロック時
     */
    if(!w){
      resultText.textContent=text;
      result.classList.add("show");
    }

    return;
  }


  resultText.textContent=text;

  result.classList.add("show");
}


resultClose.addEventListener(
  "click",
  ()=>{
    result.classList.remove("show");
  }
);


/* =========================================================
   起動
   ========================================================= */

startCamera();


/* =========================================================
   ページを離れたらカメラ停止
   ========================================================= */

window.addEventListener(
  "pagehide",
  ()=>{
    if(stream){

      for(const track of stream.getTracks()){
        track.stop();
      }
    }
  }
);
