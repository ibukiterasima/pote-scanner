<script>

/* =========================================================
   POTE CODE Reader v2.2
   シャッター式
========================================================= */


/* =========================================================
   共通仕様
========================================================= */

const SIZE = 1500;

const CENTER = 750;

const PACKET_BITS = 493;

const GROUP_BITS = 29;

const GROUP_COUNT = 17;

const SLOT_BITS = 544;

const MAX_UTF8_BYTES = 60;

const MAX_CHARS = 30;


/* =========================================================
   スロット
========================================================= */

const SLOT_COUNT = 544;

const MIN_R = 175;

const MAX_R = 640;

const DISTANCES = [
  42,
  40,
  39,
  38,
  37,
  36
];

const MARKER_EXCLUSION = 105;


/* =========================================================
   マーカー
========================================================= */

const MARKERS = [

  {
    x:255,
    y:275
  },

  {
    x:1245,
    y:275
  },

  {
    x:255,
    y:1245
  }

];


/* =========================================================
   固定乱数
========================================================= */

let seed = 9283746;

function random(){

  seed =
    (seed * 1664525 +
     1013904223) >>> 0;

  return seed / 4294967296;

}


/* =========================================================
   図形
========================================================= */

function getShape(i){

  let size;

  if(i % 23 === 0){

    size = 18;

  }
  else if(i % 13 === 0){

    size = 16;

  }
  else if(i % 7 === 0){

    size = 15;

  }
  else{

    size = 11 + (i % 3);

  }

  return {
    type:i % 5,
    size
  };

}


/* =========================================================
   マーカー除外
========================================================= */

function tooCloseToMarker(x,y){

  for(const m of MARKERS){

    const dx = x - m.x;

    const dy = y - m.y;

    if(
      Math.sqrt(
        dx * dx + dy * dy
      ) < MARKER_EXCLUSION
    ){

      return true;

    }

  }

  return false;

}


/* =========================================================
   Generatorと完全に同じスロット
========================================================= */

function createSlots(){

  seed = 9283746;

  for(
    const minDistance of DISTANCES
  ){

    const candidates = [];

    for(
      let i=0;
      i<30000;
      i++
    ){

      const angle =
        random() *
        Math.PI * 2;

      const radius =
        Math.sqrt(random()) *
        (MAX_R - MIN_R) +
        MIN_R;

      const x =
        CENTER +
        Math.cos(angle) *
        radius;

      const y =
        CENTER +
        Math.sin(angle) *
        radius;

      const dx =
        x - CENTER;

      const dy =
        y - CENTER;

      const r =
        Math.sqrt(
          dx * dx +
          dy * dy
        );

      if(
        r < MIN_R ||
        r > MAX_R
      ){

        continue;

      }

      if(
        tooCloseToMarker(x,y)
      ){

        continue;

      }

      candidates.push({
        x,
        y,
        angle,
        radius
      });

    }


    for(
      let i=candidates.length-1;
      i>0;
      i--
    ){

      const j =
        Math.floor(
          random() * (i+1)
        );

      [
        candidates[i],
        candidates[j]
      ] = [
        candidates[j],
        candidates[i]
      ];

    }


    const selected = [];


    for(
      const p of candidates
    ){

      let valid = true;

      for(
        const q of selected
      ){

        const dx =
          p.x - q.x;

        const dy =
          p.y - q.y;

        if(
          dx * dx +
          dy * dy <
          minDistance * minDistance
        ){

          valid = false;

          break;

        }

      }


      if(!valid){

        continue;

      }


      selected.push(p);


      if(
        selected.length >=
        SLOT_COUNT
      ){

        break;

      }

    }


    if(
      selected.length >=
      SLOT_COUNT
    ){

      selected.length =
        SLOT_COUNT;


      return selected.map(
        (p,i)=>({

          x:p.x,
          y:p.y,

          type:
            getShape(i).type,

          size:
            getShape(i).size

        })
      );

    }

  }


  throw new Error(
    "スロットを作成できませんでした"
  );

}


const SLOTS = createSlots();


/* =========================================================
   Canvas
========================================================= */

const canvas =
  document.getElementById("canvas");

const ctx =
  canvas.getContext(
    "2d",
    {
      willReadFrequently:true
    }
  );


/* =========================================================
   UI
========================================================= */

const video =
  document.getElementById("video");

const cameraButton =
  document.getElementById("cameraButton");

const shutterButton =
  document.getElementById("shutterButton");

const imageButton =
  document.getElementById("imageButton");

const imageInput =
  document.getElementById("imageInput");

const status =
  document.getElementById("status");

const result =
  document.getElementById("result");

const openButton =
  document.getElementById("openButton");


let stream = null;

let cameraRunning = false;


/* =========================================================
   組み合わせ
========================================================= */

function C(n,k){

  if(
    k < 0 ||
    k > n
  ){

    return 0;

  }

  k =
    Math.min(k,n-k);

  let result = 1;

  for(
    let i=1;
    i<=k;
    i++
  ){

    result =
      result *
      (n-k+i) /
      i;

  }

  return Math.round(result);

}


/* =========================================================
   rank
========================================================= */

function rankCombination(bits){

  if(
    !bits ||
    bits.length !== 32
  ){

    return null;

  }


  let ones = 0;

  for(
    const bit of bits
  ){

    if(bit === 1){

      ones++;

    }

  }


  if(ones !== 16){

    return null;

  }


  let rank = 0;

  let remaining = 16;


  for(
    let i=0;
    i<32;
    i++
  ){

    if(bits[i] === 1){

      rank +=
        C(
          31-i,
          remaining
        );

      remaining--;

    }

  }


  if(
    rank < 0 ||
    rank >= Math.pow(2,29)
  ){

    return null;

  }


  return rank;

}


/* =========================================================
   number → 29bit
========================================================= */

function numberToBits(value){

  const bits = [];

  for(
    let b=28;
    b>=0;
    b--
  ){

    bits.push(
      Math.floor(
        value /
        Math.pow(2,b)
      ) % 2
    );

  }

  return bits;

}


/* =========================================================
   15 / 17補正
========================================================= */

function repairGroup(bits){

  const count =
    bits.reduce(
      (a,b)=>a+b,
      0
    );


  if(count === 15){

    for(
      let i=0;
      i<32;
      i++
    ){

      if(bits[i] !== 0){

        continue;

      }

      const test =
        bits.slice();

      test[i] = 1;

      const rank =
        rankCombination(test);

      if(rank !== null){

        return rank;

      }

    }

  }


  if(count === 17){

    for(
      let i=0;
      i<32;
      i++
    ){

      if(bits[i] !== 1){

        continue;

      }

      const test =
        bits.slice();

      test[i] = 0;

      const rank =
        rankCombination(test);

      if(rank !== null){

        return rank;

      }

    }

  }


  return null;

}


/* =========================================================
   544 → 493
========================================================= */

function decodeGroups(bits){

  if(
    !bits ||
    bits.length !== 544
  ){

    return null;

  }


  const packet = [];


  for(
    let group=0;
    group<17;
    group++
  ){

    const groupBits =
      bits.slice(
        group*32,
        group*32+32
      );


    let rank =
      rankCombination(
        groupBits
      );


    if(rank === null){

      rank =
        repairGroup(
          groupBits
        );

    }


    if(rank === null){

      return null;

    }


    packet.push(
      ...numberToBits(rank)
    );

  }


  return packet.length === 493
    ? packet
    : null;

}


/* =========================================================
   CRC
========================================================= */

function crc8(bits){

  let crc = 0;


  for(
    const bit of bits
  ){

    const mix =
      ((crc >> 7) & 1) ^ bit;

    crc =
      (crc << 1) & 255;

    if(mix){

      crc ^= 0x07;

    }

  }


  return crc;

}


/* =========================================================
   パケット → 文字
========================================================= */

function decodePacket(packet){

  if(
    !packet ||
    packet.length !== 493
  ){

    return null;

  }


  let charCount = 0;


  for(
    let i=0;
    i<5;
    i++
  ){

    charCount =
      charCount * 2 +
      packet[i];

  }


  if(charCount > 30){

    return null;

  }


  const body =
    packet.slice(
      5,
      485
    );


  const crcBits =
    packet.slice(
      485,
      493
    );


  let storedCRC = 0;


  for(
    const bit of crcBits
  ){

    storedCRC =
      storedCRC * 2 +
      bit;

  }


  if(
    storedCRC !== crc8(body)
  ){

    return null;

  }


  const bytes =
    new Uint8Array(60);


  for(
    let i=0;
    i<60;
    i++
  ){

    let value = 0;


    for(
      let b=0;
      b<8;
      b++
    ){

      value =
        value * 2 +
        body[i*8+b];

    }


    bytes[i] = value;

  }


  let length = 60;


  while(
    length > 0 &&
    bytes[length-1] === 0
  ){

    length--;

  }


  try{

    const decoder =
      new TextDecoder(
        "utf-8",
        {
          fatal:true
        }
      );


    const text =
      decoder.decode(
        bytes.slice(
          0,
          length
        )
      );


    if(
      Array.from(text).length !==
      charCount
    ){

      return null;

    }


    return text;

  }
  catch(error){

    return null;

  }

}


/* =========================================================
   画像ピクセルキャッシュ
========================================================= */

let imageData = null;


/* =========================================================
   画像データ作成
========================================================= */

function prepareImageData(){

  imageData =
    ctx.getImageData(
      0,
      0,
      canvas.width,
      canvas.height
    );

}


/* =========================================================
   輝度
========================================================= */

function luminance(r,g,b){

  return (
    0.299*r +
    0.587*g +
    0.114*b
  );

}


/* =========================================================
   ピクセル取得
========================================================= */

function getPixelFast(x,y){

  if(!imageData){

    return 255;

  }


  x=Math.round(x);

  y=Math.round(y);


  if(
    x<0 ||
    y<0 ||
    x>=imageData.width ||
    y>=imageData.height
  ){

    return 255;

  }


  const index =
    (y * imageData.width + x) * 4;


  return luminance(
    imageData.data[index],
    imageData.data[index+1],
    imageData.data[index+2]
  );

}


/* =========================================================
   スロットサンプリング
========================================================= */

function sampleSlot(x,y,size){

  const inner =
    Math.max(
      3,
      size * .42
    );


  const outer =
    Math.max(
      8,
      size * 1.45
    );


  let innerSum=0;
  let innerCount=0;

  let outerSum=0;
  let outerCount=0;


  for(
    let yy=-outer;
    yy<=outer;
    yy+=2
  ){

    for(
      let xx=-outer;
      xx<=outer;
      xx+=2
    ){

      const r =
        Math.sqrt(
          xx*xx +
          yy*yy
        );


      if(r > outer){

        continue;

      }


      const value =
        getPixelFast(
          x+xx,
          y+yy
        );


      if(r <= inner){

        innerSum += value;
        innerCount++;

      }
      else if(
        r >= inner+3
      ){

        outerSum += value;
        outerCount++;

      }

    }

  }


  if(
    !innerCount ||
    !outerCount
  ){

    return 0;

  }


  return (
    outerSum/outerCount -
    innerSum/innerCount
  );

}


/* =========================================================
   マーカー候補
========================================================= */

function findMarkerCandidates(){

  const candidates=[];


  const width =
    canvas.width;

  const height =
    canvas.height;


  const step =
    Math.max(
      5,
      Math.round(
        Math.min(width,height)/160
      )
    );


  const radius =
    Math.min(width,height)*.055;


  const centerRadius =
    radius*.42;


  for(
    let y=radius;
    y<height-radius;
    y+=step
  ){

    for(
      let x=radius;
      x<width-radius;
      x+=step
    ){

      let centerSum=0;
      let centerCount=0;

      let outsideSum=0;
      let outsideCount=0;


      for(
        let yy=-radius;
        yy<=radius;
        yy+=4
      ){

        for(
          let xx=-radius;
          xx<=radius;
          xx+=4
        ){

          const r =
            Math.sqrt(
              xx*xx +
              yy*yy
            );


          if(r>radius){

            continue;

          }


          const value =
            getPixelFast(
              x+xx,
              y+yy
            );


          if(
            r<centerRadius
          ){

            centerSum+=value;
            centerCount++;

          }
          else if(
            r>centerRadius+4
          ){

            outsideSum+=value;
            outsideCount++;

          }

        }

      }


      if(
        !centerCount ||
        !outsideCount
      ){

        continue;

      }


      const contrast =
        outsideSum/outsideCount -
        centerSum/centerCount;


      if(contrast < 22){

        continue;

      }


      candidates.push({
        x,
        y,
        score:contrast
      });

    }

  }


  candidates.sort(
    (a,b)=>
      b.score-a.score
  );


  const merged=[];


  const minDistance =
    Math.min(width,height)*.075;


  for(
    const p of candidates
  ){

    let near=false;


    for(
      const q of merged
    ){

      if(
        Math.hypot(
          p.x-q.x,
          p.y-q.y
        ) <
        minDistance
      ){

        near=true;
        break;

      }

    }


    if(!near){

      merged.push(p);

    }


    if(merged.length>=20){

      break;

    }

  }


  return merged;

}


/* =========================================================
   マーカー3点選択
========================================================= */

function chooseMarkers(candidates){

  if(
    candidates.length<3
  ){

    return null;

  }


  let best=null;

  let bestScore=Infinity;


  for(
    let i=0;
    i<candidates.length;
    i++
  ){

    for(
      let j=i+1;
      j<candidates.length;
      j++
    ){

      for(
        let k=j+1;
        k<candidates.length;
        k++
      ){

        const points=[
          candidates[i],
          candidates[j],
          candidates[k]
        ];


        const sorted =
          points.slice().sort(
            (a,b)=>a.y-b.y
          );


        const topLeft =
          sorted[0].x <
          sorted[1].x
            ? sorted[0]
            : sorted[1];


        const topRight =
          sorted[0].x <
          sorted[1].x
            ? sorted[1]
            : sorted[0];


        const bottom =
          sorted[2];


        if(
          bottom.x >=
          (topLeft.x+topRight.x)/2
        ){

          continue;

        }


        const topDistance =
          Math.hypot(
            topRight.x-topLeft.x,
            topRight.y-topLeft.y
          );


        const leftDistance =
          Math.hypot(
            bottom.x-topLeft.x,
            bottom.y-topLeft.y
          );


        const rightDistance =
          Math.hypot(
            bottom.x-topRight.x,
            bottom.y-topRight.y
          );


        if(
          topDistance<30 ||
          leftDistance<30 ||
          rightDistance<30
        ){

          continue;

        }


        const shapeError =
          Math.abs(
            topDistance/
            leftDistance-1
          );


        const positionError =
          Math.abs(
            rightDistance/
            leftDistance-1
          );


        const score =
          shapeError*500+
          positionError*250;


        if(score<bestScore){

          bestScore=score;

          best=[
            topLeft,
            topRight,
            bottom
          ];

        }

      }

    }

  }


  return best;

}


/* =========================================================
   アフィン変換
========================================================= */

function affineFromThree(src,dst){

  const x1=src[0].x;
  const y1=src[0].y;

  const x2=src[1].x;
  const y2=src[1].y;

  const x3=src[2].x;
  const y3=src[2].y;


  const X1=dst[0].x;
  const Y1=dst[0].y;

  const X2=dst[1].x;
  const Y2=dst[1].y;

  const X3=dst[2].x;
  const Y3=dst[2].y;


  const det =
    x1*(y2-y3)
    -x2*(y1-y3)
    +x3*(y1-y2);


  if(
    Math.abs(det)<0.000001
  ){

    return null;

  }


  const a =
    (
      X1*(y2-y3)
      -X2*(y1-y3)
      +X3*(y1-y2)
    )/det;


  const b =
    (
      X1*(x3-x2)
      -X2*(x3-x1)
      +X3*(x2-x1)
    )/det;


  const c =
    (
      X1*(x2*y3-x3*y2)
      -X2*(x1*y3-x3*y1)
      +X3*(x1*y2-x3*y1)
    )/det;


  const d =
    (
      Y1*(y2-y3)
      -Y2*(y1-y3)
      +Y3*(y1-y2)
    )/det;


  const e =
    (
      Y1*(x3-x2)
      -Y2*(x3-x1)
      +Y3*(x2-x1)
    )/det;


  const f =
    (
      Y1*(x2*y3-x3*y2)
      -Y2*(x1*y3-x3*y1)
      +Y3*(x1*y2-x3*y1)
    )/det;


  return {
    a,b,c,d,e,f
  };

}


/* =========================================================
   座標変換
========================================================= */

function transformPoint(t,x,y){

  return {

    x:
      t.a*x+
      t.b*y+
      t.c,

    y:
      t.d*x+
      t.e*y+
      t.f

  };

}


/* =========================================================
   544スロット
========================================================= */

function readSlots(transform,threshold){

  const bits=[];


  for(
    let i=0;
    i<SLOT_COUNT;
    i++
  ){

    const s=SLOTS[i];


    const p =
      transformPoint(
        transform,
        s.x,
        s.y
      );


    const score =
      sampleSlot(
        p.x,
        p.y,
        s.size
      );


    bits.push(
      score > threshold
        ? 1
        : 0
    );

  }


  return bits;

}


/* =========================================================
   画像デコード
========================================================= */

function decodeImage(){

  prepareImageData();


  const candidates =
    findMarkerCandidates();


  if(
    candidates.length<3
  ){

    throw new Error(
      "マーカーが見つかりません"
    );

  }


  const detected =
    chooseMarkers(
      candidates
    );


  if(!detected){

    throw new Error(
      "マーカーを認識できません"
    );

  }


  const transform =
    affineFromThree(
      MARKERS,
      detected
    );


  if(!transform){

    throw new Error(
      "位置補正に失敗しました"
    );

  }


  const thresholds=[
    6,
    8,
    10,
    12,
    14,
    16,
    18,
    20,
    22,
    25,
    28,
    32
  ];


  for(
    const threshold of thresholds
  ){

    const bits =
      readSlots(
        transform,
        threshold
      );


    const packet =
      decodeGroups(bits);


    if(!packet){

      continue;

    }


    const text =
      decodePacket(packet);


    if(text !== null){

      return text;

    }

  }


  throw new Error(
    "POTE CODEを読み取れませんでした"
  );

}


/* =========================================================
   結果表示
========================================================= */

function showResult(text){

  result.style.display="block";

  result.textContent=text;


  openButton.style.display="none";


  try{

    const url =
      new URL(text);


    if(
      url.protocol==="http:" ||
      url.protocol==="https:"
    ){

      openButton.style.display=
        "block";


      openButton.onclick=()=>{

        window.open(
          url.href,
          "_blank",
          "noopener,noreferrer"
        );

      };

    }

  }
  catch(error){

  }

}


/* =========================================================
   カメラ起動
========================================================= */

cameraButton.addEventListener(
  "click",
  async()=>{

    try{

      if(
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
      ){

        throw new Error(
          "このブラウザではカメラを使用できません"
        );

      }


      if(stream){

        stream
        .getTracks()
        .forEach(
          track=>track.stop()
        );

      }


      stream =
        await navigator.mediaDevices
        .getUserMedia({

          video:{
            facingMode:{
              ideal:"environment"
            },

            width:{
              ideal:1920
            },

            height:{
              ideal:1080
            }
          },

          audio:false

        });


      video.srcObject=stream;

      await video.play();


      cameraRunning=true;


      shutterButton.style.display=
        "block";


      cameraButton.textContent=
        "カメラを起動中";


      status.textContent=
        "POTE CODEを丸いガイドに合わせてシャッターを押してね";

    }
    catch(error){

      console.error(error);


      status.textContent=
        error.message ||
        "カメラを起動できません";

    }

  }
);


/* =========================================================
   シャッター
========================================================= */

shutterButton.addEventListener(
  "click",
  ()=>{

    if(
      !cameraRunning ||
      video.readyState<2
    ){

      return;

    }


    status.textContent=
      "読み取り中…";


    /*
      現在見えているフレームを撮影
    */

    const width =
      video.videoWidth;

    const height =
      video.videoHeight;


    if(
      !width ||
      !height
    ){

      status.textContent=
        "カメラ画像を取得できません";

      return;

    }


    const scale =
      Math.min(
        1,
        1800 /
        Math.max(width,height)
      );


    canvas.width =
      Math.max(
        1,
        Math.round(width*scale)
      );


    canvas.height =
      Math.max(
        1,
        Math.round(height*scale)
      );


    ctx.drawImage(
      video,
      0,
      0,
      canvas.width,
      canvas.height
    );


    /*
      撮影したフレームだけを解析
    */

    try{

      const text =
        decodeImage();


      showResult(text);


      status.textContent=
        "読み取りました";


      /*
        読み取り成功後は
        カメラを止める
      */

      if(stream){

        stream
        .getTracks()
        .forEach(
          track=>track.stop()
        );

      }


      cameraRunning=false;

      shutterButton.style.display=
        "none";

      cameraButton.textContent=
        "カメラを起動";


    }
    catch(error){

      console.error(error);


      status.textContent=
        "読み取れませんでした。もう一度シャッターを押してね";

    }

  }
);


/* =========================================================
   画像から読み込み
========================================================= */

imageButton.addEventListener(
  "click",
  ()=>{

    imageInput.click();

  }
);


/* =========================================================
   画像選択
========================================================= */

imageInput.addEventListener(
  "change",
  event=>{

    const file =
      event.target.files[0];


    if(!file){

      return;

    }


    const image =
      new Image();


    image.onload=()=>{

      const scale =
        Math.min(
          1,
          1800 /
          Math.max(
            image.naturalWidth,
            image.naturalHeight
          )
        );


      canvas.width =
        Math.max(
          1,
          Math.round(
            image.naturalWidth*scale
          )
        );


      canvas.height =
        Math.max(
          1,
          Math.round(
            image.naturalHeight*scale
          )
        );


      ctx.drawImage(
        image,
        0,
        0,
        canvas.width,
        canvas.height
      );


      status.textContent=
        "読み取り中…";


      try{

        const text =
          decodeImage();


        showResult(text);


        status.textContent=
          "読み取りました";

      }
      catch(error){

        console.error(error);


        status.textContent=
          "POTE CODEを読み取れませんでした";

      }


      URL.revokeObjectURL(
        image.src
      );

    };


    image.onerror=()=>{

      status.textContent=
        "画像を読み込めませんでした";

    };


    image.src =
      URL.createObjectURL(file);

  }
);

</script>
