<script>

/* =========================================================
   POTE CODE SCANNER ver 1.3
   ========================================================= */


/* ---------------------------------------------------------
   固定設定
--------------------------------------------------------- */

const SIZE = 1500;

const CENTER = 750;

const SLOT_COUNT = 544;

const GROUP_SIZE = 32;

const GROUP_COUNT = 17;

const ON_COUNT = 16;

const SEED = 9283746;

const MIN_R = 175;

const MAX_R = 640;

const MIN_DISTANCE = 35;


/*
   生成側と完全に同じ3マーク
*/
const MARKS = [
  {x:255,y:275},
  {x:1245,y:275},
  {x:255,y:1245}
];


/* ---------------------------------------------------------
   DOM
--------------------------------------------------------- */

const video =
  document.getElementById("video");

const canvas =
  document.getElementById("canvas");

const ctx =
  canvas.getContext("2d",{
    willReadFrequently:true
  });

const scanButton =
  document.getElementById("scanButton");

const imageButton =
  document.getElementById("imageButton");

const imageInput =
  document.getElementById("imageInput");

const flash =
  document.getElementById("flash");

const result =
  document.getElementById("result");

const resultText =
  document.getElementById("resultText");

const closeResult =
  document.getElementById("closeResult");


/* =========================================================
   乱数
========================================================= */

function mulberry32(a){

  return function(){

    let t =
      a += 0x6D2B79F5;

    t =
      Math.imul(
        t ^ (t >>> 15),
        t | 1
      );

    t ^=
      t +
      Math.imul(
        t ^ (t >>> 7),
        t | 61
      );

    return (
      (t ^ (t >>> 14)) >>> 0
    ) / 4294967296;
  };
}


/* =========================================================
   スロット生成
   生成HTMLと同じ配置
========================================================= */

function distance(a,b){

  const dx=a.x-b.x;
  const dy=a.y-b.y;

  return Math.sqrt(
    dx*dx+dy*dy
  );
}


function inMarkArea(p){

  for(const m of MARKS){

    if(
      Math.hypot(
        p.x-m.x,
        p.y-m.y
      ) < 90
    ){
      return true;
    }
  }

  return false;
}


function createSlots(){

  const random =
    mulberry32(SEED);

  const slots=[];

  let tries=0;

  while(
    slots.length<SLOT_COUNT &&
    tries<3000000
  ){

    tries++;

    const angle =
      random()*Math.PI*2;

    const radius =
      MIN_R+
      Math.sqrt(random())*
      (MAX_R-MIN_R);

    const p={
      x:
        CENTER+
        Math.cos(angle)*radius,

      y:
        CENTER+
        Math.sin(angle)*radius
    };

    if(inMarkArea(p)){
      continue;
    }

    let valid=true;

    for(const q of slots){

      if(
        distance(p,q)<
        MIN_DISTANCE
      ){
        valid=false;
        break;
      }
    }

    if(valid){
      slots.push(p);
    }
  }

  return slots;
}


const SLOTS =
  createSlots();


/* =========================================================
   組み合わせ
========================================================= */

function combination(n,k){

  if(k<0 || k>n){
    return 0;
  }

  k=Math.min(k,n-k);

  let result=1;

  for(let i=1;i<=k;i++){

    result =
      Math.round(
        result*
        (n-k+i)/
        i
      );
  }

  return result;
}


/* =========================================================
   32ビット → ランク
========================================================= */

function rankCombination(bits){

  let rank=0;

  let remaining=ON_COUNT;

  for(
    let i=0;
    i<GROUP_SIZE;
    i++
  ){

    if(bits[i]){

      rank += combination(
        GROUP_SIZE-i-1,
        remaining
      );

      remaining--;
    }
  }

  return rank;
}


/* =========================================================
   ランク → 32ビット
========================================================= */

function unrankCombination(rank){

  const bits =
    new Array(GROUP_SIZE)
      .fill(0);

  let remaining=ON_COUNT;

  for(
    let i=0;
    i<GROUP_SIZE;
    i++
  ){

    if(remaining<=0){
      break;
    }

    const zeroWays =
      combination(
        GROUP_SIZE-i-1,
        remaining
      );

    if(rank>=zeroWays){

      bits[i]=1;

      rank-=zeroWays;

      remaining--;
    }
  }

  return bits;
}


/* =========================================================
   CRC8
========================================================= */

function crc8(bytes){

  let crc=0;

  for(const byte of bytes){

    crc ^= byte;

    for(let i=0;i<8;i++){

      if(crc&0x80){

        crc =
          ((crc<<1)^0x07)&255;

      }else{

        crc =
          (crc<<1)&255;
      }
    }
  }

  return crc;
}


/* =========================================================
   画像 → グレースケール
========================================================= */

function makeGray(imageData){

  const w=imageData.width;
  const h=imageData.height;

  const grayData =
    new Uint8Array(w*h);

  const data=imageData.data;

  for(let i=0,p=0;i<data.length;i+=4,p++){

    grayData[p]=
      Math.round(
        0.299*data[i]+
        0.587*data[i+1]+
        0.114*data[i+2]
      );
  }

  return grayData;
}


/* =========================================================
   マーカー検出
=========================================================

   前の方式では
   「茶色い連結領域」を探していたため
   カメラ画像では非常に不安定だった。

   今回はリングそのものを探す。
========================================================= */

function markerScore(
  grayData,
  width,
  height,
  cx,
  cy,
  radius
){

  let outerDark=0;
  let outerTotal=0;

  let middleDark=0;
  let middleTotal=0;

  let innerDark=0;
  let innerTotal=0;


  /*
   * 外側リング
   */
  for(let a=0;a<360;a+=10){

    const rad=a*Math.PI/180;

    const x=
      Math.round(
        cx+
        Math.cos(rad)*radius
      );

    const y=
      Math.round(
        cy+
        Math.sin(rad)*radius
      );

    if(
      x<0||y<0||
      x>=width||y>=height
    ){
      continue;
    }

    outerTotal++;

    if(
      grayData[y*width+x]<145
    ){
      outerDark++;
    }
  }


  /*
   * 内側
   *
   * マーカー中心は白いので
   * ここが暗すぎる候補を除く
   */
  for(let a=0;a<360;a+=15){

    const rad=a*Math.PI/180;

    const x=
      Math.round(
        cx+
        Math.cos(rad)*radius*.52
      );

    const y=
      Math.round(
        cy+
        Math.sin(rad)*radius*.52
      );

    if(
      x<0||y<0||
      x>=width||y>=height
    ){
      continue;
    }

    middleTotal++;

    if(
      grayData[y*width+x]<150
    ){
      middleDark++;
    }
  }


  /*
   * 中心
   */
  const centerR =
    Math.max(
      2,
      Math.round(radius*.18)
    );

  for(
    let dy=-centerR;
    dy<=centerR;
    dy++
  ){

    for(
      let dx=-centerR;
      dx<=centerR;
      dx++
    ){

      if(
        dx*dx+dy*dy>
        centerR*centerR
      ){
        continue;
      }

      const x=
        Math.round(cx+dx);

      const y=
        Math.round(cy+dy);

      if(
        x<0||y<0||
        x>=width||y>=height
      ){
        continue;
      }

      innerTotal++;

      if(
        grayData[y*width+x]<150
      ){
        innerDark++;
      }
    }
  }


  if(!outerTotal){
    return 0;
  }


  const outerRatio =
    outerDark/outerTotal;

  const middleRatio =
    middleTotal?
      middleDark/middleTotal:
      0;

  const innerRatio =
    innerTotal?
      innerDark/innerTotal:
      0;


  /*
   * リング:
   *
   * 外側 → 暗い
   * 中間 → 明るい
   * 中心 → ある程度明るい
   */
  return (
    outerRatio*1.8 -
    middleRatio*.7 -
    innerRatio*.25
  );
}


/* =========================================================
   候補検出
========================================================= */

function findMarkerCandidates(imageData){

  const width=
    imageData.width;

  const height=
    imageData.height;

  const grayData=
    makeGray(imageData);


  /*
   * 大きな画像をそのまま総当たりすると重いので
   * 320px程度へ縮小して探索する。
   */
  const maxScan=360;

  const scale=
    Math.max(
      1,
      Math.max(width,height)/
      maxScan
    );


  const sw=
    Math.floor(width/scale);

  const sh=
    Math.floor(height/scale);


  const candidates=[];


  /*
   * マーカーの大きさは
   * コード全体に対して小さいため
   * 複数サイズを見る。
   */
  const radii=[
    8,
    11,
    14,
    17,
    21,
    25,
    30,
    36,
    43,
    50
  ];


  /*
   * 画像を縮小して探索
   */
  for(
    let sy=20;
    sy<sh-20;
    sy+=3
  ){

    for(
      let sx=20;
      sx<sw-20;
      sx+=3
    ){

      const cx=
        Math.round(sx*scale);

      const cy=
        Math.round(sy*scale);


      /*
       * 明るすぎる中心だけの場所を
       * 最初に除外
       */
      const p=
        grayData[
          cy*width+cx
        ];

      if(p>235){
        /*
         * 中心点が白でも
         * リングはあり得るため
         * 完全には除外しない
         */
      }


      let best=0;
      let bestRadius=0;

      for(const r0 of radii){

        const r=
          r0*scale;

        const score=
          markerScore(
            grayData,
            width,
            height,
            cx,
            cy,
            r
          );

        if(score>best){

          best=score;
          bestRadius=r;
        }
      }


      if(best>.48){

        candidates.push({
          x:cx,
          y:cy,
          score:best,
          radius:bestRadius
        });
      }
    }
  }


  /*
   * 強い順
   */
  candidates.sort(
    (a,b)=>b.score-a.score
  );


  /*
   * 近すぎる候補をまとめる
   */
  const filtered=[];

  for(const c of candidates){

    let tooClose=false;

    for(const q of filtered){

      if(
        Math.hypot(
          c.x-q.x,
          c.y-q.y
        ) <
        Math.max(
          c.radius,
          q.radius
        )*2.5
      ){

        tooClose=true;
        break;
      }
    }

    if(!tooClose){

      filtered.push(c);
    }

    if(filtered.length>=30){
      break;
    }
  }

  return filtered;
}


/* =========================================================
   3マーカーを三角形として選択
========================================================= */

function findMarkerTriangle(imageData){

  const candidates=
    findMarkerCandidates(
      imageData
    );


  if(candidates.length<3){
    return null;
  }


  /*
   * マーカー間の比率:
   *
   * TL-TR = 990
   * TL-BL = 970
   * TR-BL ≈ 1386
   */
  const targetA=990;
  const targetB=970;
  const targetC=
    Math.hypot(
      990,
      970
    );


  let best=null;
  let bestError=Infinity;


  const n=
    Math.min(
      candidates.length,
      18
    );


  for(let i=0;i<n;i++){

    for(let j=i+1;j<n;j++){

      for(let k=j+1;k<n;k++){

        const pts=[
          candidates[i],
          candidates[j],
          candidates[k]
        ];


        const d=[
          distance(pts[0],pts[1]),
          distance(pts[0],pts[2]),
          distance(pts[1],pts[2])
        ];


        const longest=
          Math.max(...d);

        const shortest=
          Math.min(...d);

        const middle=
          d.reduce(
            (a,b)=>a+b,
            0
          )-
          longest-
          shortest;


        if(
          shortest<40||
          middle<40||
          longest<50
        ){
          continue;
        }


        /*
         * 実画像では倍率が変わるので
         * 比率で比較
         */
        const scale=
          longest/targetC;


        const expectedShortest=
          targetA*scale;

        const expectedMiddle=
          targetB*scale;


        const error=
          Math.abs(
            longest-
            targetC*scale
          )+
          Math.abs(
            shortest-
            Math.min(
              expectedShortest,
              expectedMiddle
            )
          )+
          Math.abs(
            middle-
            Math.max(
              expectedShortest,
              expectedMiddle
            )
          );


        /*
         * 角度も確認
         */
        const sideTolerance=
          Math.max(
            1,
            middle
          )*.48;


        if(
          Math.abs(
            shortest-
            expectedShortest
          )>sideTolerance &&
          Math.abs(
            shortest-
            expectedMiddle
          )>sideTolerance
        ){
          continue;
        }


        if(error<bestError){

          bestError=error;

          best=pts;
        }
      }
    }
  }


  if(!best){
    return null;
  }


  /*
   * 一番長い辺が
   *
   * TR ↔ BL
   *
   * 残った点が TL
   */
  const pairs=[
    {
      a:0,b:1,
      d:distance(best[0],best[1])
    },
    {
      a:0,b:2,
      d:distance(best[0],best[2])
    },
    {
      a:1,b:2,
      d:distance(best[1],best[2])
    }
  ];


  pairs.sort(
    (a,b)=>b.d-a.d
  );


  const longest=pairs[0];

  const tlIndex=
    [0,1,2].find(
      i=>
        i!==longest.a &&
        i!==longest.b
    );


  const other=[
    longest.a,
    longest.b
  ];


  const pTL=
    best[tlIndex];

  const p1=
    best[other[0]];

  const p2=
    best[other[1]];


  /*
   * TLから見た向きで
   * TR / BLを決定
   *
   * 正しいPOTE CODEは
   *
   * TL -> TR
   * TL -> BL
   *
   * の外積が正。
   */
  const v1={
    x:p1.x-pTL.x,
    y:p1.y-pTL.y
  };

  const v2={
    x:p2.x-pTL.x,
    y:p2.y-pTL.y
  };


  const cross=
    v1.x*v2.y-
    v1.y*v2.x;


  let tr;
  let bl;


  if(cross>0){

    tr=p1;
    bl=p2;

  }else{

    tr=p2;
    bl=p1;
  }


  /*
   * ここでTL→TRとTL→BLの
   * 長さを使って最終確認
   */
  const dTR=
    distance(
      pTL,
      tr
    );

  const dBL=
    distance(
      pTL,
      bl
    );


  /*
   * TRのほうが少し長い
   */
  if(dTR<dBL){

    const temp=tr;
    tr=bl;
    bl=temp;
  }


  return [
    {
      x:pTL.x,
      y:pTL.y
    },
    {
      x:tr.x,
      y:tr.y
    },
    {
      x:bl.x,
      y:bl.y
    }
  ];
}


/* =========================================================
   3点 → アフィン変換
========================================================= */

function affineFrom3(src,dst){

  function solve(
    a1,b1,c1,
    a2,b2,c2,
    a3,b3,c3
  ){

    const det=
      a1*(b2*c3-b3*c2)-
      b1*(a2*c3-a3*c2)+
      c1*(a2*b3-a3*b2);

    if(Math.abs(det)<1e-9){
      return null;
    }


    return [
      (
        c1*(b2*c3-b3*c2)-
        b1*(a2*c3-a3*c2)+
        a1*(a2*b3-a3*b2)
      )/det
    ];
  }


  /*
   * ガウス消去
   */
  function gaussian(M){

    const m=
      M.map(r=>r.slice());


    for(let col=0;col<3;col++){

      let pivot=col;

      for(
        let row=col+1;
        row<3;
        row++
      ){

        if(
          Math.abs(
            m[row][col]
          )>
          Math.abs(
            m[pivot][col]
          )
        ){
          pivot=row;
        }
      }


      if(
        Math.abs(
          m[pivot][col]
        )<1e-10
      ){
        return null;
      }


      [m[col],m[pivot]]=
      [m[pivot],m[col]];


      const p=
        m[col][col];


      for(
        let j=col;
        j<4;
        j++
      ){
        m[col][j]/=p;
      }


      for(let row=0;row<3;row++){

        if(row===col){
          continue;
        }

        const f=
          m[row][col];

        for(
          let j=col;
          j<4;
          j++
        ){

          m[row][j]-=
            f*m[col][j];
        }
      }
    }


    return[
      m[0][3],
      m[1][3],
      m[2][3]
    ];
  }


  const base=[
    [
      src[0].x,
      src[0].y,
      1
    ],
    [
      src[1].x,
      src[1].y,
      1
    ],
    [
      src[2].x,
      src[2].y,
      1
    ]
  ];


  const X=
    gaussian(
      base.map(
        (r,i)=>[
          r[0],
          r[1],
          r[2],
          dst[i].x
        ]
      )
    );


  const Y=
    gaussian(
      base.map(
        (r,i)=>[
          r[0],
          r[1],
          r[2],
          dst[i].y
        ]
      )
    );


  if(!X||!Y){
    return null;
  }


  return{
    a:X[0],
    b:X[1],
    c:X[2],

    d:Y[0],
    e:Y[1],
    f:Y[2]
  };
}


/* =========================================================
   逆変換
========================================================= */

function inverseAffine(T){

  const det=
    T.a*T.e-
    T.b*T.d;


  if(
    Math.abs(det)<1e-10
  ){
    return null;
  }


  return function(x,y){

    const X=
      x-T.c;

    const Y=
      y-T.f;


    return{
      x:
        (
          T.e*X-
          T.b*Y
        )/det,

      y:
        (
          -T.d*X+
          T.a*Y
        )/det
    };
  };
}


/* =========================================================
   画像のパッチ平均
========================================================= */

function patchAverage(
  imageData,
  x,
  y,
  radius
){

  const w=
    imageData.width;

  const h=
    imageData.height;

  let r=0;
  let g=0;
  let b=0;
  let n=0;


  const rr=
    radius*radius;


  for(
    let dy=-radius;
    dy<=radius;
    dy++
  ){

    for(
      let dx=-radius;
      dx<=radius;
      dx++
    ){

      if(
        dx*dx+
        dy*dy>
        rr
      ){
        continue;
      }


      const px=
        Math.round(x+dx);

      const py=
        Math.round(y+dy);


      if(
        px<0||
        py<0||
        px>=w||
        py>=h
      ){
        continue;
      }


      const i=
        (py*w+px)*4;


      r+=imageData.data[i];
      g+=imageData.data[i+1];
      b+=imageData.data[i+2];

      n++;
    }
  }


  if(!n){
    return null;
  }


  return{
    r:r/n,
    g:g/n,
    b:b/n
  };
}


/* =========================================================
   色距離
========================================================= */

function colorDistance(a,b){

  const dr=a.r-b.r;
  const dg=a.g-b.g;
  const db=a.b-b.b;

  return Math.sqrt(
    dr*dr+
    dg*dg+
    db*db
  );
}


/* =========================================================
   図形のON/OFF判定
========================================================= */

function readSlot(
  imageData,
  inverse,
  slot
){

  const center=
    inverse(
      slot.x,
      slot.y
    );


  /*
   * 中央
   */
  const centerColor=
    patchAverage(
      imageData,
      center.x,
      center.y,
      6
    );


  if(!centerColor){
    return 0;
  }


  /*
   * 周辺12点
   */
  const around=[];


  for(let i=0;i<12;i++){

    const angle=
      Math.PI*2*i/12;


    const p=
      inverse(
        slot.x+
        Math.cos(angle)*24,

        slot.y+
        Math.sin(angle)*24
      );


    const c=
      patchAverage(
        imageData,
        p.x,
        p.y,
        4
      );


    if(c){
      around.push(c);
    }
  }


  if(around.length<6){
    return 0;
  }


  /*
   * 周辺背景
   */
  const bg={
    r:0,
    g:0,
    b:0
  };


  for(const c of around){

    bg.r+=c.r;
    bg.g+=c.g;
    bg.b+=c.b;
  }


  bg.r/=around.length;
  bg.g/=around.length;
  bg.b/=around.length;


  const diff=
    colorDistance(
      centerColor,
      bg
    );


  /*
   * 中央が背景より
   * はっきり違えば図形あり
   */
  return diff>20 ? 1 : 0;
}


/* =========================================================
   読み取り
========================================================= */

function readAllSlots(
  imageData,
  inverse
){

  const bits=[];


  for(const slot of SLOTS){

    bits.push(
      readSlot(
        imageData,
        inverse,
        slot
      )
    );
  }


  return bits;
}


/* =========================================================
   ビット → バイト
========================================================= */

function bitsToBytes(bits){

  const bytes=[];


  for(
    let i=0;
    i+7<bits.length;
    i+=8
  ){

    let value=0;


    for(let j=0;j<8;j++){

      value=
        (value<<1)|
        bits[i+j];
    }


    bytes.push(value);
  }


  return bytes;
}


/* =========================================================
   デコード
========================================================= */

function decode(bits){

  if(
    bits.length!==SLOT_COUNT
  ){
    return null;
  }


  const payload=[];


  /*
   * 17グループ
   */
  for(
    let g=0;
    g<GROUP_COUNT;
    g++
  ){

    const group=
      bits.slice(
        g*GROUP_SIZE,
        (g+1)*GROUP_SIZE
      );


    /*
     * 必ず16個ON
     */
    let ones=0;

    for(const b of group){
      ones+=b;
    }


    /*
     * カメラノイズで1つ違っても
     * ここで失敗する
     */
    if(ones!==ON_COUNT){
      return null;
    }


    const rank=
      rankCombination(group);


    /*
     * 29bit
     */
    for(
      let i=28;
      i>=0;
      i--
    ){

      payload.push(
        (Math.floor(rank/
          Math.pow(2,i)
        ))&1
      );
    }
  }


  /*
   * 493bit
   *
   * 先頭5bit = 文字数
   * 次480bit = 最大30文字
   * 最後8bit = CRC
   */
  let length=0;


  for(let i=0;i<5;i++){

    length=
      (length<<1)|
      payload[i];
  }


  if(
    length<0||
    length>30
  ){
    return null;
  }


  /*
   * 30文字分
   */
  const dataBits=
    payload.slice(
      5,
      5+480
    );


  const bytes=[];


  for(
    let i=0;
    i<length*2;
    i++
  ){

    let value=0;


    for(let j=0;j<8;j++){

      const index=
        i*8+j;


      value=
        (value<<1)|
        (dataBits[index]||0);
    }


    bytes.push(value);
  }


  /*
   * CRC
   */
  let storedCRC=0;


  for(let i=0;i<8;i++){

    storedCRC=
      (storedCRC<<1)|
      payload[
        5+480+i
      ];
  }


  if(
    crc8(bytes)!==
    storedCRC
  ){
    return null;
  }


  /*
   * UTF-16
   */
  let text="";


  for(
    let i=0;
    i+1<bytes.length;
    i+=2
  ){

    text+=String.fromCharCode(
      (bytes[i]<<8)|
      bytes[i+1]
    );
  }


  return text;
}


/* =========================================================
   1回の画像を読む
========================================================= */

function scanImage(imageData){

  const triangle=
    findMarkerTriangle(
      imageData
    );


  if(!triangle){
    return null;
  }


  const transform=
    affineFrom3(
      triangle,
      MARKS
    );


  if(!transform){
    return null;
  }


  const inverse=
    inverseAffine(
      transform
    );


  if(!inverse){
    return null;
  }


  const bits=
    readAllSlots(
      imageData,
      inverse
    );


  return decode(bits);
}


/* =========================================================
   カメラ
========================================================= */

let cameraStream=null;


async function startCamera(){

  if(
    !navigator.mediaDevices||
    !navigator.mediaDevices.getUserMedia
  ){
    return;
  }


  try{

    cameraStream=
      await navigator.mediaDevices
      .getUserMedia({

        video:{
          facingMode:{
            ideal:"environment"
          },

          width:{
            ideal:1920
          },

          height:{
            ideal:1080
          }
        },

        audio:false
      });


    video.srcObject=
      cameraStream;

  }catch(e){

    /*
     * カメラ拒否時も
     * 画像読み込みは使用可能
     */
  }
}


/* =========================================================
   カメラ画像
========================================================= */

function capture(){

  if(
    !video.videoWidth||
    !video.videoHeight
  ){
    return null;
  }


  canvas.width=
    video.videoWidth;

  canvas.height=
    video.videoHeight;


  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );


  return ctx.getImageData(
    0,
    0,
    canvas.width,
    canvas.height
  );
}


/* =========================================================
   スキャンボタン
========================================================= */

scanButton.addEventListener(
  "click",
  async()=>{

    flash.classList.remove("on");

    void flash.offsetWidth;

    flash.classList.add("on");


    const image=
      capture();


    if(!image){
      return;
    }


    /*
     * UIを固めないように
     * 次のフレームで解析
     */
    await new Promise(
      resolve=>
        requestAnimationFrame(resolve)
    );


    const text=
      scanImage(image);


    if(text!==null){

      showResult(text);
    }
  }
);


/* =========================================================
   画像読み込み
========================================================= */

imageButton.addEventListener(
  "click",
  ()=>{
    imageInput.click();
  }
);


imageInput.addEventListener(
  "change",
  ()=>{

    const file=
      imageInput.files[0];

    if(!file){
      return;
    }


    const img=
      new Image();


    img.onload=()=>{

      canvas.width=
        img.naturalWidth;

      canvas.height=
        img.naturalHeight;


      ctx.drawImage(
        img,
        0,
        0
      );


      const image=
        ctx.getImageData(
          0,
          0,
          canvas.width,
          canvas.height
        );


      const text=
        scanImage(image);


      if(text!==null){

        showResult(text);
      }


      URL.revokeObjectURL(
        img.src
      );
    };


    img.src=
      URL.createObjectURL(file);
  }
);


/* =========================================================
   結果
========================================================= */

function showResult(text){

  /*
   * URL
   */
  if(
    /^https?:\/\/[^\s]+$/i
      .test(text)
  ){

    const newWindow=
      window.open(
        text,
        "_blank"
      );


    /*
     * iPhone/Safariで
     * ポップアップが止められた場合
     */
    if(!newWindow){

      resultText.textContent=
        text;

      result.classList.add("show");
    }

    return;
  }


  resultText.textContent=
    text;

  result.classList.add("show");
}


closeResult.addEventListener(
  "click",
  ()=>{
    result.classList.remove(
      "show"
    );
  }
);


/* =========================================================
   起動時にカメラ開始
========================================================= */

startCamera();


/* =========================================================
   終了時
========================================================= */

window.addEventListener(
  "pagehide",
  ()=>{

    if(cameraStream){

      for(
        const track of
        cameraStream.getTracks()
      ){

        track.stop();
      }
    }
  }
);
