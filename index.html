<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>POTE CODE SCANNER</title>

<style>

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  background:#f7f2e3;
  overflow:hidden;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Sans",
    "Yu Gothic",
    sans-serif;
}

body{
  display:flex;
  align-items:center;
  justify-content:center;
}

#app{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:20px;
}

/* =========================
   カメラ表示
========================= */

.camera{
  position:relative;

  width:min(92vw,600px);
  aspect-ratio:1/1;

  border-radius:28px;

  overflow:hidden;

  background:#ded8ca;
}

video,
#imagePreview{
  position:absolute;

  inset:0;

  width:100%;
  height:100%;

  object-fit:cover;

  display:none;
}

video.active,
#imagePreview.active{
  display:block;
}

/* =========================
   丸い点線ガイド
========================= */

.guide{
  position:absolute;

  left:50%;
  top:50%;

  width:82%;
  aspect-ratio:1/1;

  transform:translate(-50%,-50%);

  border:3px dashed rgba(255,255,255,.9);

  border-radius:50%;

  pointer-events:none;

  filter:
    drop-shadow(0 1px 3px rgba(0,0,0,.25));
}

/* =========================
   ボタン
========================= */

.buttons{
  width:min(92vw,600px);

  display:flex;
  gap:10px;

  margin-top:16px;
}

button{
  flex:1;

  border:0;

  border-radius:999px;

  padding:15px 18px;

  background:#71866c;
  color:white;

  font-size:16px;
  font-weight:700;

  cursor:pointer;

  -webkit-tap-highlight-color:transparent;
}

button:active{
  transform:scale(.98);
}

input[type=file]{
  display:none;
}

/* =========================
   読み取り結果
========================= */

#result{
  width:min(92vw,600px);

  margin-top:14px;

  padding:12px 16px;

  min-height:48px;

  border-radius:14px;

  background:rgba(255,255,255,.7);

  color:#66584d;

  font-size:16px;

  text-align:center;

  word-break:break-word;

  display:none;
}

</style>
</head>

<body>

<div id="app">

  <div class="camera">

    <video
      id="video"
      autoplay
      playsinline>
    </video>

    <img
      id="imagePreview"
      alt="">

    <div
      class="guide">
    </div>

  </div>


  <div class="buttons">

    <button
      id="cameraButton">
      カメラを起動
    </button>

    <button
      id="imageButton">
      画像から読み込み
    </button>

  </div>


  <input
    id="fileInput"
    type="file"
    accept="image/*">


  <div id="result"></div>

</div>


<script>

/* =========================================================
   POTE CODE SCANNER
   =========================================================

   ・カメラ起動
   ・画像読み込み
   ・3つの角度合わせマークを検出
   ・POTE CODEの544スロットを読む

   データ判定：
   図形がある = 1
   図形がない = 0

   色・図形種類・大きさはデータには使用しない。
========================================================= */


const video =
  document.getElementById("video");

const imagePreview =
  document.getElementById("imagePreview");

const cameraButton =
  document.getElementById("cameraButton");

const imageButton =
  document.getElementById("imageButton");

const fileInput =
  document.getElementById("fileInput");

const result =
  document.getElementById("result");


let stream=null;


/* =========================================================
   カメラ
========================================================= */

cameraButton.addEventListener(
  "click",
  async()=>{
    try{

      if(stream){

        stream.getTracks().forEach(
          track=>track.stop()
        );

      }

      stream =
        await navigator.mediaDevices.getUserMedia({
          video:{
            facingMode:{
              ideal:"environment"
            },
            width:{
              ideal:1920
            },
            height:{
              ideal:1920
            }
          },
          audio:false
        });

      video.srcObject=stream;

      video.classList.add("active");
      imagePreview.classList.remove("active");

      result.style.display="none";

      cameraButton.textContent="カメラを起動中";

    }catch(error){

      alert(
        "カメラを起動できませんでした。"
      );

    }

  }
);


/* =========================================================
   画像
========================================================= */

imageButton.addEventListener(
  "click",
  ()=>{
    fileInput.click();
  }
);


fileInput.addEventListener(
  "change",
  ()=>{
    
    const file =
      fileInput.files[0];

    if(!file){
      return;
    }

    const url =
      URL.createObjectURL(file);

    imagePreview.src=url;

    imagePreview.onload=()=>{

      video.classList.remove("active");

      imagePreview.classList.add("active");

      result.style.display="none";

      scanImage(imagePreview);

    };

  }
);


/* =========================================================
   固定値
========================================================= */

const CENTER=750;

const SLOT_COUNT=544;

const MIN_R=150;

const MAX_R=675;


/* =========================================================
   固定乱数
   生成側と完全に同じ
========================================================= */

let seed=9283746;

function random(){

  seed =
    (seed*1664525+1013904223)
    >>>0;

  return seed/4294967296;

}


/* =========================================================
   スロット生成

   生成側と同じ位置を作る。
========================================================= */

function createSlots(){

  seed=9283746;

  const result=[];

  const MIN_DISTANCE=31;

  let safety=0;

  while(
    result.length<SLOT_COUNT &&
    safety<300000
  ){

    safety++;

    const r=
      Math.sqrt(
        random()*
        (
          MAX_R*MAX_R-
          MIN_R*MIN_R
        )+
        MIN_R*MIN_R
      );

    const angle=
      random()*Math.PI*2;

    const x=
      CENTER+
      Math.cos(angle)*r;

    const y=
      CENTER+
      Math.sin(angle)*r;

    let ok=true;

    for(const p of result){

      const dx=x-p.x;
      const dy=y-p.y;

      if(
        dx*dx+dy*dy<
        MIN_DISTANCE*MIN_DISTANCE
      ){

        ok=false;
        break;

      }

    }

    if(ok){

      result.push({x,y});

    }

  }

  return result;

}


const DATA_SLOTS=
  createSlots();


/* =========================================================
   3つの角度合わせマーク

   生成側と同じ位置
========================================================= */

const ALIGN_MARKS=[
  {
    x:235,
    y:350
  },
  {
    x:1265,
    y:350
  },
  {
    x:750,
    y:1270
  }
];


/* =========================================================
   Canvas
========================================================= */

const canvas=
  document.createElement("canvas");

const ctx=
  canvas.getContext("2d",{
    willReadFrequently:true
  });


/* =========================================================
   画像をスキャン
========================================================= */

function scanImage(source){

  const w=
    source.videoWidth ||
    source.naturalWidth ||
    source.width;

  const h=
    source.videoHeight ||
    source.naturalHeight ||
    source.height;

  if(!w || !h){
    return;
  }

  const max=1600;

  const scale=
    Math.min(
      1,
      max/Math.max(w,h)
    );

  canvas.width=
    Math.round(w*scale);

  canvas.height=
    Math.round(h*scale);

  ctx.drawImage(
    source,
    0,
    0,
    canvas.width,
    canvas.height
  );

  decodeCanvas();

}


/* =========================================================
   3つのマークを探す

   マークは生成側で固定された位置にあるため、
   まず画像内から円形の特徴を探す。
========================================================= */

function findAlignmentMarks(){

  const image=
    ctx.getImageData(
      0,
      0,
      canvas.width,
      canvas.height
    );

  const data=
    image.data;

  const w=
    canvas.width;

  const h=
    canvas.height;


  const candidates=[];


  /*
    明るい円形領域を探す。

    POTE CODEの背景は明るく、
    マークは比較的濃い色なので
    周辺との差を見る。
  */

  const step=
    Math.max(
      3,
      Math.floor(
        Math.min(w,h)/400
      )
    );


  for(
    let y=20;
    y<h-20;
    y+=step
  ){

    for(
      let x=20;
      x<w-20;
      x+=step
    ){

      const i=
        (y*w+x)*4;

      const r=data[i];
      const g=data[i+1];
      const b=data[i+2];

      const brightness=
        (r+g+b)/3;


      /*
        中程度の明るさの
        色付き領域を候補にする。
      */

      if(
        brightness>70 &&
        brightness<220
      ){

        candidates.push({
          x,
          y,
          score:
            255-brightness
        });

      }

    }

  }


  /*
    強い候補をまとめる
  */

  candidates.sort(
    (a,b)=>b.score-a.score
  );


  const result=[];

  const minDist=
    Math.min(w,h)*.12;


  for(const p of candidates){

    let near=false;

    for(const q of result){

      const dx=p.x-q.x;
      const dy=p.y-q.y;

      if(
        dx*dx+dy*dy<
        minDist*minDist
      ){

        near=true;
        break;

      }

    }

    if(!near){

      result.push(p);

    }

    if(result.length>=20){
      break;
    }

  }


  return result;

}


/* =========================================================
   3点を位置に割り当てる

   左上・右上・下
========================================================= */

function assignMarks(points){

  if(points.length<3){
    return null;
  }


  /*
    yが小さいものを上側とする。
  */

  const sorted=
    [...points].sort(
      (a,b)=>a.y-b.y
    );


  const top=
    sorted.slice(0,Math.min(8,sorted.length));


  let left=null;
  let right=null;


  for(const p of top){

    if(
      !left ||
      p.x<left.x
    ){
      left=p;
    }

    if(
      !right ||
      p.x>right.x
    ){
      right=p;
    }

  }


  if(!left || !right){
    return null;
  }


  let bottom=null;

  for(const p of points){

    if(
      p===left ||
      p===right
    ){
      continue;
    }

    if(
      !bottom ||
      p.y>bottom.y
    ){
      bottom=p;
    }

  }


  if(!bottom){
    return null;
  }


  return {
    left,
    right,
    bottom
  };

}


/* =========================================================
   3点からアフィン変換を作る

   カメラ画像上の3点
       ↓
   POTE CODE上の3点

   これで

   ・位置
   ・回転
   ・拡大縮小
   ・傾き

   を合わせる。
========================================================= */

function makeAffine(mark){

  const p1=mark.left;
  const p2=mark.right;
  const p3=mark.bottom;


  const q1=ALIGN_MARKS[0];
  const q2=ALIGN_MARKS[1];
  const q3=ALIGN_MARKS[2];


  /*
    入力画像の三角形
  */

  const x1=p1.x;
  const y1=p1.y;

  const x2=p2.x;
  const y2=p2.y;

  const x3=p3.x;
  const y3=p3.y;


  const det=
    x1*(y2-y3)+
    x2*(y3-y1)+
    x3*(y1-y2);


  if(Math.abs(det)<1){
    return null;
  }


  /*
    入力 → POTE CODE
  */

  const a=
    (
      q1.x*(y2-y3)+
      q2.x*(y3-y1)+
      q3.x*(y1-y2)
    )/det;


  const b=
    (
      q1.x*(x3-x2)+
      q2.x*(x1-x3)+
      q3.x*(x2-x1)
    )/det;


  const c=
    (
      q1.x*(x2*y3-x3*y2)+
      q2.x*(x3*y1-x1*y3)+
      q3.x*(x1*y2-x2*y1)
    )/det;


  const d=
    (
      q1.y*(y2-y3)+
      q2.y*(y3-y1)+
      q3.y*(y1-y2)
    )/det;


  const e=
    (
      q1.y*(x3-x2)+
      q2.y*(x1-x3)+
      q3.y*(x2-x1)
    )/det;


  const f=
    (
      q1.y*(x2*y3-x3*y2)+
      q2.y*(x3*y1-x1*y3)+
      q3.y*(x1*y2-x2*y1)
    )/det;


  return {
    a,b,c,d,e,f
  };

}


/* =========================================================
   座標変換
========================================================= */

function transformPoint(T,x,y){

  return {
    x:
      T.a*x+
      T.b*y+
      T.c,

    y:
      T.d*x+
      T.e*y+
      T.f
  };

}


/* =========================================================
   画像をPOTE CODE座標へ変換
========================================================= */

function sampleAtCodePosition(
  T,
  x,
  y
){

  /*
    逆変換が必要なので
    2×2行列を反転する。
  */

  const det=
    T.a*T.e-
    T.b*T.d;


  if(Math.abs(det)<0.000001){
    return 0;
  }


  const tx=
    x-T.c;

  const ty=
    y-T.f;


  const sx=
    (
      T.e*tx-
      T.b*ty
    )/det;


  const sy=
    (
      -T.d*tx+
      T.a*ty
    )/det;


  return readShapeAt(
    sx,
    sy
  );

}


/* =========================================================
   指定位置に図形があるか調べる
========================================================= */

function readShapeAt(x,y){

  /*
    座標はカメラ画像側。

    生成された図形は
    色々な色なので、
    背景との色差を利用する。

    中心付近だけでなく
    小さな円形領域を調べる。
  */

  const radius=12;

  let colored=0;

  let total=0;


  for(
    let yy=-radius;
    yy<=radius;
    yy+=2
  ){

    for(
      let xx=-radius;
      xx<=radius;
      xx+=2
    ){

      if(
        xx*xx+
        yy*yy>
        radius*radius
      ){
        continue;
      }


      const px=
        Math.round(x+xx);

      const py=
        Math.round(y+yy);


      if(
        px<0 ||
        py<0 ||
        px>=canvas.width ||
        py>=canvas.height
      ){
        continue;
      }


      const i=
        (py*canvas.width+px)*4;


      const r=
        ctx.getImageData(
          px,
          py,
          1,
          1
        ).data[0];

      const g=
        ctx.getImageData(
          px,
          py,
          1,
          1
        ).data[1];

      const b=
        ctx.getImageData(
          px,
          py,
          1,
          1
        ).data[2];


      const brightness=
        (r+g+b)/3;


      /*
        背景 #FFFDF5 に対して
        明らかに色がある部分。
      */

      if(
        brightness<225 ||
        Math.max(r,g,b)-
        Math.min(r,g,b)>20
      ){

        colored++;

      }

      total++;

    }

  }


  return
    colored/
    Math.max(1,total)
    >.18
    ?1
    :0;

}


/* =========================================================
   bits → 数値
========================================================= */

function bitsToNumber(bits){

  let n=0;

  for(const b of bits){

    n=n*2+b;

  }

  return n;

}


/* =========================================================
   組み合わせ
========================================================= */

function C(n,k){

  if(k<0 || k>n){
    return 0;
  }

  k=Math.min(k,n-k);

  let r=1;

  for(
    let i=1;
    i<=k;
    i++
  ){

    r=
      r*(n-k+i)/i;

  }

  return Math.round(r);

}


/* =========================================================
   32bitの16個ONを復元
========================================================= */

function rank(bits){

  let r=0;

  let ones=16;


  for(let i=0;i<32;i++){

    if(bits[i]===1){

      r+=
        C(
          31-i,
          ones
        );

      ones--;

    }

  }


  return r;

}


/* =========================================================
   CRC8
========================================================= */

function crc8(bits){

  let crc=0;

  for(const bit of bits){

    const mix=
      ((crc>>7)&1)^bit;

    crc=
      (crc<<1)&255;

    if(mix){
      crc^=0x07;
    }

  }

  return crc;

}


/* =========================================================
   544bit → パケット
========================================================= */

function decodeBits(allBits){

  const packet=[];


  for(
    let g=0;
    g<17;
    g++
  ){

    const group=
      allBits.slice(
        g*32,
        g*32+32
      );


    /*
      本来16個ON。
    */

    const count=
      group.reduce(
        (a,b)=>a+b,
        0
      );


    if(count!==16){

      return null;

    }


    const value=
      rank(group);


    const bits=[];


    for(
      let i=28;
      i>=0;
      i--
    ){

      bits.push(
        (value>>i)&1
      );

    }


    packet.push(...bits);

  }


  return packet.slice(0,493);

}


/* =========================================================
   パケット → 文字列
========================================================= */

function bitsToText(packet){

  if(
    !packet ||
    packet.length<493
  ){
    return null;
  }


  let length=0;

  for(let i=0;i<5;i++){

    length=
      length*2+
      packet[i];

  }


  if(length<1 || length>30){

    return null;

  }


  const body=
    packet.slice(
      5,
      5+480
    );


  const crcBits=
    packet.slice(
      485,
      493
    );


  const storedCRC=
    bitsToNumber(
      crcBits
    );


  const actualCRC=
    crc8(body);


  if(
    storedCRC!==actualCRC
  ){

    return null;

  }


  let text="";


  for(
    let i=0;
    i<length;
    i++
  ){

    let code=0;


    for(
      let b=0;
      b<16;
      b++
    ){

      code=
        code*2+
        body[
          i*16+b
        ];

    }


    text+=
      String.fromCharCode(code);

  }


  return text;

}


/* =========================================================
   メインデコード
========================================================= */

function decodeCanvas(){

  const candidates=
    findAlignmentMarks();


  const marks=
    assignMarks(
      candidates
    );


  /*
    マーク検出に失敗した場合
  */

  if(!marks){

    result.style.display="block";

    result.textContent=
      "読み取りできませんでした";

    return;

  }


  const T=
    makeAffine(marks);


  if(!T){

    result.style.display="block";

    result.textContent=
      "読み取りできませんでした";

    return;

  }


  const bits=[];


  for(
    let i=0;
    i<DATA_SLOTS.length;
    i++
  ){

    const p=
      DATA_SLOTS[i];


    const bit=
      sampleAtCodePosition(
        T,
        p.x,
        p.y
      );


    bits.push(bit);

  }


  const packet=
    decodeBits(bits);


  const text=
    bitsToText(packet);


  result.style.display="block";


  if(text!==null){

    result.textContent=text;

  }else{

    result.textContent=
      "読み取りできませんでした";

  }

}


/* =========================================================
   カメラ映像から読み取り

   今回はボタンでカメラを起動して
   映像を表示するところをシンプルに。

   必要なら後から自動スキャンを追加可能。
========================================================= */

</script>

</body>
</html>
