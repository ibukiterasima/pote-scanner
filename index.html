<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>POTE CODE SCANNER</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#f7f2e3;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Sans",
    "Yu Gothic",
    sans-serif;
}

body{
  display:flex;
  align-items:center;
  justify-content:center;
}

#app{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.camera{
  position:relative;
  width:min(92vw,600px);
  aspect-ratio:1/1;
  overflow:hidden;
  border-radius:28px;
  background:#ded8ca;
}

video,
#imagePreview{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  display:none;
}

video.active,
#imagePreview.active{
  display:block;
}

.guide{
  position:absolute;
  left:50%;
  top:50%;
  width:82%;
  aspect-ratio:1/1;
  transform:translate(-50%,-50%);
  border:3px dashed rgba(255,255,255,.9);
  border-radius:50%;
  pointer-events:none;
  filter:drop-shadow(0 1px 3px rgba(0,0,0,.25));
}

.buttons{
  width:min(92vw,600px);
  display:flex;
  gap:10px;
  margin-top:16px;
}

button{
  flex:1;
  border:0;
  border-radius:999px;
  padding:15px 18px;
  background:#71866c;
  color:white;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}

button:active{
  transform:scale(.98);
}

input[type=file]{
  display:none;
}

#result{
  width:min(92vw,600px);
  margin-top:14px;
  padding:12px 16px;
  min-height:48px;
  border-radius:14px;
  background:rgba(255,255,255,.7);
  color:#66584d;
  font-size:16px;
  text-align:center;
  word-break:break-word;
  display:none;
}
</style>
</head>

<body>

<div id="app">

  <div class="camera">

    <video
      id="video"
      autoplay
      playsinline>
    </video>

    <img
      id="imagePreview"
      alt="">

    <div class="guide"></div>

  </div>

  <div class="buttons">

    <button id="cameraButton">
      カメラを起動
    </button>

    <button id="imageButton">
      画像から読み込み
    </button>

  </div>

  <input
    id="fileInput"
    type="file"
    accept="image/*">

  <div id="result"></div>

</div>


<script>

/* =========================================================
   POTE CODE SCANNER
   =========================================================

   カメラ
   ↓
   常時フレームをチェック
   ↓
   3つの角度合わせマークを検出
   ↓
   自動で位置・角度を合わせる
   ↓
   544スロットを読み取る
   ↓
   正しいCRCなら文字を表示

========================================================= */


/* =========================================================
   DOM
========================================================= */

const video =
  document.getElementById("video");

const imagePreview =
  document.getElementById("imagePreview");

const cameraButton =
  document.getElementById("cameraButton");

const imageButton =
  document.getElementById("imageButton");

const fileInput =
  document.getElementById("fileInput");

const result =
  document.getElementById("result");


let stream=null;

let scanning=false;

let scanBusy=false;


/* =========================================================
   固定値
========================================================= */

const CENTER=750;

const SLOT_COUNT=544;

const MIN_R=150;

const MAX_R=675;


/* =========================================================
   POTE CODE固定スロット
========================================================= */

let seed=9283746;

function random(){

  seed=
    (seed*1664525+1013904223)
    >>>0;

  return seed/4294967296;

}


function createSlots(){

  seed=9283746;

  const result=[];

  const MIN_DISTANCE=31;

  let safety=0;

  while(
    result.length<SLOT_COUNT &&
    safety<300000
  ){

    safety++;

    const r=
      Math.sqrt(
        random()*
        (
          MAX_R*MAX_R-
          MIN_R*MIN_R
        )+
        MIN_R*MIN_R
      );

    const angle=
      random()*Math.PI*2;

    const x=
      CENTER+
      Math.cos(angle)*r;

    const y=
      CENTER+
      Math.sin(angle)*r;

    let ok=true;

    for(const p of result){

      const dx=x-p.x;
      const dy=y-p.y;

      if(
        dx*dx+dy*dy<
        MIN_DISTANCE*MIN_DISTANCE
      ){

        ok=false;
        break;

      }

    }

    if(ok){

      result.push({x,y});

    }

  }

  return result;

}


const DATA_SLOTS=
  createSlots();


/* =========================================================
   角度合わせマーク
========================================================= */

const ALIGN_MARKS=[
  {
    x:235,
    y:350
  },
  {
    x:1265,
    y:350
  },
  {
    x:750,
    y:1270
  }
];


/* =========================================================
   Canvas
========================================================= */

const canvas=
  document.createElement("canvas");

const ctx=
  canvas.getContext(
    "2d",
    {
      willReadFrequently:true
    }
  );


/* =========================================================
   カメラ起動
========================================================= */

cameraButton.addEventListener(
  "click",
  async()=>{

    try{

      if(stream){

        stream
          .getTracks()
          .forEach(
            track=>track.stop()
          );

      }

      stream=
        await navigator.mediaDevices
        .getUserMedia({

          video:{
            facingMode:{
              ideal:"environment"
            },

            width:{
              ideal:1920
            },

            height:{
              ideal:1920
            }
          },

          audio:false

        });


      video.srcObject=stream;

      video.classList.add("active");

      imagePreview.classList.remove("active");

      result.style.display="none";

      cameraButton.textContent=
        "カメラを起動中";

      scanning=true;

      requestAnimationFrame(
        cameraLoop
      );

    }
    catch(error){

      alert(
        "カメラを起動できませんでした。"
      );

    }

  }
);


/* =========================================================
   カメラ自動スキャン
========================================================= */

function cameraLoop(){

  if(!scanning){
    return;
  }

  if(
    video.readyState>=2 &&
    !scanBusy
  ){

    scanBusy=true;

    try{

      scanVideoFrame();

    }
    catch(e){

      /*
        フレーム単位のエラーでは
        カメラを止めない。
      */

    }

    scanBusy=false;

  }

  requestAnimationFrame(
    cameraLoop
  );

}


/* =========================================================
   カメラフレーム
========================================================= */

function scanVideoFrame(){

  const w=
    video.videoWidth;

  const h=
    video.videoHeight;


  if(!w || !h){
    return;
  }


  /*
    毎フレーム全部を解析すると重いので
    最大1200px程度に縮小。
  */

  const max=1200;

  const scale=
    Math.min(
      1,
      max/Math.max(w,h)
    );


  canvas.width=
    Math.round(w*scale);

  canvas.height=
    Math.round(h*scale);


  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );


  tryDecode();
}


/* =========================================================
   画像読み込み
========================================================= */

imageButton.addEventListener(
  "click",
  ()=>{
    fileInput.click();
  }
);


fileInput.addEventListener(
  "change",
  ()=>{

    const file=
      fileInput.files[0];

    if(!file){
      return;
    }


    const url=
      URL.createObjectURL(file);


    imagePreview.src=url;


    imagePreview.onload=()=>{

      scanning=false;

      video.classList.remove("active");

      imagePreview.classList.add("active");

      scanImage(imagePreview);

    };

  }
);


/* =========================================================
   画像 → Canvas
========================================================= */

function scanImage(source){

  const w=
    source.naturalWidth;

  const h=
    source.naturalHeight;


  if(!w || !h){
    return;
  }


  const max=1600;

  const scale=
    Math.min(
      1,
      max/Math.max(w,h)
    );


  canvas.width=
    Math.round(w*scale);

  canvas.height=
    Math.round(h*scale);


  ctx.drawImage(
    source,
    0,
    0,
    canvas.width,
    canvas.height
  );


  tryDecode();
}


/* =========================================================
   3つのマークを検出
========================================================= */

function findAlignmentMarks(){

  const w=canvas.width;

  const h=canvas.height;


  const image=
    ctx.getImageData(
      0,
      0,
      w,
      h
    );


  const data=image.data;


  /*
    POTE CODEは明るい背景。

    マークは周囲より濃い
    色付き領域として検出する。
  */

  const step=
    Math.max(
      4,
      Math.floor(
        Math.min(w,h)/350
      )
    );


  const candidates=[];


  for(
    let y=10;
    y<h-10;
    y+=step
  ){

    for(
      let x=10;
      x<w-10;
      x+=step
    ){

      const i=
        (y*w+x)*4;


      const r=data[i];

      const g=data[i+1];

      const b=data[i+2];


      const brightness=
        (r+g+b)/3;


      const saturation=
        Math.max(r,g,b)-
        Math.min(r,g,b);


      /*
        極端な黒や白は除外。
      */

      if(
        brightness>60 &&
        brightness<225 &&
        saturation>18
      ){

        candidates.push({
          x,
          y,
          score:
            (255-brightness)+
            saturation*.5
        });

      }

    }

  }


  candidates.sort(
    (a,b)=>b.score-a.score
  );


  /*
    近すぎる候補をまとめる。
  */

  const result=[];

  const minDist=
    Math.min(w,h)*.10;


  for(
    const p of candidates
  ){

    let near=false;


    for(
      const q of result
    ){

      const dx=
        p.x-q.x;

      const dy=
        p.y-q.y;


      if(
        dx*dx+dy*dy<
        minDist*minDist
      ){

        near=true;

        break;

      }

    }


    if(!near){

      result.push(p);

    }


    if(
      result.length>=30
    ){
      break;
    }

  }


  return result;

}


/* =========================================================
   3点を選ぶ
========================================================= */

function assignMarks(points){

  if(points.length<3){
    return null;
  }


  /*
    画像内の候補から
    三角形として最もそれらしい
    3点を探す。

    上側2点
    ＋
    下側1点
  */

  let best=null;

  let bestScore=Infinity;


  for(
    let i=0;
    i<points.length;
    i++
  ){

    for(
      let j=i+1;
      j<points.length;
      j++
    ){

      const a=points[i];

      const b=points[j];


      /*
        まず上側2点。
      */

      const topY=
        (a.y+b.y)/2;


      const topDifference=
        Math.abs(a.y-b.y);


      if(
        topDifference>
        Math.min(canvas.width,canvas.height)*.18
      ){
        continue;
      }


      const topLeft=
        a.x<b.x?a:b;

      const topRight=
        a.x<b.x?b:a;


      const topWidth=
        Math.abs(
          topRight.x-
          topLeft.x
        );


      if(
        topWidth<
        Math.min(canvas.width,canvas.height)*.25
      ){
        continue;
      }


      for(
        let k=0;
        k<points.length;
        k++
      ){

        if(
          k===i ||
          k===j
        ){
          continue;
        }


        const bottom=
          points[k];


        if(
          bottom.y<=topY
        ){
          continue;
        }


        const centerX=
          (
            topLeft.x+
            topRight.x
          )/2;


        const centerDifference=
          Math.abs(
            bottom.x-centerX
          );


        const score=
          topDifference+
          centerDifference;


        if(score<bestScore){

          bestScore=score;

          best={
            left:topLeft,
            right:topRight,
            bottom
          };

        }

      }

    }

  }


  return best;

}


/* =========================================================
   アフィン変換
========================================================= */

function makeAffine(mark){

  const p1=mark.left;

  const p2=mark.right;

  const p3=mark.bottom;


  const q1=ALIGN_MARKS[0];

  const q2=ALIGN_MARKS[1];

  const q3=ALIGN_MARKS[2];


  const x1=p1.x;

  const y1=p1.y;

  const x2=p2.x;

  const y2=p2.y;

  const x3=p3.x;

  const y3=p3.y;


  const det=
    x1*(y2-y3)+
    x2*(y3-y1)+
    x3*(y1-y2);


  if(
    Math.abs(det)<1
  ){

    return null;

  }


  const a=
    (
      q1.x*(y2-y3)+
      q2.x*(y3-y1)+
      q3.x*(y1-y2)
    )/det;


  const b=
    (
      q1.x*(x3-x2)+
      q2.x*(x1-x3)+
      q3.x*(x2-x1)
    )/det;


  const c=
    (
      q1.x*(x2*y3-x3*y2)+
      q2.x*(x3*y1-x1*y3)+
      q3.x*(x1*y2-x2*y1)
    )/det;


  const d=
    (
      q1.y*(y2-y3)+
      q2.y*(y3-y1)+
      q3.y*(y1-y2)
    )/det;


  const e=
    (
      q1.y*(x3-x2)+
      q2.y*(x1-x3)+
      q3.y*(x2-x1)
    )/det;


  const f=
    (
      q1.y*(x2*y3-x3*y2)+
      q2.y*(x3*y1-x1*y3)+
      q3.y*(x1*y2-x2*y1)
    )/det;


  return {
    a,b,c,d,e,f
  };

}


/* =========================================================
   逆変換
========================================================= */

function codeToImage(
  T,
  x,
  y
){

  const det=
    T.a*T.e-
    T.b*T.d;


  if(
    Math.abs(det)<0.000001
  ){

    return null;

  }


  const tx=
    x-T.c;

  const ty=
    y-T.f;


  return {

    x:
      (
        T.e*tx-
        T.b*ty
      )/det,

    y:
      (
        -T.d*tx+
        T.a*ty
      )/det

  };

}


/* =========================================================
   図形判定
========================================================= */

function readShapeAt(
  x,
  y
){

  const radius=10;

  let colored=0;

  let total=0;


  /*
    getImageDataを
    1ピクセルごとに呼ばない。

    一度に小領域を読む。
  */

  const left=
    Math.max(
      0,
      Math.floor(x-radius)
    );

  const top=
    Math.max(
      0,
      Math.floor(y-radius)
    );

  const right=
    Math.min(
      canvas.width-1,
      Math.ceil(x+radius)
    );

  const bottom=
    Math.min(
      canvas.height-1,
      Math.ceil(y+radius)
    );


  if(
    right<=left ||
    bottom<=top
  ){

    return 0;

  }


  const image=
    ctx.getImageData(
      left,
      top,
      right-left+1,
      bottom-top+1
    );


  const data=image.data;


  for(
    let py=0;
    py<=bottom-top;
    py+=2
  ){

    for(
      let px=0;
      px<=right-left;
      px+=2
    ){

      const dx=
        left+px-x;

      const dy=
        top+py-y;


      if(
        dx*dx+
        dy*dy>
        radius*radius
      ){
        continue;
      }


      const i=
        (py*(right-left+1)+px)*4;


      const r=data[i];

      const g=data[i+1];

      const b=data[i+2];


      const brightness=
        (r+g+b)/3;


      const saturation=
        Math.max(r,g,b)-
        Math.min(r,g,b);


      if(
        brightness<225 ||
        saturation>20
      ){

        colored++;

      }


      total++;

    }

  }


  return
    colored/
    Math.max(1,total)
    >.18
    ?1
    :0;

}


/* =========================================================
   544スロット読み取り
========================================================= */

function readAllSlots(T){

  const bits=[];


  for(
    let i=0;
    i<DATA_SLOTS.length;
    i++
  ){

    const p=
      DATA_SLOTS[i];


    const imagePoint=
      codeToImage(
        T,
        p.x,
        p.y
      );


    if(!imagePoint){

      bits.push(0);

      continue;

    }


    bits.push(
      readShapeAt(
        imagePoint.x,
        imagePoint.y
      )
    );

  }


  return bits;

}


/* =========================================================
   組み合わせ
========================================================= */

function C(n,k){

  if(
    k<0 ||
    k>n
  ){

    return 0;

  }


  k=
    Math.min(
      k,
      n-k
    );


  let r=1;


  for(
    let i=1;
    i<=k;
    i++
  ){

    r=
      r*(n-k+i)/i;

  }


  return Math.round(r);

}


/* =========================================================
   32bit → 29bit
========================================================= */

function rank(bits){

  let r=0;

  let ones=16;


  for(
    let i=0;
    i<32;
    i++
  ){

    if(
      bits[i]===1
    ){

      r+=
        C(
          31-i,
          ones
        );

      ones--;

    }

  }


  return r;

}


/* =========================================================
   CRC8
========================================================= */

function crc8(bits){

  let crc=0;


  for(
    const bit of bits
  ){

    const mix=
      ((crc>>7)&1)^bit;


    crc=
      (crc<<1)&255;


    if(mix){

      crc^=0x07;

    }

  }


  return crc;

}


/* =========================================================
   544 → 493bit
========================================================= */

function decodeBits(allBits){

  if(
    allBits.length<
    SLOT_COUNT
  ){

    return null;

  }


  const packet=[];


  for(
    let g=0;
    g<17;
    g++
  ){

    const group=
      allBits.slice(
        g*32,
        g*32+32
      );


    const count=
      group.reduce(
        (a,b)=>a+b,
        0
      );


    /*
      各グループは
      必ず16個ON。
    */

    if(
      count!==16
    ){

      return null;

    }


    const value=
      rank(group);


    const bits=[];


    /*
      29bit
    */

    let n=value;


    for(
      let i=28;
      i>=0;
      i--
    ){

      bits.push(
        Math.floor(
          n/
          Math.pow(2,i)
        )%2
      );

    }


    packet.push(
      ...bits
    );

  }


  return packet.slice(
    0,
    493
  );

}


/* =========================================================
   パケット → 文字列
========================================================= */

function bitsToText(packet){

  if(
    !packet ||
    packet.length<493
  ){

    return null;

  }


  let length=0;


  for(
    let i=0;
    i<5;
    i++
  ){

    length=
      length*2+
      packet[i];

  }


  if(
    length<1 ||
    length>30
  ){

    return null;

  }


  const body=
    packet.slice(
      5,
      485
    );


  const crcBits=
    packet.slice(
      485,
      493
    );


  let storedCRC=0;


  for(
    const bit of crcBits
  ){

    storedCRC=
      storedCRC*2+
      bit;

  }


  const actualCRC=
    crc8(body);


  if(
    storedCRC!==actualCRC
  ){

    return null;

  }


  let text="";


  for(
    let i=0;
    i<length;
    i++
  ){

    let code=0;


    for(
      let b=0;
      b<16;
      b++
    ){

      code=
        code*2+
        body[
          i*16+b
        ];

    }


    text+=
      String.fromCharCode(code);

  }


  return text;

}


/* =========================================================
   自動検出
========================================================= */

function tryDecode(){

  const candidates=
    findAlignmentMarks();


  const marks=
    assignMarks(
      candidates
    );


  if(!marks){
    return;
  }


  const T=
    makeAffine(marks);


  if(!T){
    return;
  }


  const bits=
    readAllSlots(T);


  const packet=
    decodeBits(bits);


  if(!packet){
    return;
  }


  const text=
    bitsToText(packet);


  /*
    CRCまで一致したら
    本物のPOTE CODEと判断。
  */

  if(text===null){
    return;
  }


  showResult(text);

}


/* =========================================================
   読み取り成功
========================================================= */

function showResult(text){

  /*
    カメラ自動スキャン停止
  */

  scanning=false;


  result.style.display="block";

  result.textContent=text;


  /*
    カメラは表示したまま。

    もう一度カメラボタンを
    押せば再スキャンできる。
  */

  cameraButton.textContent=
    "カメラを起動";

}


/* =========================================================
   ページを離れるとき
========================================================= */

window.addEventListener(
  "beforeunload",
  ()=>{
    
    if(stream){

      stream
        .getTracks()
        .forEach(
          track=>track.stop()
        );

    }

  }
);

</script>

</body>
</html>
