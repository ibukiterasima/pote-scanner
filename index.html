<script>

/* =========================================================
   POTE CODE SCANNER ver 1.2

   このスキャナーは
   ユーザー提供の

   POTE CODE ver 1.1

   生成HTMLと完全互換。

   ・LCG乱数
   ・544スロット
   ・17グループ
   ・16 ON
   ・29bit
   ・30 UTF-16文字
   ・CRC8
========================================================= */


/* =========================================================
   基本設定
========================================================= */

const CENTER=750;

const SIZE=1500;

const SLOT_COUNT=544;

const GROUP_SIZE=32;

const GROUP_COUNT=17;

const ON_COUNT=16;

const SEED=9283746;


/* =========================================================
   生成側と同じマーカー
========================================================= */

const MARKS=[
  {
    x:255,
    y:275
  },
  {
    x:1245,
    y:275
  },
  {
    x:255,
    y:1245
  }
];


/* =========================================================
   DOM
========================================================= */

const video=
  document.getElementById("video");

const canvas=
  document.getElementById("canvas");

const ctx=
  canvas.getContext(
    "2d",
    {
      willReadFrequently:true
    }
  );

const scanButton=
  document.getElementById(
    "scanButton"
  );

const imageButton=
  document.getElementById(
    "imageButton"
  );

const imageInput=
  document.getElementById(
    "imageInput"
  );

const flash=
  document.getElementById(
    "flash"
  );

const result=
  document.getElementById(
    "result"
  );

const resultText=
  document.getElementById(
    "resultText"
  );

const closeResult=
  document.getElementById(
    "closeResult"
  );


/* =========================================================
   生成側と同じ乱数
========================================================= */

let seed=SEED;


function random(){

  seed=
    (
      seed*1664525+
      1013904223
    )>>>0;

  return seed/
    4294967296;
}


/* =========================================================
   スロット生成
========================================================= */

function distance(a,b){

  const dx=
    a.x-b.x;

  const dy=
    a.y-b.y;

  return Math.sqrt(
    dx*dx+
    dy*dy
  );
}


function createSlots(){

  seed=SEED;

  const result=[];

  const MIN_R=175;

  const MAX_R=640;

  const MIN_DISTANCE=35;

  let safety=0;


  while(
    result.length<SLOT_COUNT &&
    safety<1000000
  ){

    safety++;


    const r=
      Math.sqrt(
        random()*
        (
          MAX_R*MAX_R-
          MIN_R*MIN_R
        )+
        MIN_R*MIN_R
      );


    const angle=
      random()*
      Math.PI*2;


    const x=
      CENTER+
      Math.cos(angle)*r;


    const y=
      CENTER+
      Math.sin(angle)*r;


    let ok=true;


    /*
     * 既存スロットとの距離
     */
    for(
      const p of result
    ){

      const dx=
        x-p.x;

      const dy=
        y-p.y;


      if(
        dx*dx+
        dy*dy<
        MIN_DISTANCE*
        MIN_DISTANCE
      ){

        ok=false;

        break;
      }
    }


    if(!ok){
      continue;
    }


    /*
     * 3マーカー周辺を除外
     */
    for(
      const m of MARKS
    ){

      const dx=
        x-m.x;

      const dy=
        y-m.y;


      if(
        dx*dx+
        dy*dy<
        90*90
      ){

        ok=false;

        break;
      }
    }


    if(ok){

      result.push({
        x:x,
        y:y
      });

    }
  }


  return result;
}


const DATA_SLOTS=
  createSlots();


/* =========================================================
   組み合わせ
========================================================= */

function C(n,k){

  if(
    k<0||
    k>n
  ){
    return 0;
  }


  k=
    Math.min(
      k,
      n-k
    );


  let r=1;


  for(
    let i=1;
    i<=k;
    i++
  ){

    r=
      r*
      (n-k+i)/
      i;
  }


  return Math.round(r);
}


/* =========================================================
   32ビット → rank

   生成側 unrank と完全対応
========================================================= */

function rank(bits){

  let result=0;

  let ones=16;


  for(
    let i=0;
    i<32;
    i++
  ){

    if(bits[i]===1){

      result+=
        C(
          31-i,
          ones
        );

      ones--;
    }
  }


  return result;
}


/* =========================================================
   rank → 29bit
========================================================= */

function rankToBits(value){

  const bits=[];


  /*
   * 生成側は
   *
   * bitsToNumber(chunk)
   *
   * で29bitを数値化している。
   *
   * そのためここでは
   * 29bit固定で戻す。
   */

  for(
    let i=28;
    i>=0;
    i--
  ){

    bits.push(
      Math.floor(
        value/
        Math.pow(2,i)
      )&1
    );
  }


  return bits;
}


/* =========================================================
   CRC8

   ★重要
   生成側は「bytes」ではなく
   480個のbody bitsにCRCをかけている。

   ここも完全に同じ。
========================================================= */

function crc8(bits){

  let crc=0;


  for(
    const bit of bits
  ){

    const mix=
      (
        (crc>>7)&1
      )^bit;


    crc=
      (crc<<1)&255;


    if(mix){

      crc^=0x07;

    }
  }


  return crc;
}


/* =========================================================
   スロットのON/OFFを取得
========================================================= */

function getPixel(
  imageData,
  x,
  y
){

  const w=
    imageData.width;

  const h=
    imageData.height;


  x=Math.round(x);
  y=Math.round(y);


  if(
    x<0||
    y<0||
    x>=w||
    y>=h
  ){

    return null;
  }


  const i=
    (
      y*w+x
    )*4;


  return {
    r:imageData.data[i],
    g:imageData.data[i+1],
    b:imageData.data[i+2]
  };
}


/* =========================================================
   平均色
========================================================= */

function average(
  imageData,
  x,
  y,
  radius
){

  let r=0;
  let g=0;
  let b=0;
  let count=0;


  for(
    let dy=-radius;
    dy<=radius;
    dy++
  ){

    for(
      let dx=-radius;
      dx<=radius;
      dx++
    ){

      if(
        dx*dx+
        dy*dy>
        radius*radius
      ){

        continue;
      }


      const p=
        getPixel(
          imageData,
          x+dx,
          y+dy
        );


      if(!p){
        continue;
      }


      r+=p.r;
      g+=p.g;
      b+=p.b;

      count++;
    }
  }


  if(count===0){
    return null;
  }


  return {
    r:r/count,
    g:g/count,
    b:b/count
  };
}


/* =========================================================
   色差
========================================================= */

function colorDifference(a,b){

  const dr=
    a.r-b.r;

  const dg=
    a.g-b.g;

  const db=
    a.b-b.b;


  return Math.sqrt(
    dr*dr+
    dg*dg+
    db*db
  );
}


/* =========================================================
   1スロット判定

   図形の色は何色でもOK。

   「中心に図形がある」
   「周囲は背景」

   の差を見る。
========================================================= */

function readSlot(
  imageData,
  inverse,
  slot
){

  const center=
    inverse(
      slot.x,
      slot.y
    );


  const centerColor=
    average(
      imageData,
      center.x,
      center.y,
      6
    );


  if(!centerColor){
    return 0;
  }


  /*
   * 周辺背景
   */
  const surrounding=[];


  for(
    let i=0;
    i<16;
    i++
  ){

    const angle=
      i*
      Math.PI*2/
      16;


    const p=
      inverse(
        slot.x+
        Math.cos(angle)*22,

        slot.y+
        Math.sin(angle)*22
      );


    const c=
      average(
        imageData,
        p.x,
        p.y,
        4
      );


    if(c){
      surrounding.push(c);
    }
  }


  if(
    surrounding.length<8
  ){
    return 0;
  }


  const bg={
    r:0,
    g:0,
    b:0
  };


  for(
    const c of surrounding
  ){

    bg.r+=c.r;
    bg.g+=c.g;
    bg.b+=c.b;
  }


  bg.r/=
    surrounding.length;

  bg.g/=
    surrounding.length;

  bg.b/=
    surrounding.length;


  const diff=
    colorDifference(
      centerColor,
      bg
    );


  /*
   * 色の違い
   */
  if(diff>24){
    return 1;
  }


  /*
   * 暗い図形にも対応
   */
  const centerBrightness=
    (
      centerColor.r+
      centerColor.g+
      centerColor.b
    )/3;


  const bgBrightness=
    (
      bg.r+
      bg.g+
      bg.b
    )/3;


  if(
    Math.abs(
      centerBrightness-
      bgBrightness
    )>18
  ){

    return 1;
  }


  return 0;
}


/* =========================================================
   画像から全スロット
========================================================= */

function readSlots(
  imageData,
  inverse
){

  const bits=[];


  for(
    const slot of DATA_SLOTS
  ){

    bits.push(
      readSlot(
        imageData,
        inverse,
        slot
      )
    );
  }


  return bits;
}


/* =========================================================
   3点からアフィン変換
========================================================= */

function affine(
  src,
  dst
){

  const A=[
    [
      src[0].x,
      src[0].y,
      1
    ],
    [
      src[1].x,
      src[1].y,
      1
    ],
    [
      src[2].x,
      src[2].y,
      1
    ]
  ];


  function solve(values){

    const m=
      A.map(
        (row,i)=>[
          row[0],
          row[1],
          row[2],
          values[i]
        ]
      );


    for(
      let col=0;
      col<3;
      col++
    ){

      let pivot=col;


      for(
        let row=col+1;
        row<3;
        row++
      ){

        if(
          Math.abs(
            m[row][col]
          )>
          Math.abs(
            m[pivot][col]
          )
        ){

          pivot=row;
        }
      }


      if(
        Math.abs(
          m[pivot][col]
        )<
        0.000000001
      ){

        return null;
      }


      [
        m[col],
        m[pivot]
      ]=[
        m[pivot],
        m[col]
      ];


      const div=
        m[col][col];


      for(
        let j=col;
        j<4;
        j++
      ){

        m[col][j]/=
          div;
      }


      for(
        let row=0;
        row<3;
        row++
      ){

        if(row===col){
          continue;
        }


        const factor=
          m[row][col];


        for(
          let j=col;
          j<4;
          j++
        ){

          m[row][j]-=
            factor*
            m[col][j];
        }
      }
    }


    return[
      m[0][3],
      m[1][3],
      m[2][3]
    ];
  }


  const X=
    solve(
      dst.map(
        p=>p.x
      )
    );


  const Y=
    solve(
      dst.map(
        p=>p.y
      )
    );


  if(!X||!Y){
    return null;
  }


  return{
    a:X[0],
    b:X[1],
    c:X[2],

    d:Y[0],
    e:Y[1],
    f:Y[2]
  };
}


/* =========================================================
   逆変換
========================================================= */

function inverseAffine(T){

  const det=
    T.a*T.e-
    T.b*T.d;


  if(
    Math.abs(det)<
    0.000000001
  ){

    return null;
  }


  return function(x,y){

    const X=
      x-T.c;

    const Y=
      y-T.f;


    return{
      x:
        (
          T.e*X-
          T.b*Y
        )/det,

      y:
        (
          -T.d*X+
          T.a*Y
        )/det
    };
  };
}


/* =========================================================
   マーカー探索用
========================================================= */

function gray(
  imageData,
  x,
  y
){

  const p=
    getPixel(
      imageData,
      x,
      y
    );


  if(!p){
    return 255;
  }


  return(
    .299*p.r+
    .587*p.g+
    .114*p.b
  );
}


/* =========================================================
   リングスコア
========================================================= */

function ringScore(
  imageData,
  cx,
  cy,
  radius
){

  let outerDark=0;
  let outerTotal=0;

  let middleBright=0;
  let middleTotal=0;


  /*
   * 外側リング
   */
  for(
    let a=0;
    a<360;
    a+=8
  ){

    const rad=
      a*Math.PI/180;


    const x=
      cx+
      Math.cos(rad)*
      radius;

    const y=
      cy+
      Math.sin(rad)*
      radius;


    const g=
      gray(
        imageData,
        x,
        y
      );


    outerTotal++;


    if(g<170){
      outerDark++;
    }
  }


  /*
   * 内側の白い部分
   */
  for(
    let a=0;
    a<360;
    a+=12
  ){

    const rad=
      a*Math.PI/180;


    const x=
      cx+
      Math.cos(rad)*
      radius*.52;

    const y=
      cy+
      Math.sin(rad)*
      radius*.52;


    const g=
      gray(
        imageData,
        x,
        y
      );


    middleTotal++;


    if(g>150){
      middleBright++;
    }
  }


  if(
    !outerTotal||
    !middleTotal
  ){

    return 0;
  }


  return(
    outerDark/outerTotal*1.7+
    middleBright/middleTotal*.7
  );
}


/* =========================================================
   マーカー候補
========================================================= */

function findMarkers(
  imageData
){

  const w=
    imageData.width;

  const h=
    imageData.height;


  /*
   * 画像を縮小して検索
   */
  const scale=
    Math.max(
      1,
      Math.max(w,h)/700
    );


  const candidates=[];


  const minR=
    Math.max(
      6,
      22/scale
    );


  const maxR=
    Math.min(
      90,
      65/scale
    );


  const step=
    Math.max(
      3,
      Math.round(5*scale)
    );


  for(
    let y=20;
    y<h-20;
    y+=step
  ){

    for(
      let x=20;
      x<w-20;
      x+=step
    ){

      /*
       * 中心付近が極端に暗いものを
       * 少し優先
       */
      let best=0;
      let bestR=0;


      for(
        let r=minR;
        r<=maxR;
        r+=Math.max(2,scale*2)
      ){

        const s=
          ringScore(
            imageData,
            x,
            y,
            r
          );


        if(s>best){

          best=s;
          bestR=r;
        }
      }


      if(best<1.35){
        continue;
      }


      candidates.push({
        x:x,
        y:y,
        r:bestR,
        score:best
      });
    }
  }


  candidates.sort(
    (a,b)=>
      b.score-a.score
  );


  /*
   * 同じリングの重複候補を削除
   */
  const result=[];


  for(
    const c of candidates
  ){

    let near=false;


    for(
      const q of result
    ){

      if(
        Math.hypot(
          c.x-q.x,
          c.y-q.y
        )<
        Math.max(
          c.r,
          q.r
        )*1.8
      ){

        near=true;
        break;
      }
    }


    if(!near){

      result.push(c);
    }


    if(result.length>=25){
      break;
    }
  }


  return result;
}


/* =========================================================
   3マーカーを決定
========================================================= */

function getMarkerTriangle(
  imageData
){

  const candidates=
    findMarkers(
      imageData
    );


  if(
    candidates.length<3
  ){

    return null;
  }


  let best=null;
  let bestScore=Infinity;


  const n=
    Math.min(
      candidates.length,
      18
    );


  /*
   * 3点の組み合わせ
   */
  for(
    let i=0;
    i<n;
    i++
  ){

    for(
      let j=i+1;
      j<n;
      j++
    ){

      for(
        let k=j+1;
        k<n;
        k++
      ){

        const p=[
          candidates[i],
          candidates[j],
          candidates[k]
        ];


        /*
         * 最長辺
         */
        const d01=
          distance(p[0],p[1]);

        const d02=
          distance(p[0],p[2]);

        const d12=
          distance(p[1],p[2]);


        const ds=[
          {
            a:0,
            b:1,
            d:d01
          },
          {
            a:0,
            b:2,
            d:d02
          },
          {
            a:1,
            b:2,
            d:d12
          }
        ];


        ds.sort(
          (a,b)=>
            b.d-a.d
        );


        const longest=
          ds[0];

        const other1=
          ds[1];

        const other2=
          ds[2];


        if(
          longest.d<50
        ){
          continue;
        }


        /*
         * 理想比率
         *
         * TL-TR = 990
         * TL-BL = 970
         * TR-BL = sqrt(...)
         */
        const idealLong=
          Math.hypot(
            990,
            970
          );


        const scale=
          longest.d/
          idealLong;


        const expectedA=
          990*scale;

        const expectedB=
          970*scale;


        /*
         * 2本の短い辺が
         * だいたい990/970比率
         */
        const shortError=
          Math.min(
            Math.abs(
              other1.d-
              expectedA
            )+
            Math.abs(
              other2.d-
              expectedB
            ),

            Math.abs(
              other1.d-
              expectedB
            )+
            Math.abs(
              other2.d-
              expectedA
            )
          );


        if(
          shortError>
          longest.d*.65
        ){

          continue;
        }


        if(
          shortError<
          bestScore
        ){

          bestScore=
            shortError;

          best=p;
        }
      }
    }
  }


  if(!best){
    return null;
  }


  /*
   * 直角に近い点をTLにする。
   *
   * 最長辺の反対側がTL。
   */
  const pairs=[
    {
      a:0,
      b:1,
      d:distance(best[0],best[1])
    },
    {
      a:0,
      b:2,
      d:distance(best[0],best[2])
    },
    {
      a:1,
      b:2,
      d:distance(best[1],best[2])
    }
  ];


  pairs.sort(
    (a,b)=>
      b.d-a.d
  );


  const longest=
    pairs[0];


  const tlIndex=
    [0,1,2].find(
      i=>
        i!==longest.a &&
        i!==longest.b
    );


  const tl=
    best[tlIndex];

  const p1=
    best[longest.a];

  const p2=
    best[longest.b];


  /*
   * TLから見て
   * どちらが右上か判定
   */
  const v1={
    x:p1.x-tl.x,
    y:p1.y-tl.y
  };


  const v2={
    x:p2.x-tl.x,
    y:p2.y-tl.y
  };


  /*
   * カメラ座標で
   * 上にあるほうをTR
   */
  let tr;
  let bl;


  if(
    p1.y<p2.y
  ){

    tr=p1;
    bl=p2;

  }else{

    tr=p2;
    bl=p1;
  }


  /*
   * もし極端に横/縦の判定になったら
   * x座標も利用
   */
  if(
    Math.abs(
      p1.y-p2.y
    )<
    Math.abs(
      p1.x-p2.x
    )*.15
  ){

    if(p1.x>p2.x){

      tr=p1;
      bl=p2;

    }else{

      tr=p2;
      bl=p1;
    }
  }


  return[
    {
      x:tl.x,
      y:tl.y
    },
    {
      x:tr.x,
      y:tr.y
    },
    {
      x:bl.x,
      y:bl.y
    }
  ];
}


/* =========================================================
   デコード
========================================================= */

function decodeBits(bits){

  if(
    bits.length!==SLOT_COUNT
  ){

    return null;
  }


  const packet=[];


  /*
   * 17グループ
   */
  for(
    let g=0;
    g<GROUP_COUNT;
    g++
  ){

    const group=
      bits.slice(
        g*GROUP_SIZE,
        (g+1)*GROUP_SIZE
      );


    let ones=0;


    for(
      const b of group
    ){

      ones+=b;
    }


    /*
     * 生成側では必ず16個
     */
    if(
      ones!==ON_COUNT
    ){

      return null;
    }


    const value=
      rank(group);


    const groupBits=
      rankToBits(value);


    packet.push(
      ...groupBits
    );
  }


  /*
   * 493bit
   */
  if(
    packet.length<
    493
  ){

    return null;
  }


  /*
   * 文字数
   */
  let length=0;


  for(
    let i=0;
    i<5;
    i++
  ){

    length=
      length*2+
      packet[i];
  }


  if(
    length<0||
    length>30
  ){

    return null;
  }


  /*
   * body = 480bit
   */
  const body=
    packet.slice(
      5,
      5+480
    );


  /*
   * 保存されているCRC
   */
  let storedCRC=0;


  for(
    let i=0;
    i<8;
    i++
  ){

    storedCRC=
      storedCRC*2+
      packet[
        5+480+i
      ];
  }


  /*
   * ★生成側と同じ
   *
   * crc8(body)
   */
  const actualCRC=
    crc8(body);


  if(
    actualCRC!==storedCRC
  ){

    return null;
  }


  /*
   * UTF-16
   */
  let text="";


  for(
    let i=0;
    i<length;
    i++
  ){

    let code=0;


    for(
      let b=0;
      b<16;
      b++
    ){

      code=
        code*2+
        body[
          i*16+b
        ];
    }


    text+=
      String.fromCharCode(
        code
      );
  }


  return text;
}


/* =========================================================
   画像をPOTE CODEとして解析
========================================================= */

function decodeImage(
  imageData
){

  const triangle=
    getMarkerTriangle(
      imageData
    );


  if(!triangle){

    return null;
  }


  const T=
    affine(
      triangle,
      MARKS
    );


  if(!T){

    return null;
  }


  const inverse=
    inverseAffine(T);


  if(!inverse){

    return null;
  }


  const bits=
    readSlots(
      imageData,
      inverse
    );


  /*
   * まず通常判定
   */
  let result=
    decodeBits(bits);


  if(result!==null){

    return result;
  }


  /*
   * カメラのぼけ・色の影響で
   * ON/OFFが逆になる可能性はないので
   * ここでは誤読結果を返さない。
   */
  return null;
}


/* =========================================================
   カメラ
========================================================= */

let stream=null;


async function startCamera(){

  if(
    !navigator.mediaDevices||
    !navigator.mediaDevices.getUserMedia
  ){

    return;
  }


  try{

    stream=
      await navigator.mediaDevices
      .getUserMedia({

        video:{
          facingMode:{
            ideal:"environment"
          },

          width:{
            ideal:1920
          },

          height:{
            ideal:1080
          }
        },

        audio:false
      });


    video.srcObject=
      stream;


  }catch(e){

    /*
     * カメラが使えない場合でも
     * 画像読み込みは利用可能
     */
  }
}


/* =========================================================
   カメラ画像取得
========================================================= */

function capture(){

  if(
    !video.videoWidth||
    !video.videoHeight
  ){

    return null;
  }


  canvas.width=
    video.videoWidth;

  canvas.height=
    video.videoHeight;


  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );


  return ctx.getImageData(
    0,
    0,
    canvas.width,
    canvas.height
  );
}


/* =========================================================
   スキャンボタン
========================================================= */

scanButton.addEventListener(
  "click",
  async()=>{

    flash.classList.remove(
      "on"
    );

    void flash.offsetWidth;

    flash.classList.add(
      "on"
    );


    const image=
      capture();


    if(!image){

      return;
    }


    await new Promise(
      resolve=>
        requestAnimationFrame(
          resolve
        )
    );


    const text=
      decodeImage(
        image
      );


    if(
      text!==null
    ){

      showResult(
        text
      );
    }
  }
);


/* =========================================================
   画像読み込み
========================================================= */

imageButton.addEventListener(
  "click",
  ()=>{
    imageInput.click();
  }
);


imageInput.addEventListener(
  "change",
  ()=>{

    const file=
      imageInput.files[0];


    if(!file){

      return;
    }


    const image=
      new Image();


    image.onload=()=>{

      canvas.width=
        image.naturalWidth;

      canvas.height=
        image.naturalHeight;


      ctx.drawImage(
        image,
        0,
        0
      );


      const imageData=
        ctx.getImageData(
          0,
          0,
          canvas.width,
          canvas.height
        );


      const text=
        decodeImage(
          imageData
        );


      if(
        text!==null
      ){

        showResult(
          text
        );
      }


      URL.revokeObjectURL(
        image.src
      );
    };


    image.src=
      URL.createObjectURL(
        file
      );
  }
);


/* =========================================================
   結果
========================================================= */

function showResult(text){

  /*
   * URLなら新しいタブ
   */
  if(
    /^https?:\/\/[^\s]+$/i
      .test(text)
  ){

    const win=
      window.open(
        text,
        "_blank"
      );


    /*
     * iOS Safariなどで
     * ポップアップが止まった場合
     */
    if(!win){

      resultText.textContent=
        text;

      result.classList.add(
        "show"
      );
    }


    return;
  }


  resultText.textContent=
    text;

  result.classList.add(
    "show"
  );
}


/* =========================================================
   閉じる
========================================================= */

closeResult.addEventListener(
  "click",
  ()=>{
    result.classList.remove(
      "show"
    );
  }
);


/* =========================================================
   カメラ開始
========================================================= */

startCamera();


/* =========================================================
   終了時
========================================================= */

window.addEventListener(
  "pagehide",
  ()=>{

    if(stream){

      for(
        const track of
        stream.getTracks()
      ){

        track.stop();
      }
    }
  }
);
