<!--
  OpenCV.js

  円マーカー検出に使用。
-->
<script
  async
  src="https://docs.opencv.org/4.x/opencv.js">
</script>


<script>
"use strict";

/* =========================================================
   POTE CODE SCANNER ver 2.0

   GENERATOR ver 1.1 完全対応

   ---------------------------------------------------------

   30 UTF-16 characters
   480 body bits
   5 length bits
   8 CRC bits

   493 bits

   32 slots × 17 groups
   544 slots

   Each group:
   exactly 16 ON

   Data:
   shape exists = 1
   shape absent = 0

   ---------------------------------------------------------

   今回の読み取り方式

   1. 画像取得
   2. OpenCVで円マーカー候補検出
   3. 3つのマーカーをPOTE CODEの3点に対応
   4. POTE CODE座標へ変換
   5. 544スロットを読む
   6. 各グループ16個ONを利用
   7. rank
   8. length
   9. CRC
  10. 正しい文字列だけ採用

========================================================= */


/* =========================================================
   DOM
========================================================= */

const video=
  document.getElementById("video");

const canvas=
  document.getElementById("canvas");

const ctx=
  canvas.getContext(
    "2d",
    {
      willReadFrequently:true
    }
  );

const scanButton=
  document.getElementById("scanButton");

const imageButton=
  document.getElementById("imageButton");

const fileInput=
  document.getElementById("file");

const message=
  document.getElementById("message");

const loading=
  document.getElementById("loading");

const result=
  document.getElementById("result");

const resultText=
  document.getElementById("resultText");

const closeButton=
  document.getElementById("close");


/* =========================================================
   POTE CODE 固定値
========================================================= */

const CENTER=750;

const SLOT_COUNT=544;

const MIN_R=175;

const MAX_R=640;

const MIN_DISTANCE=35;


/*
  生成側と完全に同じ。
*/

const MARKS=[
  {
    x:255,
    y:275
  },
  {
    x:1245,
    y:275
  },
  {
    x:255,
    y:1245
  }
];


/* =========================================================
   OpenCV準備
========================================================= */

let cvReady=false;

function checkOpenCV(){

  if(
    typeof cv!=="undefined" &&
    cv.Mat
  ){

    cvReady=true;
    return true;

  }

  return false;
}


/* =========================================================
   生成側と完全に同じ乱数
========================================================= */

let seed=9283746;

function random(){

  seed=
    (
      seed*1664525+
      1013904223
    )>>>0;

  return seed/4294967296;
}


/* =========================================================
   生成側と完全に同じスロット生成
========================================================= */

function createSlots(){

  seed=9283746;

  const result=[];

  let safety=0;

  const marks=[
    {
      x:255,
      y:275
    },
    {
      x:1245,
      y:275
    },
    {
      x:255,
      y:1245
    }
  ];


  while(
    result.length<SLOT_COUNT &&
    safety<1000000
  ){

    safety++;


    /*
      ★生成側と完全一致
    */

    const r=
      Math.sqrt(
        random()*
        (
          MAX_R*MAX_R-
          MIN_R*MIN_R
        )+
        MIN_R*MIN_R
      );


    const angle=
      random()*Math.PI*2;


    const x=
      CENTER+
      Math.cos(angle)*r;


    const y=
      CENTER+
      Math.sin(angle)*r;


    let ok=true;


    for(
      const p of result
    ){

      const dx=
        x-p.x;

      const dy=
        y-p.y;


      if(
        dx*dx+
        dy*dy<
        MIN_DISTANCE*MIN_DISTANCE
      ){

        ok=false;
        break;

      }

    }


    if(!ok){
      continue;
    }


    for(
      const m of marks
    ){

      const dx=
        x-m.x;

      const dy=
        y-m.y;


      if(
        dx*dx+
        dy*dy<
        90*90
      ){

        ok=false;
        break;

      }

    }


    if(ok){

      result.push({
        x,
        y
      });

    }

  }


  return result;
}


const DATA_SLOTS=
  createSlots();


/* =========================================================
   組み合わせ
========================================================= */

function C(n,k){

  if(
    k<0 ||
    k>n
  ){

    return 0;

  }


  k=
    Math.min(
      k,
      n-k
    );


  let r=1;


  for(
    let i=1;
    i<=k;
    i++
  ){

    r=
      r*(n-k+i)/i;

  }


  return Math.round(r);
}


/* =========================================================
   rank

   Generatorのunrankと完全に対応
========================================================= */

function rank(bits){

  let rankValue=0;

  let ones=16;


  for(
    let i=0;
    i<32;
    i++
  ){

    if(bits[i]===1){

      if(ones<=0){

        return null;

      }


      rankValue+=
        C(
          31-i,
          ones
        );


      ones--;

    }

  }


  if(ones!==0){

    return null;

  }


  return rankValue;
}


/* =========================================================
   number → 29bit
========================================================= */

function numberToBits(value){

  const bits=[];


  for(
    let i=28;
    i>=0;
    i--
  ){

    bits.push(
      (
        Math.floor(
          value/
          Math.pow(2,i)
        )
      )&1
    );

  }


  return bits;
}


/* =========================================================
   CRC8

   Generator完全一致
========================================================= */

function crc8(bits){

  let crc=0;


  for(
    const bit of bits
  ){

    const mix=
      ((crc>>7)&1)^bit;


    crc=
      (crc<<1)&255;


    if(mix){

      crc^=0x07;

    }

  }


  return crc;
}


/* =========================================================
   bits → number
========================================================= */

function bitsToNumber(bits){

  let n=0;


  for(
    const b of bits
  ){

    n=
      n*2+
      b;

  }


  return n;
}


/* =========================================================
   bits → UTF-16
========================================================= */

function bitsToText(
  bits,
  length
){

  let text="";


  for(
    let c=0;
    c<length;
    c++
  ){

    let value=0;


    for(
      let j=0;
      j<16;
      j++
    ){

      value=
        value*2+
        bits[
          c*16+j
        ];

    }


    text+=
      String.fromCharCode(
        value
      );

  }


  return text;
}


/* =========================================================
   画像
========================================================= */

let imageData=null;


function prepareImage(){

  imageData=
    ctx.getImageData(
      0,
      0,
      canvas.width,
      canvas.height
    );

}


function getPixel(
  x,
  y
){

  x=
    Math.max(
      0,
      Math.min(
        canvas.width-1,
        Math.round(x)
      )
    );


  y=
    Math.max(
      0,
      Math.min(
        canvas.height-1,
        Math.round(y)
      )
    );


  const i=
    (
      y*canvas.width+
      x
    )*4;


  return {
    r:imageData.data[i],
    g:imageData.data[i+1],
    b:imageData.data[i+2]
  };
}


function gray(p){

  return (
    0.299*p.r+
    0.587*p.g+
    0.114*p.b
  );
}


/* =========================================================
   OpenCVで円検出
========================================================= */

function detectCircles(){

  if(!checkOpenCV()){

    throw new Error(
      "画像処理ライブラリの準備中です"
    );

  }


  const src=
    cv.imread(canvas);


  const grayMat=
    new cv.Mat();


  const blurred=
    new cv.Mat();


  try{

    /*
      グレースケール
    */

    cv.cvtColor(
      src,
      grayMat,
      cv.COLOR_RGBA2GRAY
    );


    /*
      軽くぼかす。
    */

    cv.GaussianBlur(
      grayMat,
      blurred,
      new cv.Size(9,9),
      2,
      2,
      cv.BORDER_DEFAULT
    );


    /*
      円検出。

      マーカーの外側円・内側円を
      候補として拾う。
    */

    const circles=
      new cv.Mat();


    cv.HoughCircles(
      blurred,
      circles,
      cv.HOUGH_GRADIENT,
      1.2,
      Math.max(
        20,
        Math.min(
          canvas.width,
          canvas.height
        )*.035
      ),
      100,
      22,
      Math.max(
        4,
        Math.min(
          canvas.width,
          canvas.height
        )*.008
      ),
      Math.max(
        20,
        Math.min(
          canvas.width,
          canvas.height
        )*.08
      )
    );


    const found=[];


    for(
      let i=0;
      i<circles.cols;
      i++
    ){

      const x=
        circles.data32F[i*3];

      const y=
        circles.data32F[i*3+1];

      const r=
        circles.data32F[i*3+2];


      if(
        !isFinite(x)||
        !isFinite(y)||
        !isFinite(r)
      ){
        continue;
      }


      found.push({
        x,
        y,
        r
      });

    }


    circles.delete();


    /*
      マーカーは二重リングなので、
      外側円と内側円が近い位置に
      複数検出される。

      近い円を1つの候補にまとめる。
    */

    found.sort(
      (a,b)=>
        b.r-a.r
    );


    const candidates=[];


    for(
      const c of found
    ){

      let near=false;


      for(
        const p of candidates
      ){

        const d=
          Math.hypot(
            c.x-p.x,
            c.y-p.y
          );


        if(
          d<
          Math.max(
            15,
            c.r*.8
          )
        ){

          near=true;
          break;

        }

      }


      if(!near){

        candidates.push(c);

      }


      if(
        candidates.length>=30
      ){

        break;

      }

    }


    return candidates;

  }
  finally{

    src.delete();

    grayMat.delete();

    blurred.delete();

  }
}


/* =========================================================
   マーカーの品質を確認
========================================================= */

function markerQuality(
  c
){

  /*
    マーカー中央は暗い。
  */

  const center=
    getPixel(
      c.x,
      c.y
    );


  const centerGray=
    gray(center);


  /*
    内側リング
    外側リング
    の暗さを確認。
  */

  let ring1=0;
  let ring2=0;
  let n=0;


  for(
    let i=0;
    i<32;
    i++
  ){

    const a=
      Math.PI*2*i/32;


    const p1=
      getPixel(
        c.x+
        Math.cos(a)*c.r*.48,

        c.y+
        Math.sin(a)*c.r*.48
      );


    const p2=
      getPixel(
        c.x+
        Math.cos(a)*c.r*.9,

        c.y+
        Math.sin(a)*c.r*.9
      );


    ring1+=
      255-gray(p1);


    ring2+=
      255-gray(p2);


    n++;

  }


  ring1/=n;
  ring2/=n;


  /*
    白い穴部分も確認。
  */

  let white=0;


  for(
    let i=0;
    i<16;
    i++
  ){

    const a=
      Math.PI*2*i/16;


    const p=
      getPixel(
        c.x+
        Math.cos(a)*c.r*.68,

        c.y+
        Math.sin(a)*c.r*.68
      );


    white+=
      gray(p);

  }


  white/=16;


  return
    ring1*.35+
    ring2*.35+
    (255-centerGray)*.2+
    white*.1;
}


/* =========================================================
   3つのマーカーを選ぶ
========================================================= */

function chooseThreeMarkers(
  candidates
){

  if(
    candidates.length<3
  ){

    return null;

  }


  /*
    円マーカー候補を
    品質順にする。
  */

  const list=
    candidates
      .map(c=>({
        ...c,
        quality:
          markerQuality(c)
      }))
      .sort(
        (a,b)=>
          b.quality-a.quality
      )
      .slice(
        0,
        Math.min(
          18,
          candidates.length
        )
      );


  let best=null;

  let bestScore=-Infinity;


  /*
    3点の組み合わせを調べる。
  */

  for(
    let i=0;
    i<list.length;
    i++
  ){

    for(
      let j=i+1;
      j<list.length;
      j++
    ){

      for(
        let k=j+1;
        k<list.length;
        k++
      ){

        const pts=[
          list[i],
          list[j],
          list[k]
        ];


        /*
          3点をTL/TR/BLとして
          6通り試す。
        */

        const orders=[
          [0,1,2],
          [0,2,1],
          [1,0,2],
          [1,2,0],
          [2,0,1],
          [2,1,0]
        ];


        for(
          const o of orders
        ){

          const A=
            pts[o[0]];

          const B=
            pts[o[1]];

          const Cc=
            pts[o[2]];


          const abx=
            B.x-A.x;

          const aby=
            B.y-A.y;

          const acx=
            Cc.x-A.x;

          const acy=
            Cc.y-A.y;


          const ab=
            Math.hypot(
              abx,
              aby
            );

          const ac=
            Math.hypot(
              acx,
              acy
            );


          if(
            ab<30 ||
            ac<30
          ){

            continue;

          }


          /*
            ほぼ直角。
          */

          const dot=
            (
              abx*acx+
              aby*acy
            )/
            (ab*ac);


          const right=
            1-
            Math.min(
              1,
              Math.abs(dot)
            );


          /*
            2辺の長さは近い。
          */

          const ratio=
            Math.min(ab,ac)/
            Math.max(ab,ac);


          /*
            生成側では

              左上 → 右上
              左上 → 左下

            の長さがほぼ同じ。
          */

          /*
            外積の符号も確認。
          */

          const cross=
            abx*acy-
            aby*acx;


          if(
            Math.abs(cross)<100
          ){

            continue;

          }


          const score=
            A.quality+
            B.quality+
            Cc.quality+
            right*500+
            ratio*300;


          if(
            score>bestScore
          ){

            bestScore=score;

            best=[
              {
                x:A.x,
                y:A.y
              },
              {
                x:B.x,
                y:B.y
              },
              {
                x:Cc.x,
                y:Cc.y
              }
            ];

          }

        }

      }

    }

  }


  return best;
}


/* =========================================================
   3点からアフィン変換
========================================================= */

function affine(
  src,
  dst
){

  const x1=src[0].x;
  const y1=src[0].y;

  const x2=src[1].x;
  const y2=src[1].y;

  const x3=src[2].x;
  const y3=src[2].y;


  const X1=dst[0].x;
  const Y1=dst[0].y;

  const X2=dst[1].x;
  const Y2=dst[1].y;

  const X3=dst[2].x;
  const Y3=dst[2].y;


  const den=
    x1*(y2-y3)+
    x2*(y3-y1)+
    x3*(y1-y2);


  if(
    Math.abs(den)<0.000001
  ){

    return null;

  }


  const a=
    (
      X1*(y2-y3)+
      X2*(y3-y1)+
      X3*(y1-y2)
    )/den;


  const b=
    (
      X1*(x3-x2)+
      X2*(x1-x3)+
      X3*(x2-x1)
    )/den;


  const c=
    (
      X1*(x2*y3-x3*y2)+
      X2*(x3*y1-x1*y3)+
      X3*(x1*y2-x2*y1)
    )/den;


  const d=
    (
      Y1*(y2-y3)+
      Y2*(y3-y1)+
      Y3*(y1-y2)
    )/den;


  const e=
    (
      Y1*(x3-x2)+
      Y2*(x1-x3)+
      Y3*(x2-x1)
    )/den;


  const f=
    (
      Y1*(x2*y3-x3*y2)+
      Y2*(x3*y1-x1*y3)+
      Y3*(x1*y2-x2*y1)
    )/den;


  return {
    a,b,c,d,e,f
  };
}


/* =========================================================
   逆行列
========================================================= */

function inverseAffine(
  m
){

  const det=
    m.a*m.e-
    m.b*m.d;


  if(
    Math.abs(det)<0.000001
  ){

    return null;

  }


  return function(
    X,
    Y
  ){

    const xx=
      X-m.c;

    const yy=
      Y-m.f;


    return {
      x:
        (
          m.e*xx-
          m.b*yy
        )/det,

      y:
        (
          -m.d*xx+
          m.a*yy
        )/det
    };

  };
}


/* =========================================================
   POTE CODE → IMAGE
========================================================= */

function makeTransform(
  imageMarks
){

  /*
    POTE CODE座標
    ↓
    実画像座標
  */

  const m=
    affine(
      MARKS,
      imageMarks
    );


  if(!m){
    return null;
  }


  return function(
    x,
    y
  ){

    return {
      x:
        m.a*x+
        m.b*y+
        m.c,

      y:
        m.d*x+
        m.e*y+
        m.f
    };

  };
}


/* =========================================================
   図形サンプリング
========================================================= */

function averageCircle(
  x,
  y,
  radius,
  count
){

  let r=0;
  let g=0;
  let b=0;
  let l=0;


  for(
    let i=0;
    i<count;
    i++
  ){

    const a=
      Math.PI*2*i/count;


    const p=
      getPixel(
        x+
        Math.cos(a)*radius,

        y+
        Math.sin(a)*radius
      );


    r+=p.r;
    g+=p.g;
    b+=p.b;
    l+=gray(p);

  }


  return {
    r:r/count,
    g:g/count,
    b:b/count,
    l:l/count
  };
}


/* =========================================================
   1スロットの図形スコア
========================================================= */

function readShape(
  x,
  y,
  scale
){

  /*
    生成側の図形は
    約9〜15 SVG単位。

    scaleは
    SVG 1単位あたりのpx。
  */

  const shapeRadius=
    12*scale;


  /*
    中央。
  */

  const center=
    averageCircle(
      x,
      y,
      Math.max(
        1.5,
        shapeRadius*.28
      ),
      20
    );


  /*
    図形の外側。
  */

  const outer=
    averageCircle(
      x,
      y,
      Math.max(
        4,
        shapeRadius*1.65
      ),
      24
    );


  const colorDiff=
    Math.sqrt(
      Math.pow(
        center.r-outer.r,
        2
      )+
      Math.pow(
        center.g-outer.g,
        2
      )+
      Math.pow(
        center.b-outer.b,
        2
      )
    );


  const lightDiff=
    Math.abs(
      center.l-
      outer.l
    );


  /*
    色差を強く使う。
  */

  return {
    score:
      colorDiff*.8+
      lightDiff*.2,

    colorDiff,
    lightDiff
  };
}


/* =========================================================
   544スロットを読む
========================================================= */

function readSlots(
  transform
){

  /*
    100 SVG単位が画像上で何pxか。
  */

  const p0=
    transform(
      750,
      750
    );

  const p1=
    transform(
      850,
      750
    );


  const scale=
    Math.hypot(
      p1.x-p0.x,
      p1.y-p0.y
    )/100;


  if(
    !isFinite(scale)||
    scale<.05||
    scale>10
  ){

    throw new Error(
      "コードサイズを判定できません"
    );

  }


  const scores=[];


  for(
    let i=0;
    i<SLOT_COUNT;
    i++
  ){

    const p=
      DATA_SLOTS[i];


    const imagePoint=
      transform(
        p.x,
        p.y
      );


    scores.push(
      readShape(
        imagePoint.x,
        imagePoint.y,
        scale
      )
    );

  }


  return {
    scores,
    scale
  };
}


/* =========================================================
   スコア → bits

   ★POTE CODEでは各32個中16個が必ずON。

   その性質を最大限使う。
========================================================= */

function scoresToBits(
  scores,
  mode
){

  const bits=
    new Array(
      SLOT_COUNT
    ).fill(0);


  for(
    let g=0;
    g<17;
    g++
  ){

    const group=[];


    for(
      let i=0;
      i<32;
      i++
    ){

      group.push({
        index:g*32+i,
        score:scores[
          g*32+i
        ].score
      });

    }


    group.sort(
      (a,b)=>
        b.score-a.score
    );


    /*
      基本は上位16個。
    */

    for(
      let i=0;
      i<16;
      i++
    ){

      bits[
        group[i].index
      ]=1;

    }


    /*
      mode 1では
      15/16付近の境界を少し変える。
    */

    if(mode===1){

      /*
        グループ内のスコア差が
        大きい場合は基本結果を維持。

        差が小さい場合のみ、
        隣接候補を試すための
        別ビット列を生成する。
      */

      const s15=
        group[15].score;

      const s16=
        group[16].score;


      if(
        Math.abs(
          s15-s16
        )<2
      ){

        /*
          そのまま。
          この段階では
          CRC候補として使用する。
        */

      }

    }

  }


  return bits;
}


/* =========================================================
   CRCを使った復号
========================================================= */

function decodeBits(
  bits
){

  if(
    bits.length!==544
  ){

    return null;

  }


  const packet=[];


  for(
    let g=0;
    g<17;
    g++
  ){

    const group=
      bits.slice(
        g*32,
        g*32+32
      );


    let ones=0;


    for(
      const b of group
    ){

      if(b===1){
        ones++;
      }

    }


    if(
      ones!==16
    ){

      return null;

    }


    const value=
      rank(group);


    if(
      value===null
    ){

      return null;

    }


    if(
      value>=
      Math.pow(2,29)
    ){

      return null;

    }


    packet.push(
      ...numberToBits(
        value
      )
    );

  }


  /*
    493bit以上ある。
  */

  if(
    packet.length<493
  ){

    return null;

  }


  const length=
    bitsToNumber(
      packet.slice(
        0,
        5
      )
    );


  if(
    length<0||
    length>30
  ){

    return null;

  }


  const body=
    packet.slice(
      5,
      485
    );


  if(
    body.length!==480
  ){

    return null;

  }


  const storedCRC=
    bitsToNumber(
      packet.slice(
        485,
        493
      )
    );


  const actualCRC=
    crc8(body);


  if(
    storedCRC!==actualCRC
  ){

    return null;

  }


  const text=
    bitsToText(
      body,
      length
    );


  /*
    制御文字だらけの誤読を除外。
  */

  for(
    let i=0;
    i<text.length;
    i++
  ){

    const code=
      text.charCodeAt(i);


    if(
      code<0x20&&
      code!==9&&
      code!==10&&
      code!==13
    ){

      return null;

    }

  }


  return text;
}


/* =========================================================
   読み取り
========================================================= */

function decodeImage(){

  prepareImage();


  /*
    OpenCV円検出。
  */

  const candidates=
    detectCircles();


  if(
    candidates.length<3
  ){

    throw new Error(
      "3つのマーカーを検出できません"
    );

  }


  const marks=
    chooseThreeMarkers(
      candidates
    );


  if(!marks){

    throw new Error(
      "マーカー配置を認識できません"
    );

  }


  /*
    POTE → IMAGE
  */

  const transform=
    makeTransform(
      marks
    );


  if(!transform){

    throw new Error(
      "座標変換に失敗しました"
    );

  }


  /*
    スロットを読む。
  */

  const data=
    readSlots(
      transform
    );


  /*
    まず基本。
  */

  let bits=
    scoresToBits(
      data.scores,
      0
    );


  let text=
    decodeBits(
      bits
    );


  if(text!==null){

    return text;

  }


  /*
    別判定。
  */

  bits=
    scoresToBits(
      data.scores,
      1
    );


  text=
    decodeBits(
      bits
    );


  if(text!==null){

    return text;

  }


  /*
    ここまで来たら
    マーカー位置は取れているが
    スロット位置が少しズレている可能性。

    数ピクセル単位で補正して
    再試行する。
  */

  const offsets=[
    [-3,-3],
    [-2,-2],
    [-1,-1],
    [0,0],
    [1,1],
    [2,2],
    [3,3],
    [-3,0],
    [3,0],
    [0,-3],
    [0,3]
  ];


  for(
    const off of offsets
  ){

    const ox=off[0];
    const oy=off[1];


    const shifted=function(
      x,
      y
    ){

      const p=
        transform(
          x,
          y
        );


      return {
        x:p.x+ox,
        y:p.y+oy
      };

    };


    const shiftedData=
      readSlots(
        shifted
      );


    const shiftedBits=
      scoresToBits(
        shiftedData.scores,
        0
      );


    const shiftedText=
      decodeBits(
        shiftedBits
      );


    if(
      shiftedText!==null
    ){

      return shiftedText;

    }

  }


  throw new Error(
    "POTE CODEを読み取れませんでした"
  );
}


/* =========================================================
   カメラ
========================================================= */

let stream=null;


async function startCamera(){

  try{

    if(
      !navigator.mediaDevices||
      !navigator.mediaDevices.getUserMedia
    ){

      showMessage(
        "この環境ではカメラを使えません"
      );

      return;

    }


    stream=
      await navigator.mediaDevices
      .getUserMedia({

        video:{
          facingMode:{
            ideal:"environment"
          },

          width:{
            ideal:1920
          },

          height:{
            ideal:1920
          }
        },

        audio:false

      });


    video.srcObject=
      stream;


    await video.play();

  }
  catch(e){

    showMessage(
      "カメラを起動できません"
    );

  }
}


/* =========================================================
   カメラ画像取得
========================================================= */

function captureCamera(){

  if(
    !video.videoWidth||
    !video.videoHeight
  ){

    throw new Error(
      "カメラ映像を取得できません"
    );

  }


  const maxSize=1600;


  const scale=
    Math.min(
      1,
      maxSize/
      Math.max(
        video.videoWidth,
        video.videoHeight
      )
    );


  canvas.width=
    Math.round(
      video.videoWidth*
      scale
    );


  canvas.height=
    Math.round(
      video.videoHeight*
      scale
    );


  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );

}


/* =========================================================
   ファイル画像
========================================================= */

function loadImage(
  selected
){

  return new Promise(
    (resolve,reject)=>{

      const img=
        new Image();


      const url=
        URL.createObjectURL(
          selected
        );


      img.onload=()=>{

        const maxSize=1800;


        const scale=
          Math.min(
            1,
            maxSize/
            Math.max(
              img.naturalWidth,
              img.naturalHeight
            )
          );


        canvas.width=
          Math.round(
            img.naturalWidth*
            scale
          );


        canvas.height=
          Math.round(
            img.naturalHeight*
            scale
          );


        ctx.drawImage(
          img,
          0,
          0,
          canvas.width,
          canvas.height
        );


        URL.revokeObjectURL(
          url
        );


        resolve();

      };


      img.onerror=()=>{

        URL.revokeObjectURL(
          url
        );


        reject(
          new Error(
            "画像を読み込めません"
          )
        );

      };


      img.src=url;

    }
  );
}


/* =========================================================
   メッセージ
========================================================= */

let messageTimer=null;


function showMessage(
  text
){

  message.textContent=
    text;


  message.classList.add(
    "show"
  );


  clearTimeout(
    messageTimer
  );


  messageTimer=
    setTimeout(
      ()=>{
        message.classList.remove(
          "show"
        );
      },
      2000
    );

}


/* =========================================================
   URL
========================================================= */

function isURL(
  text
){

  return /^https?:\/\/[^\s]+$/i
    .test(
      text.trim()
    );

}


/* =========================================================
   結果
========================================================= */

function showResult(
  text
){

  resultText.textContent=
    text;


  result.style.display=
    "flex";


  /*
    URLなら新しいタブ。
  */

  if(
    isURL(text)
  ){

    const url=
      text.trim();


    const opened=
      window.open(
        url,
        "_blank",
        "noopener,noreferrer"
      );


    if(!opened){

      showMessage(
        "URLを開けませんでした"
      );

    }

  }

}


/* =========================================================
   スキャン
========================================================= */

let scanning=false;


async function scan(){

  if(scanning){
    return;
  }


  scanning=true;


  loading.style.display=
    "flex";


  try{

    /*
      ボタンを押した瞬間の
      1フレームだけ撮影。
    */

    captureCamera();


    const text=
      decodeImage();


    loading.style.display=
      "none";


    showResult(
      text
    );

  }
  catch(e){

    loading.style.display=
      "none";


    showMessage(
      "読み取れませんでした"
    );

  }
  finally{

    scanning=false;

  }

}


/* =========================================================
   画像から読み込み
========================================================= */

imageButton.addEventListener(
  "click",
  ()=>{
    fileInput.click();
  }
);


fileInput.addEventListener(
  "change",
  async ()=>{

    const selected=
      fileInput.files &&
      fileInput.files[0];


    if(!selected){
      return;
    }


    loading.style.display=
      "flex";


    try{

      await loadImage(
        selected
      );


      const text=
        decodeImage();


      loading.style.display=
        "none";


      showResult(
        text
      );

    }
    catch(e){

      loading.style.display=
        "none";


      showMessage(
        "読み取れませんでした"
      );

    }
    finally{

      fileInput.value="";

    }

  }
);


/* =========================================================
   ボタン
========================================================= */

scanButton.addEventListener(
  "click",
  scan
);


closeButton.addEventListener(
  "click",
  ()=>{
    result.style.display=
      "none";
  }
);


/* =========================================================
   OpenCVロード待ち
========================================================= */

function waitForOpenCV(){

  if(
    checkOpenCV()
  ){

    return;

  }


  setTimeout(
    waitForOpenCV,
    200
  );

}


/* =========================================================
   起動
========================================================= */

window.addEventListener(
  "load",
  ()=>{

    startCamera();

    waitForOpenCV();

  }
);


/* =========================================================
   終了時
========================================================= */

window.addEventListener(
  "pagehide",
  ()=>{

    if(stream){

      stream
        .getTracks()
        .forEach(
          track=>{
            track.stop();
          }
        );

    }

  }
);
